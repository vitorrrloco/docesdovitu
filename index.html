<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#5b321f">
<title>DOCES DO VITU</title>
<style>
:root{--dark:#4a2819;--dark2:#6b3d25;--brown:#8a5638;--cream:#fbf3e8;--cream2:#f3e3d1;--white:#fffdf9;--line:#ead7c4;--text:#392419;--muted:#8a7566;--green:#2d805b;--red:#b5483f;--orange:#b66b22;--shadow:0 8px 25px rgba(74,40,25,.08);--r:20px}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--cream);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Arial,sans-serif}
body{overflow:hidden}button,input,select,textarea{font:inherit}input,select,textarea{font-size:16px!important}button{border:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}.hidden{display:none!important}
.app{height:100dvh;display:flex;flex-direction:column}.top{height:72px;flex:0 0 72px;background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:8px 15px}.brand{display:flex;align-items:center;gap:10px}.brand-mark{width:46px;height:46px;border-radius:15px;background:var(--dark);display:grid;place-items:center;color:#fff;font-size:23px}.brand b{font-size:17px}.brand small{display:block;font-size:10px;color:var(--muted);margin-top:2px}.top-action{width:45px;height:45px;border-radius:15px;background:var(--cream2);color:var(--dark);font-size:22px}
.view{flex:1;min-height:0;overflow:auto;padding:16px 14px calc(94px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}.page{width:100%;max-width:760px;margin:auto}.head{display:flex;align-items:end;justify-content:space-between;margin:2px 2px 15px}.head h1{margin:0;font-size:27px}.head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.hero{background:linear-gradient(135deg,var(--dark),var(--dark2));color:#fff;border-radius:25px;padding:19px;margin-bottom:13px;box-shadow:var(--shadow);display:flex;justify-content:space-between}.hero small{opacity:.72}.hero h2{font-size:28px;margin:5px 0}.hero p{margin:0;opacity:.78;font-size:12px}.hero .emoji{font-size:40px;align-self:center}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.stat{background:var(--white);border:1px solid var(--line);border-radius:19px;padding:15px;min-height:105px;box-shadow:var(--shadow)}.stat small{display:block;color:var(--muted);font-size:11px}.stat strong{display:block;font-size:21px;margin-top:7px}.green{color:var(--green)}.red{color:var(--red)}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:18px}.quick button{min-height:55px;background:var(--white);border:1px solid var(--line);border-radius:16px;color:var(--dark);font-weight:800}.quick .wide{grid-column:1/-1;background:var(--dark);color:#fff}
.card{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:15px;margin-bottom:12px;box-shadow:var(--shadow)}.card h3{margin:0 0 11px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.muted{color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;margin-top:12px}.actions>*{flex:1}.primary{width:100%;min-height:52px;border-radius:15px;background:var(--dark);color:#fff;font-weight:800}.secondary{background:var(--cream2);color:var(--dark);font-weight:800;border-radius:14px;padding:12px 14px}.danger{background:#fff0ed;color:var(--red);font-weight:800;border-radius:14px;padding:12px 14px}
.list{display:grid;gap:9px}.item{background:var(--white);border:1px solid var(--line);border-radius:17px;padding:13px}.item b{font-size:15px}.item small{display:block;color:var(--muted);margin-top:4px;font-size:11px}.item .amount{font-weight:900;font-size:17px}.search{width:100%;height:49px;border:1px solid var(--line);border-radius:15px;background:#fff;padding:0 14px;outline:none;margin-bottom:11px}.pill{display:inline-flex;padding:5px 8px;border-radius:10px;font-size:10px;font-weight:800;background:var(--cream2);color:var(--brown)}.pill.green{background:#e7f4ed;color:var(--green)}.pill.red{background:#fff0ed;color:var(--red)}
.bottom{position:fixed;z-index:50;left:0;right:0;bottom:0;height:78px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#fffdf9ed;border-top:1px solid var(--line);backdrop-filter:blur(14px);display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.bottom button{background:transparent;color:var(--muted);font-size:10px;font-weight:800;border-radius:13px}.bottom button.active{background:var(--cream2);color:var(--dark)}.bottom i{display:block;font-style:normal;font-size:20px;margin-bottom:2px}
.modal-bg{position:fixed;inset:0;background:#2c170d55;z-index:100;display:grid;place-items:end center;padding:12px;animation:fade .16s ease}.modal{width:min(560px,100%);max-height:90dvh;overflow:auto;background:var(--white);border-radius:25px;padding:18px;animation:up .2s ease}.modal h2{margin:0 0 14px}.field{margin-bottom:11px}.field label{display:block;font-size:12px;font-weight:800;color:var(--dark2);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;height:49px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:0 12px;outline:none}.field textarea{height:85px;padding-top:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.toast{position:fixed;z-index:1000;left:50%;bottom:94px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:11px 15px;border-radius:13px;font-size:12px;font-weight:800;box-shadow:0 10px 30px #0003;animation:toast .2s ease}.sale-confirm-overlay{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;pointer-events:none;animation:fade .72s ease both}.sale-confirm-card{width:min(290px,78vw);padding:24px 18px 21px;border-radius:24px;background:var(--white);border:1px solid var(--line);box-shadow:0 18px 55px #4a28192e;text-align:center;animation:pop .44s cubic-bezier(.2,.85,.25,1) both}.sale-check{width:66px;height:66px;margin:0 auto 11px;border-radius:50%;display:grid;place-items:center;background:#e8f6ee;color:var(--green);font-size:37px;font-weight:900;position:relative}.sale-check:after{content:"";position:absolute;inset:-6px;border:3px solid var(--green);border-top-color:transparent;border-radius:50%;animation:spin .52s ease-out both}.sale-confirm-card b{display:block;font-size:20px}.sale-confirm-card small{display:block;margin-top:5px;color:var(--muted);font-size:11px}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes up{from{transform:translateY(15px);opacity:0}to{transform:none;opacity:1}}@keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}@keyframes spin{from{transform:rotate(-150deg);opacity:0}to{transform:rotate(220deg);opacity:1}}@keyframes toast{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}button{transition:transform .12s ease,opacity .12s ease,box-shadow .12s ease}button:active{transform:scale(.965);opacity:.9}
@media(max-width:390px){.stats{gap:7px}.stat{padding:12px}.stat strong{font-size:18px}.quick{gap:7px}.bottom{gap:2px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAfH-93y7s1YK_3je_sZlofd8XJ1z436Yk",
  authDomain: "doces-do-vitu.firebaseapp.com",
  projectId: "doces-do-vitu",
  storageBucket: "doces-do-vitu.firebasestorage.app",
  messagingSenderId: "681586131940",
  appId: "1:681586131940:web:e8c213d9865621467e7df1",
  measurementId: "G-9QDNX23V8Z"
};

const app = initializeApp(firebaseConfig);
const firestore = getFirestore(app);
const dataRef = doc(firestore, "doces_vitu", "appData");

window.firebaseCloud = {
  ready: true,
  async load() {
    const snap = await getDoc(dataRef);
    return snap.exists() ? snap.data() : null;
  },
  async save(data) {
    await setDoc(dataRef, data, { merge: true });
  }
};
window.dispatchEvent(new Event("firebase-ready"));
</script>

<script>
const KEY="doces_vitu_complete_v1213";
const $=id=>document.getElementById(id);
const money=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const round2=n=>Math.round((Number(n)+Number.EPSILON)*100)/100;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||null}catch{return null}}
let cloudSaving=false;
function save(){
  localStorage.setItem(KEY,JSON.stringify(db));
  if(window.firebaseCloud?.ready){
    clearTimeout(window.__cloudSaveTimer);
    window.__cloudSaveTimer=setTimeout(async()=>{
      try{
        cloudSaving=true;
        await window.firebaseCloud.save({
          products: db.products || [],
          clients: db.clients || [],
          sales: db.sales || [],
          payments: db.payments || [],
          logs: db.logs || [],
          cash: Number(db.cash || 0),
          updatedAt: new Date().toISOString()
        });
      }catch(e){
        console.error("Firebase: falha ao salvar",e);
      }finally{ cloudSaving=false; }
    },180);
  }
}
const baseClients=[
["Gilberto",51.50],["Gabriel",15],["Rafael",41],["Jacare",19],["Guedes",14.50],["Duarte",24],
["Eduardo",57],["Steuck",1],["Richard",71.50],["Roger",22],["Daniel Ponick",25],["Gabriel Ponick",3.50],
["Crystian",35],["Vitor",16.50],["Maria Eduarda",11],["Murilo",8],["Diovana",2],["Julio",6],
["Marinho",22],["Kricinski",38],["Mohammed",6.50],["Samuel",20],["Emanuel",14],["Jonathan",9.50],
["Eduardo Silveira",18.50],["Quintino",1.50]
];
let db=load()||{products:[],clients:[],sales:[],payments:[],logs:[],cash:0,initialized:true};
if(!db.clients.length){
  db.clients=baseClients.map(([name,debt])=>({id:uid(),name,debt:round2(debt),created:Date.now()}));
  const now=new Date().toISOString();
  db.sales=baseClients.map(([name,total],i)=>({id:uid(),clientName:name,total:round2(total),items:[],status:"pending",date:now,legacy:true}));
  db.logs=[{id:uid(),text:"Base histórica V1.2.12 carregada com 26 clientes",date:now}];
  save();
}
let current="dashboard";

function closeModal(){$("modalRoot").innerHTML=""}
function modal(title,body){$("modalRoot").innerHTML=`<div class="modal-bg" id="mb"><div class="modal"><div class="row"><h2>${title}</h2><button class="secondary" onclick="closeModal()">✕</button></div>${body}</div></div>`}
function toast(t){const x=document.createElement("div");x.className="toast";x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1700)}
function confirmBox(title,text,onYes){modal(title,`<p class="muted" style="font-size:14px;line-height:1.5">${text}</p><div class="actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" id="yes">Confirmar</button></div>`);$("yes").onclick=onYes}
function log(text){db.logs.unshift({id:uid(),text,date:new Date().toISOString()});db.logs=db.logs.slice(0,500);save()}
function debtTotal(){return round2(db.clients.reduce((a,c)=>a+Number(c.debt||0),0))}
function revenue(){return round2(db.sales.reduce((a,s)=>a+Number(s.total||0),0))}
function received(){return round2(db.payments.reduce((a,p)=>a+Number(p.amount||0),0))}
function showSaleConfirmed(){const el=document.createElement("div");el.className="sale-confirm-overlay";el.innerHTML='<div class="sale-confirm-card"><div class="sale-check">✓</div><b>Venda confirmada</b><small>Pedido registrado com sucesso</small></div>';document.body.appendChild(el);setTimeout(()=>el.remove(),760)}

function dashboard(){
 const rev=revenue(), rec=debtTotal(), avg=db.sales.length?rev/db.sales.length:0;
 const counts={};db.sales.forEach(s=>(counts[s.items?.[0]?.name||"Venda")&&(counts[s.items?.[0]?.name||"Venda"]=(counts[s.items?.[0]?.name||"Venda"]||0)+1));
 const top=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,2);
 return `<div class="page"><div class="head"><div><h1>Dashboard</h1><p>Visão geral da sua loja</p></div></div>
 <div class="hero"><div><small>Faturamento acumulado</small><h2>${money(rev)}</h2><p>${db.sales.length} lançamentos registrados</p></div><div class="emoji">🍫</div></div>
 <div class="stats"><div class="stat"><small>💰 A receber</small><strong class="red">${money(rec)}</strong></div><div class="stat"><small>📦 Estoque</small><strong>${db.products.reduce((a,p)=>a+Number(p.stock||0),0)}</strong></div><div class="stat"><small>🎯 Ticket médio</small><strong>${money(avg)}</strong></div><div class="stat"><small>🏦 Caixa</small><strong class="green">${money(db.cash)}</strong></div></div>
 <div class="quick"><button class="wide" onclick="go('quick')">⚡ Lançamento rápido</button><button onclick="go('sale')">➕ Nova venda</button><button onclick="go('product')">📦 Novo produto</button><button onclick="go('client')">👤 Novo cliente</button><button onclick="go('finance')">💰 Financeiro</button></div>
 <div class="card"><div class="row"><h3>🏆 Itens mais vendidos</h3><span class="muted">máx. 2 visíveis</span></div><div style="max-height:130px;overflow:auto">${top.length?top.map((x,i)=>`<div class="item" style="margin-bottom:7px"><div class="row"><b>${i+1}º ${esc(x[0])}</b><span class="pill">${x[1]} vendas</span></div></div>`).join(""):`<p class="muted">Ainda não há produtos com histórico detalhado.</p>`}</div></div>
 </div>`;
}
function clients(){
 return `<div class="page"><div class="head"><div><h1>Clientes</h1><p>Clientes e valores pendentes</p></div><button class="secondary" onclick="newClient()">＋</button></div>
 <input class="search" placeholder="🔎 Buscar cliente..." oninput="filterClients(this.value)">
 <div id="clientList" class="list">${clientItems(db.clients)}</div></div>`;
}
function clientItems(arr){return arr.map(c=>`<div class="item" data-client-name="${esc(c.name).toLowerCase()}"><div class="row"><div><b>${esc(c.name)}</b><small>${c.debt>0?"Valor pendente":"Sem pendência"}</small></div><div style="text-align:right"><div class="amount ${c.debt>0?"red":"green"}">${money(c.debt)}</div><button class="secondary" style="padding:7px 9px;margin-top:6px;font-size:11px" onclick="editClient('${c.id}')">Editar</button></div></div></div>`).join("")||`<div class="card"><p class="muted">Nenhum cliente cadastrado.</p></div>`}
function filterClients(q){const v=q.toLowerCase();document.querySelectorAll("[data-client-name]").forEach(x=>x.style.display=x.dataset.clientName.includes(v)?"":"none")}

function products(){
 return `<div class="page"><div class="head"><div><h1>Estoque</h1><p>Produtos, custos e quantidades</p></div><button class="secondary" onclick="newProduct()">＋</button></div>
 <div class="card"><div class="row"><b>Itens no estoque</b><span class="pill">${db.products.reduce((a,p)=>a+Number(p.stock||0),0)} unidades</span></div></div>
 <div class="list">${db.products.map(p=>`<div class="item"><div class="row"><div><b>${esc(p.name)}</b><small>Fornecedor: ${esc(p.supplier||"Não informado")} • Custo unitário ${money(p.unitCost)}</small></div><div style="text-align:right"><div class="amount">${p.stock}</div><button class="danger" style="padding:7px 9px;margin-top:6px;font-size:11px" onclick="removeStock('${p.id}')">Remover</button></div></div></div>`).join("")||`<div class="card"><p class="muted">Nenhum produto cadastrado.</p></div>`}</div></div>`;
}
function finance(){
 const r=revenue(), a=debtTotal(), rec=received();
 return `<div class="page"><div class="head"><div><h1>Financeiro</h1><p>Faturamento, recebimentos e caixa</p></div></div>
 <div class="stats"><div class="stat"><small>Faturamento</small><strong>${money(r)}</strong></div><div class="stat"><small>A receber</small><strong class="red">${money(a)}</strong></div><div class="stat"><small>Recebido</small><strong class="green">${money(rec)}</strong></div><div class="stat"><small>Caixa</small><strong class="green">${money(db.cash)}</strong></div></div>
 <div class="card"><div class="row"><div><b>Caixa disponível</b><small class="muted">Quanto de dinheiro você tem em caixa</small></div><button class="secondary" onclick="editCash()">Editar</button></div><h2 style="margin:10px 0 0">${money(db.cash)}</h2></div>
 <div class="card"><h3>Resumo</h3><p class="muted">Ticket médio: <b>${money(db.sales.length?r/db.sales.length:0)}</b></p><p class="muted">Vendas: <b>${db.sales.length}</b></p><p class="muted">Lucro histórico: <b>não calculado</b></p></div></div>`;
}
function sales(){
 return `<div class="page"><div class="head"><div><h1>Vendas</h1><p>Histórico de vendas</p></div><button class="secondary" onclick="newSale()">＋</button></div>
 <div class="list">${db.sales.slice().reverse().map(s=>`<div class="item"><div class="row"><div><b>${esc(s.clientName||"Venda balcão")}</b><small>${new Date(s.date).toLocaleString("pt-BR")} • ${s.status==="pending"?"Pendente":"Confirmada"}</small></div><div style="text-align:right"><div class="amount">${money(s.total)}</div><button class="danger" style="padding:7px 9px;margin-top:6px;font-size:11px" onclick="undoSale('${s.id}')">↶ Desfazer</button></div></div></div>`).join("")}</div></div>`;
}
function logs(){
 return `<div class="page"><div class="head"><div><h1>Log</h1><p>Histórico de ações</p></div><button class="danger" onclick="resetLogs()">Resetar</button></div><div class="list">${db.logs.map(l=>`<div class="item"><b>${esc(l.text)}</b><small>${new Date(l.date).toLocaleString("pt-BR")}</small></div>`).join("")||`<div class="card"><p class="muted">Log vazio.</p></div>`}</div></div>`;
}
function analysis(){
 const rev=revenue(), a=debtTotal();
 return `<div class="page"><div class="head"><div><h1>Análise</h1><p>Indicadores do sistema</p></div></div><div class="stats"><div class="stat"><small>Faturamento</small><strong>${money(rev)}</strong></div><div class="stat"><small>Ticket médio</small><strong>${money(db.sales.length?rev/db.sales.length:0)}</strong></div><div class="stat"><small>A receber</small><strong class="red">${money(a)}</strong></div><div class="stat"><small>Clientes</small><strong>${db.clients.length}</strong></div></div><div class="card"><h3>Sobre o lucro</h3><p class="muted">O lucro das vendas históricas não é calculado porque os custos antigos foram misturados. Novos produtos já guardam custo unitário calculado a partir do valor total ÷ quantidade.</p></div></div>`;
}
function quick(){
 return `<div class="page"><div class="head"><div><h1>Lançamento rápido ⚡</h1><p>Venda sem perder tempo</p></div></div><div class="card"><div class="field"><label>Cliente</label><select id="qClient"><option value="">Venda balcão</option>${db.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></div><div class="field"><label>Valor</label><input id="qValue" inputmode="decimal" placeholder="0,00"></div><div class="field"><label>Desconto</label><div class="muted">O valor acima já é o valor líquido da venda. Você pode alterar de R$ 3,00 para R$ 2,50, por exemplo.</div></div><button class="primary" id="qSave" onclick="saveQuick()">✓ Confirmar venda</button></div></div>`;
}
function render(){
 const views={dashboard:dashboard,clients:clients,products:products,finance:finance,sales:sales,logs:logs,analysis:analysis,quick:quick};
 const v=views[current]||dashboard;
 $("app").innerHTML=`<div class="app"><header class="top"><div class="brand"><div class="brand-mark">🍫</div><div><b>DOCES DO VITU</b><small>Sistema de vendas • Firebase</small></div></div><button class="top-action" onclick="go('logs')">☰</button></header><main class="view" id="view">${v()}</main><nav class="bottom">
 <button class="${current==='dashboard'?'active':''}" onclick="go('dashboard')"><i>⌂</i>Início</button>
 <button class="${current==='quick'?'active':''}" onclick="go('quick')"><i>⚡</i>Rápido</button>
 <button class="${current==='clients'?'active':''}" onclick="go('clients')"><i>👤</i>Clientes</button>
 <button class="${current==='products'?'active':''}" onclick="go('products')"><i>📦</i>Estoque</button>
 <button class="${current==='finance'?'active':''}" onclick="go('finance')"><i>💰</i>Financeiro</button></nav></div>`;
}
function go(v){current=v;render();requestAnimationFrame(()=>{const x=$("view");if(x)x.classList.add("page-swap")})}

function newClient(){modal("Novo cliente",`<div class="field"><label>Nome</label><input id="cn"></div><div class="field"><label>Valor pendente inicial</label><input id="cd" inputmode="decimal" value="0"></div><button class="primary" onclick="saveClient()">Salvar cliente</button>`)}
function saveClient(){const name=$("cn").value.trim();if(!name)return toast("Informe o nome");const debt=round2(parseFloat(($("cd").value||"0").replace(",","."))||0);db.clients.push({id:uid(),name,debt,created:Date.now()});save();log("Cliente cadastrado: "+name);closeModal();render()}
function editClient(id){const c=db.clients.find(x=>x.id===id);modal("Editar cliente",`<div class="field"><label>Nome</label><input id="en" value="${esc(c.name)}"></div><div class="field"><label>Valor pendente</label><input id="ed" inputmode="decimal" value="${c.debt.toFixed(2).replace(".",",")}"></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveEditClient('${id}')">Salvar</button></div>`)}
function saveEditClient(id){const c=db.clients.find(x=>x.id===id);c.name=$("en").value.trim()||c.name;c.debt=round2(parseFloat(($("ed").value||"0").replace(",","."))||0);save();log("Cliente editado: "+c.name);closeModal();render()}

function newProduct(){modal("Novo produto",`<div class="field"><label>Produto</label><input id="pn"></div><div class="field"><label>Fornecedor (opcional)</label><input id="ps"></div><div class="grid2"><div class="field"><label>Quantidade comprada</label><input id="pq" type="number" min="1" value="1"></div><div class="field"><label>Valor total da compra</label><input id="pt" inputmode="decimal" placeholder="17,99"></div></div><div class="card" style="background:var(--cream)"><small>O sistema calcula automaticamente: valor total ÷ quantidade, arredondado para 2 casas. Ex.: R$ 17,99 ÷ 50 = <b>R$ 0,36</b>.</small></div><button class="primary" onclick="saveProduct()">Salvar produto</button>`)}
function saveProduct(){const name=$("pn").value.trim();const qty=Math.max(1,parseInt($("pq").value||1));const total=round2(parseFloat(($("pt").value||"0").replace(",","."))||0);if(!name||!total)return toast("Preencha produto e valor total");const unit=round2(total/qty);db.products.push({id:uid(),name,supplier:$("ps").value.trim(),stock:qty,unitCost:unit,purchaseTotal:total,created:Date.now()});save();log(`Produto cadastrado: ${name} • ${qty} un. • custo unitário ${money(unit)}`);closeModal();render()}

function removeStock(id){const p=db.products.find(x=>x.id===id);modal("Remover do estoque",`<div class="field"><label>Quantidade a remover</label><input id="rq" type="number" min="1" max="${p.stock}" value="1"></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="danger" onclick="confirmRemoveStock('${id}')">Remover</button></div>`)}
function confirmRemoveStock(id){const p=db.products.find(x=>x.id===id);const q=Math.max(1,Math.min(p.stock,parseInt($("rq").value||1)));p.stock-=q;save();log(`Removido do estoque: ${q}x ${p.name}`);closeModal();render()}

function editCash(){modal("Caixa",`<div class="field"><label>Quanto de dinheiro você tem no caixa?</label><input id="cash" inputmode="decimal" value="${db.cash.toFixed(2).replace(".",",")}"></div><button class="primary" onclick="saveCash()">Salvar caixa</button>`)}
function saveCash(){db.cash=round2(parseFloat(($("cash").value||"0").replace(",","."))||0);save();log("Caixa atualizado para "+money(db.cash));closeModal();render()}

function newSale(){modal("Nova venda",`<div class="field"><label>Cliente</label><select id="sc"><option value="">Venda balcão</option>${db.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></div><div class="field"><label>Valor da venda</label><input id="sv" inputmode="decimal" placeholder="3,00" oninput="showDiscountPreview()"></div><div id="discountPreview" class="muted"></div><div class="field"><label>Produto (opcional)</label><select id="sp"><option value="">Sem produto</option>${db.products.map(p=>`<option value="${p.id}">${esc(p.name)} (${p.stock} un.)</option>`).join("")}</select></div><div class="actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" id="confirmSale" onclick="saveSale()">✓ Confirmar venda</button></div>`)}
function showDiscountPreview(){const x=parseFloat(($("sv").value||"0").replace(",","."))||0;const target=x;const original=window.saleOriginal||target;$("discountPreview").innerHTML=original>target?`Desconto <b>${money(original-target)}</b> (${(100-(target/original*100)).toFixed(2).replace(".",",")}%)`:""}
function saveSale(){const btn=$("confirmSale");if(btn.classList.contains("sale-saving"))return;btn.classList.add("sale-saving");const total=round2(parseFloat(($("sv").value||"0").replace(",","."))||0);if(total<=0){btn.classList.remove("sale-saving");return toast("Informe o valor")};const c=db.clients.find(x=>x.id===$("sc").value);const pid=$("sp").value;const prod=db.products.find(x=>x.id===pid);if(prod){if(prod.stock<1){btn.classList.remove("sale-saving");return toast("Estoque insuficiente")}prod.stock--}
const sale={id:uid(),clientName:c?.name||"Venda balcão",clientId:c?.id||"",total,items:prod?[{productId:prod.id,name:prod.name,qty:1}]:[],status:"pending",date:new Date().toISOString()};db.sales.push(sale);if(c)c.debt=round2(c.debt+total);save();log(`Venda registrada: ${sale.clientName} • ${money(total)}`);closeModal();showSaleConfirmed();render()}
function saveQuick(){const btn=$("qSave");if(btn.classList.contains("sale-saving"))return;btn.classList.add("sale-saving");const total=round2(parseFloat(($("qValue").value||"0").replace(",","."))||0);if(total<=0){btn.classList.remove("sale-saving");return toast("Informe o valor")};const c=db.clients.find(x=>x.id===$("qClient").value);const sale={id:uid(),clientName:c?.name||"Venda balcão",clientId:c?.id||"",total,items:[],status:"pending",date:new Date().toISOString()};db.sales.push(sale);if(c)c.debt=round2(c.debt+total);save();log(`Lançamento rápido: ${sale.clientName} • ${money(total)}`);closeModal();showSaleConfirmed();render()}

function undoSale(id){const s=db.sales.find(x=>x.id===id);if(!s)return;confirmBox("Desfazer venda?",`Você realmente quer desfazer a venda de <b>${esc(s.clientName)}</b> no valor de <b>${money(s.total)}</b>?<br><br>O valor pendente será retirado e o estoque será devolvido.`,()=>{const c=db.clients.find(x=>x.id===s.clientId);if(c)c.debt=round2(Math.max(0,c.debt-s.total));(s.items||[]).forEach(i=>{const p=db.products.find(x=>x.id===i.productId);if(p)p.stock+=Number(i.qty||0)});db.payments=db.payments.filter(p=>p.saleId!==id);db.sales=db.sales.filter(x=>x.id!==id);save();log(`Venda desfeita: ${s.clientName} • ${money(s.total)}`);closeModal();render();toast("Venda desfeita")})}
function resetLogs(){confirmBox("Resetar Log?","Isso apagará somente o histórico de ações do Log.",()=>{db.logs=[];save();closeModal();render();toast("Log resetado")})}
function payClient(id){const c=db.clients.find(x=>x.id===id);if(!c||c.debt<=0)return;modal("Registrar pagamento",`<p><b>${esc(c.name)}</b><br><span class="muted">Pendente: ${money(c.debt)}</span></p><div class="field"><label>Valor recebido</label><input id="pay" inputmode="decimal" value="${c.debt.toFixed(2).replace(".",",")}"></div><button class="primary" onclick="savePayment('${id}')">Confirmar pagamento</button>`)}
function savePayment(id){const c=db.clients.find(x=>x.id===id);const v=round2(parseFloat(($("pay").value||"0").replace(",","."))||0);if(v<=0)return toast("Informe o valor");const a=Math.min(v,c.debt);c.debt=round2(c.debt-a);db.cash=round2(db.cash+a);db.payments.push({id:uid(),clientId:id,amount:a,saleId:"",date:new Date().toISOString()});save();log(`Pagamento recebido: ${c.name} • ${money(a)}`);closeModal();render();toast("Pagamento confirmado")}

const originalClients=clients;
function clients(){return `<div class="page"><div class="head"><div><h1>Clientes</h1><p>Clientes e valores pendentes</p></div><button class="secondary" onclick="newClient()">＋</button></div><input class="search" placeholder="🔎 Buscar cliente..." oninput="filterClients(this.value)"><div id="clientList" class="list">${db.clients.map(c=>`<div class="item" data-client-name="${esc(c.name.toLowerCase())}"><div class="row"><div><b>${esc(c.name)}</b><small>${c.debt>0?"Valor pendente":"Sem pendência"}</small></div><div style="text-align:right"><div class="amount ${c.debt>0?"red":"green"}">${money(c.debt)}</div><div style="display:flex;gap:5px;margin-top:6px"><button class="secondary" style="padding:7px 8px;font-size:10px" onclick="editClient('${c.id}')">Editar</button>${c.debt>0?`<button class="secondary" style="padding:7px 8px;font-size:10px" onclick="payClient('${c.id}')">Cobrar</button>`:""}</div></div></div></div>`).join("")}</div></div>`}
function render(){const map={dashboard,clients,products,finance,sales,logs,analysis,quick};$("app").innerHTML=`<div class="app"><header class="top"><div class="brand"><div class="brand-mark">🍫</div><div><b>DOCES DO VITU</b><small>Sistema de vendas</small></div></div><button class="top-action" onclick="go('logs')">☰</button></header><main class="view" id="view">${(map[current]||dashboard)()}</main><nav class="bottom"><button class="${current==='dashboard'?'active':''}" onclick="go('dashboard')"><i>⌂</i>Início</button><button class="${current==='quick'?'active':''}" onclick="go('quick')"><i>⚡</i>Rápido</button><button class="${current==='clients'?'active':''}" onclick="go('clients')"><i>👤</i>Clientes</button><button class="${current==='products'?'active':''}" onclick="go('products')"><i>📦</i>Estoque</button><button class="${current==='finance'?'active':''}" onclick="go('finance')"><i>💰</i>Financeiro</button></nav></div>`}
render();

async function syncFirebase(){
  try{
    if(!window.firebaseCloud?.ready) await new Promise(resolve=>window.addEventListener("firebase-ready",resolve,{once:true}));
    const cloud = await window.firebaseCloud.load();
    if(cloud){
      db = {
        products: cloud.products || [],
        clients: cloud.clients || [],
        sales: cloud.sales || [],
        payments: cloud.payments || [],
        logs: cloud.logs || [],
        cash: Number(cloud.cash || 0),
        initialized: true
      };
      localStorage.setItem(KEY,JSON.stringify(db));
      render();
    }else{
      await window.firebaseCloud.save({
        products: db.products || [],
        clients: db.clients || [],
        sales: db.sales || [],
        payments: db.payments || [],
        logs: db.logs || [],
        cash: Number(db.cash || 0),
        updatedAt: new Date().toISOString()
      });
    }
    toast("☁️ Firebase conectado");
  }catch(e){
    console.error("Firebase:",e);
    toast("Firebase indisponível. Dados locais mantidos.");
  }
}
syncFirebase();
</script>
