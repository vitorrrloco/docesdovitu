<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#5b321f">
<title>DOCES DO VITU 1.2.7</title>
<style>
:root{
 --dark:#4a2819;--dark2:#6b3d25;--brown:#8a5638;--caramel:#b77a4e;
 --cream:#fbf3e8;--cream2:#f3e3d1;--white:#fffdf9;--line:#ead7c4;
 --text:#392419;--muted:#8a7566;--green:#2d805b;--red:#b5483f;--orange:#b66b22;
 --shadow:0 8px 25px rgba(74,40,25,.08);--r:20px
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow-x:hidden;background:var(--cream);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Arial,sans-serif}
body{overflow:hidden}
button,input,select,textarea{font:inherit}
input,select,textarea{font-size:16px!important}
input:focus,select:focus,textarea:focus{font-size:16px!important}button{border:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.hidden{display:none!important}
#login{height:100dvh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#f8ead9,#fffaf3)}
.login-card{width:min(100%,420px);background:var(--white);border:1px solid var(--line);border-radius:30px;padding:25px;box-shadow:0 20px 60px #4a28191c}
.logo{height:145px;border-radius:24px;background:var(--cream);display:grid;place-items:center;margin-bottom:22px;border:1px solid var(--line)}
.logo .candy{font-size:65px}.logo b{display:block;font-size:25px;letter-spacing:2px;text-align:center;color:var(--dark)}
.logo small{display:block;text-align:center;color:var(--brown);font-weight:700;margin-top:5px}
.login-card h1{font-size:27px;margin:0 0 6px}.login-card p{color:var(--muted);margin:0 0 20px}
.field{margin-bottom:13px}.field label{display:block;font-size:13px;font-weight:800;margin:0 0 6px;color:var(--dark2)}
.field input,.field select,.field textarea{width:100%;height:54px;border:1px solid var(--line);border-radius:15px;background:#fff;padding:0 14px;outline:none;color:var(--text)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brown);box-shadow:0 0 0 4px #8a56381a}
.primary{width:100%;min-height:54px;border-radius:15px;background:var(--dark);color:#fff;font-weight:800}
.secondary{background:var(--cream2);color:var(--dark);font-weight:800;border-radius:14px;padding:13px 16px}
#loginMsg{min-height:22px;text-align:center;color:var(--red);font-size:13px;margin-top:10px}
.user-badge{display:inline-flex;align-items:center;background:var(--cream2);color:var(--dark);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:11px;font-weight:800;white-space:nowrap}.app{height:100dvh;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.top{height:74px;flex:0 0 74px;background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:8px 15px}
.brand{display:flex;align-items:center;gap:10px}.brand-mark{width:48px;height:48px;border-radius:15px;background:var(--dark);display:grid;place-items:center;color:#fff;font-size:25px}
.brand b{font-size:17px;display:block;letter-spacing:.4px}.brand small{font-size:10px;color:var(--muted);display:block;margin-top:2px}
.top-action{width:46px;height:46px;border-radius:15px;background:var(--cream2);color:var(--dark);font-size:25px}
.view{flex:1;min-height:0;min-width:0;overflow:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:16px 14px calc(100px + env(safe-area-inset-bottom))}
.page{width:100%;max-width:720px;min-width:0;margin:auto;overflow-x:hidden}.head{display:flex;align-items:end;justify-content:space-between;margin:2px 2px 15px}.head h1{margin:0;font-size:28px;letter-spacing:-.5px}.head p{margin:4px 0 0;color:var(--muted);font-size:13px}
.hero{background:linear-gradient(135deg,var(--dark),var(--dark2));color:#fff;border-radius:25px;padding:19px;margin-bottom:13px;box-shadow:var(--shadow);display:flex;justify-content:space-between;gap:10px}.hero small{opacity:.72}.hero h2{font-size:28px;margin:5px 0}.hero p{margin:0;opacity:.78;font-size:12px}.hero .emoji{font-size:42px;align-self:center}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.stat{background:var(--white);border:1px solid var(--line);border-radius:19px;padding:15px;min-height:105px;box-shadow:var(--shadow)}.stat small{display:block;color:var(--muted);font-size:11px}.stat strong{display:block;font-size:22px;margin-top:7px}.stat .green{color:var(--green)}.stat .red{color:var(--red)}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:19px}.quick-launch{background:var(--dark)!important;color:#fff!important;border-color:var(--dark)!important;grid-column:1/-1;min-height:58px!important;text-align:center!important;padding:10px 14px!important;display:flex;align-items:center;justify-content:center;gap:8px}.quick-launch span{float:none!important;margin:0!important;font-size:22px}.quick-launch b{display:inline!important;font-size:14px}.fast-products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}.fast-product{background:var(--cream2);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left;min-height:58px;color:var(--dark)}.fast-product b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fast-product small{display:block;margin-top:3px;color:var(--muted);font-size:10px}.quick-client-results{max-height:170px;overflow:auto;margin-top:6px}.quick-client-results .client-result{background:var(--white);border:1px solid var(--line);margin-bottom:5px}.quick button{background:var(--white);border:1px solid var(--line);border-radius:17px;min-height:68px;text-align:left;padding:12px;box-shadow:0 4px 14px #4a281908}.quick b{display:block;font-size:13px}.quick span{font-size:22px;float:left;margin-right:9px}
.section{margin-top:15px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:0 2px 9px}.section-title b{font-size:17px}.link{background:none;color:var(--brown);font-size:12px;font-weight:800}
.list{display:grid;gap:9px}.item{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;align-items:center;gap:10px}.avatar{width:43px;height:43px;flex:0 0 43px;border-radius:14px;background:var(--cream2);display:grid;place-items:center;font-size:19px}.item-main{min-width:0;flex:1}.item-main b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-main small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.item-right{text-align:right}.item-right b{display:block;font-size:13px}.status{font-size:9px;font-weight:800;margin-top:4px}.paid{color:var(--green)}.pending{color:var(--red)}.partial{color:var(--orange)}
.client-results{position:relative;left:auto;right:auto;top:auto;z-index:10000;background:var(--white);border:1px solid var(--line);border-radius:15px;box-shadow:0 12px 30px #0002;max-height:240px;overflow:auto;padding:6px}.client-result{display:flex;flex-direction:column;align-items:flex-start;width:100%;background:transparent;color:var(--text);padding:11px 12px;border-radius:11px;text-align:left}.client-result:hover,.client-result:focus,.client-result.active{background:var(--cream2);outline:none}.client-result small{color:var(--muted);font-size:11px;margin-top:2px}.client-no-results{padding:12px;color:var(--muted);font-size:13px}.search{height:50px;width:100%;border:1px solid var(--line);border-radius:15px;background:#fff;padding:0 14px;outline:none;margin-bottom:10px}
.toolbar{display:flex;gap:8px;margin-bottom:10px}.toolbar .search{margin:0;flex:1}.toolbar button{width:50px;border-radius:15px;background:var(--dark);color:#fff;font-size:24px}
.form{background:var(--white);border:1px solid var(--line);border-radius:21px;padding:16px;margin-bottom:11px;box-shadow:var(--shadow)}.form h3{margin:0 0 13px;font-size:17px}.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px;min-width:0}.actions{display:flex;gap:8px;margin-top:11px;min-width:0}.actions>*{min-width:0}.actions button{flex:1;min-height:50px;border-radius:14px;font-weight:800}
.table-wrap{overflow:auto;background:var(--white);border:1px solid var(--line);border-radius:19px;box-shadow:var(--shadow)}table{width:100%;border-collapse:collapse;min-width:590px}th,td{padding:11px 10px;border-bottom:1px solid var(--line);font-size:11px;text-align:left;white-space:nowrap}th{background:var(--cream2);color:var(--dark);font-size:10px;text-transform:uppercase}tr:last-child td{border-bottom:0}
.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.tabs button{flex:0 0 auto;background:var(--white);border:1px solid var(--line);color:var(--muted);padding:9px 13px;border-radius:13px;font-size:11px;font-weight:800}.tabs button.active{background:var(--dark);color:#fff;border-color:var(--dark)}
.analysis-card{min-width:0;overflow:hidden;background:var(--white);border:1px solid var(--line);border-radius:21px;padding:15px;margin-bottom:12px;box-shadow:var(--shadow)}.analysis-head{display:flex;justify-content:space-between;align-items:end;min-width:0;gap:10px}.analysis-head>div{min-width:0}.analysis-head strong{white-space:nowrap;flex:0 0 auto}.analysis-head b{font-size:17px}.analysis-head strong{font-size:21px;color:var(--dark)}.chart{height:220px;margin-top:12px;position:relative}.chart svg{width:100%;height:100%;overflow:visible}.chart text{font-size:9px;fill:var(--muted)}.line{fill:none;stroke:var(--dark);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dot{fill:var(--caramel);stroke:var(--white);stroke-width:2}
.finance-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));min-width:0;gap:10px;margin-bottom:12px}.finance-card{min-width:0;overflow:hidden;background:var(--white);border:1px solid var(--line);border-radius:19px;padding:15px;box-shadow:var(--shadow)}.finance-card small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;font-weight:800}.finance-card strong{display:block;font-size:22px;margin-top:6px}.finance-card p{margin:5px 0 0;overflow-wrap:anywhere;color:var(--muted);font-size:10px}.finance-positive{color:var(--green)}.finance-negative{color:var(--red)}.finance-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}.finance-actions button{min-height:58px}.more{display:grid;grid-template-columns:1fr 1fr;gap:10px}.more button{min-height:118px;background:var(--white);border:1px solid var(--line);border-radius:19px;padding:14px;text-align:left}.more .mi{font-size:28px;display:block;margin-bottom:9px}.more b{display:block;font-size:14px}.more small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.modal-bg{position:fixed;inset:0;background:#2b170f73;z-index:5000;display:flex;align-items:flex-end;pointer-events:auto}.modal{position:relative;z-index:1;pointer-events:auto;width:100%;max-width:620px;margin:auto auto 0;max-height:92dvh;overflow:auto;background:var(--white);border-radius:25px 25px 0 0;padding:17px 15px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px #0003}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.modal-head h2{margin:0;font-size:20px}.close{width:40px;height:40px;border-radius:13px;background:var(--cream2);font-size:22px;color:var(--dark)}
.nav{height:82px;flex:0 0 calc(82px + env(safe-area-inset-bottom));padding:6px 5px env(safe-area-inset-bottom);background:var(--white);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:1000}.nav button{background:none;color:var(--muted);border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.nav .ni{font-size:24px;line-height:27px}.nav small{font-size:10px;font-weight:800}.nav .active{background:var(--cream2);color:var(--dark)}
.toast{position:fixed;left:14px;right:14px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:9000;background:var(--dark);color:#fff;padding:13px;border-radius:15px;text-align:center;font-size:13px;box-shadow:0 10px 30px #0003}
.empty{text-align:center;color:var(--muted);padding:30px 15px;background:var(--white);border:1px dashed var(--line);border-radius:18px;font-size:13px}
@media(min-width:700px){.view{padding-left:24px;padding-right:24px}.nav{max-width:720px;width:100%;margin:0 auto;border-radius:22px 22px 0 0}.finance-grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:370px){.view{padding-left:10px;padding-right:10px}.head h1{font-size:25px}.stats{gap:7px}.stat{padding:12px}.more{gap:8px}.more button{padding:12px}}

/* ===== V1.1.0 RESPONSIVE UI ===== */
@media (min-width: 900px){
  body{background:#f3e3d1}
  .app{display:grid;grid-template-columns:250px minmax(0,1fr);grid-template-rows:78px minmax(0,1fr);height:100dvh}
  .top{grid-column:2;grid-row:1;height:auto;padding:10px 28px}
  .view{grid-column:2;grid-row:2;padding:26px 32px 34px;overflow:auto}
  .page{max-width:1240px}
  .nav{grid-column:1;grid-row:1 / span 2;width:auto;height:auto;margin:0;border:0;border-right:1px solid var(--line);border-radius:0;padding:22px 12px;display:flex;flex-direction:column;gap:8px;background:var(--white)}
  .nav:before{content:"🍫  DOCES DO VITU";font-size:16px;font-weight:900;color:var(--dark);padding:8px 12px 22px}
  .nav button{width:100%;min-height:56px;flex:none;display:flex;flex-direction:row;justify-content:flex-start;gap:12px;padding:0 15px;border-radius:15px}
  .nav .ni{font-size:23px;width:27px;text-align:center}.nav small{font-size:13px}
  .nav .active{background:var(--cream2);color:var(--dark)}
  .hero{padding:25px 28px}.hero h2{font-size:34px}
  .stats{grid-template-columns:repeat(4,1fr);gap:14px}.stat{min-height:120px;padding:18px}.stat strong{font-size:25px}
  .quick{grid-template-columns:repeat(4,1fr);gap:12px}.quick button{min-height:86px}
  .more{grid-template-columns:repeat(4,1fr)}
  .table-wrap{max-height:calc(100dvh - 225px)}
  .modal-bg{align-items:center;padding:20px}.modal{width:min(680px,100%);margin:auto;border-radius:25px;max-height:88dvh}
  .head h1{font-size:31px}
}
@media (min-width:1200px){
  .view{padding-left:42px;padding-right:42px}
  .page{max-width:1320px}
}
@media (max-width:899px){
  .nav{display:grid;grid-template-columns:repeat(5,1fr)}
  .nav:before{display:none}
}

/* V1.2.0 FINAL - Financeiro compacto e centralizado no celular */
.finance-duo{width:100%;max-width:100%;margin-left:auto;margin-right:auto;align-items:stretch}
.finance-duo .analysis-card{min-width:0;padding:13px}
.finance-duo .section-title b{font-size:15px}
.finance-duo .item{padding:10px;border-radius:15px;gap:8px}
.finance-duo .avatar{width:38px;height:38px;flex-basis:38px;border-radius:12px;font-size:17px}
.finance-duo .item-main b{font-size:13px}
.finance-duo .item-main small{font-size:9px}
@media(max-width:899px){
  .finance-duo{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;width:calc(100% - 8px);margin-left:auto;margin-right:auto}
  .finance-duo .analysis-card{padding:12px;border-radius:18px}
}

.finance-duo{justify-content:center}
.finance-duo .top-sellers-list{max-height:126px;overflow-y:auto;overflow-x:hidden;padding-right:2px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.finance-duo .top-sellers-list .item{width:100%}
@media(max-width:699px){
  .finance-duo{width:100%;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;justify-items:center}
  .finance-duo .analysis-card{width:min(100%,430px);min-width:0;box-sizing:border-box}
  .finance-duo .top-sellers-list{width:100%;max-height:116px;overflow-y:auto;overflow-x:hidden;padding:0 2px;box-sizing:border-box;-webkit-overflow-scrolling:touch;scroll-snap-type:y proximity}
  .finance-duo .top-sellers-list .item{width:100%;max-width:100%;box-sizing:border-box;scroll-snap-align:start}
}

.boot-loader{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--cream);padding:24px;opacity:1;transition:opacity .18s ease,visibility .18s ease}.boot-loader.done{opacity:0;visibility:hidden;pointer-events:none}.boot-card{width:min(330px,88vw);text-align:center;padding:26px 22px;border-radius:22px;background:var(--white);box-shadow:0 14px 45px rgba(74,40,25,.14);display:flex;flex-direction:column;align-items:center;gap:8px}.boot-logo{font-size:42px;line-height:1}.boot-card b{font-size:19px;color:var(--dark)}.boot-card small{color:var(--muted);margin-bottom:8px}.boot-track{width:100%;height:7px;border-radius:99px;background:var(--cream2);overflow:hidden}.boot-bar{height:100%;width:0%;border-radius:99px;background:var(--brown);transition:width .12s ease}.boot-card strong{font-size:13px;color:var(--brown);min-height:18px}
@media(prefers-reduced-motion:reduce){.boot-loader,.boot-bar{transition:none!important}}
</style>

<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
#brandSplash{position:fixed;inset:0;z-index:99999;background:#faf4ee;display:flex;align-items:center;justify-content:center;transition:opacity .28s ease}
#brandSplash img{width:min(72vw,360px);max-height:55vh;object-fit:contain;border-radius:24px}
#brandSplash.hide{opacity:0;pointer-events:none}
@media(min-width:900px){#brandSplash img{width:300px}}
</style>

<style id="professional-motion">
/* V1.2.8: single-tap motion system, without duplicate click effects */
.page{animation:pageEnter .22s cubic-bezier(.2,.75,.25,1) both;will-change:transform,opacity}
@keyframes pageEnter{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.modal-bg{animation:modalFade .16s ease-out both}
.modal-bg .modal{animation:modalEnter .20s cubic-bezier(.2,.8,.2,1) both;transform-origin:center bottom}
@keyframes modalFade{from{opacity:0}to{opacity:1}}
@keyframes modalEnter{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
button,.link,.client-result,.fast-product,.item[data-client],.item[data-product],.item[data-sale]{transition:transform .12s ease,box-shadow .12s ease,opacity .12s ease,background-color .12s ease,border-color .12s ease}
button:active,.link:active,.client-result:active,.fast-product:active{transform:scale(.965);opacity:.9}
button:focus-visible,.link:focus-visible{outline:3px solid #8a56384d;outline-offset:2px}
.view.page-swap{animation:pageSwap .22s ease-out both}
@keyframes pageSwap{from{opacity:.15;transform:translateY(5px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.page,.modal-bg,.modal-bg .modal,.view.page-swap,.press-feedback{animation:none!important}button,.link,.client-result,.fast-product{transition:none!important}}
</style>

</head>
<body>
<div id="brandSplash" aria-label="DOCES DO VITU">
  <img src="logo.png" alt="Logo Doces do Vitu">
</div>

<div id="login">
 <div class="login-card">
  <div class="logo"><div><div class="candy">🍫</div><b>DOCES DO VITU</b><small>vendas • estoque • recebimentos</small></div></div>
  <h1>Entrar</h1><p>Acesse seu controle de vendas.</p>
  <div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="username" placeholder="seu@email.com"></div>
  <div class="field"><label>Senha</label><input id="password" type="password" autocomplete="current-password" placeholder="Sua senha"></div>
  <button class="primary" id="loginBtn">Entrar</button>
  <button class="secondary" id="createBtn" style="width:100%;margin-top:8px">Criar minha conta</button>
  <div id="loginMsg"></div>
 </div>
</div>

<div id="bootLoader" class="boot-loader" aria-live="polite"><div class="boot-card"><div class="boot-logo">🍫</div><b>DOCES DO VITU</b><small>Preparando seu sistema...</small><div class="boot-track"><div id="bootBar" class="boot-bar"></div></div><strong id="bootPct">0%</strong></div></div>

<div id="app" class="app hidden">
 <header class="top">
  <div class="brand"><div class="brand-mark">🍫</div><div><b>DOCES DO VITU</b><small>Controle de vendas • V1.2.9</small></div></div>
  <div style="display:flex;align-items:center;gap:7px"><span id="currentUser" class="user-badge">👤 Vitor</span><button class="top-action" id="quickSale" aria-label="Nova venda">＋</button></div>
 </header>
 <main class="view" id="view"></main>
 <nav class="nav">
  <button data-page="home" class="active"><span class="ni">⌂</span><small>Início</small></button>
  <button data-page="sales"><span class="ni">🛒</span><small>Vendas</small></button>
  <button data-page="clients"><span class="ni">👥</span><small>Clientes</small></button>
  <button data-page="stock"><span class="ni">📦</span><small>Estoque</small></button>
  <button data-page="finance"><span class="ni">📊</span><small>Financeiro</small></button>
 </nav>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script type="module">

function col(name){return collection(db,"businesses","docesDoVitu",name)}
function oldCol(name){return collection(db,"users",uid,name)}
async function migrateOwnDataToShared(){
 const marker=`docesDoVituSharedMigration_${uid}`;
 if(localStorage.getItem(marker)==="done") return;
 const names=["products","clients","sales","payments","purchases","logs"];
 for(const name of names){
  const shared=await getDocs(col(name));
  if(!shared.empty) continue;
  const old=await getDocs(oldCol(name));
  if(old.empty) continue;
  await Promise.all(old.docs.map(d=>setDoc(doc(col(name),d.id),d.data())));
 }
 localStorage.setItem(marker,"done");
}
async function logAction(action,details=""){
 try{await addDoc(col("logs"),{action,details,createdByUid:uid,createdByName:currentUserName,createdAt:serverTimestamp()});}
 catch(e){console.warn("Log não salvo",e)}
}
function subscribeReady(){
 return new Promise(resolve=>{
  const names=['products','clients','sales','payments','purchases']; let ready=0;
  const seen=new Set();
  names.forEach(name=>{
   const u=onSnapshot(col(name),snap=>{data[name]=snap.docs.map(d=>({id:d.id,...d.data()}));render();
    if(!seen.has(name)){seen.add(name);ready++;bootSet(30+ready*13);if(ready===names.length)resolve();}
   },()=>{if(!seen.has(name)){seen.add(name);ready++;if(ready===names.length)resolve();}toast('Não foi possível sincronizar '+name+'.')});
   unsubs.push(u);
  });
 });
}
function subscribe(){return subscribeReady()}

 const today=now();let sold=0,received=0,pending=0;
 data.sales.forEach(s=>{sold+=Number(s.total||0);pending+=Math.max(0,Number(s.total||0)-Number(s.paid||0))});

 const todaySales=data.sales.filter(s=>{let d=dt(s.createdAt);return d&&d.toDateString()===today.toDateString()}).reduce((a,s)=>a+Number(s.total||0),0);
 return {sold,received,pending,todaySales}

function finance(){
 const sales=data.sales||[], payments=data.payments||[], products=data.products||[], purchases=data.purchases||[], nowD=now();
 const monthStart=new Date(nowD.getFullYear(),nowD.getMonth(),1);monthStart.setHours(0,0,0,0);
 const nextMonth=new Date(nowD.getFullYear(),nowD.getMonth()+1,1);nextMonth.setHours(0,0,0,0);
 const monthSales=sales.filter(s=>{const d=dt(s.createdAt);return d&&d>=monthStart&&d<nextMonth});
 const monthPayments=payments.filter(p=>{const d=dt(p.createdAt);return d&&d>=monthStart&&d<nextMonth});
 const revenue=monthSales.reduce((a,s)=>a+Number(s.total||0),0);
 const received=monthPayments.reduce((a,p)=>a+Number(p.amount||0),0);
 const pending=monthSales.reduce((a,s)=>a+Math.max(0,Number(s.total||0)-Number(s.paid||0)),0);
 const cost=monthSales.reduce((a,s)=>a+(s.items||[]).reduce((x,i)=>{const prod=products.find(p=>p.id===i.productId);const unitCost=i.cost!=null?Number(i.cost):Number(prod?.cost||0);return x+Number(i.qty||0)*unitCost},0),0);
 const profit=revenue-cost;
 const margin=revenue>0?(profit/revenue)*100:0;
 const ticket=monthSales.length?revenue/monthSales.length:0;
 const totalItems=monthSales.reduce((a,s)=>a+(s.items||[]).reduce((x,i)=>x+Number(i.qty||0),0),0);
 const allReceived=payments.reduce((a,p)=>a+Number(p.amount||0),0);
 const allPurchases=purchases.reduce((a,p)=>a+Number(p.total||0),0);
 const cash=allReceived-allPurchases;
 const byMethod={};monthPayments.forEach(p=>{const m=p.method||"Outro";byMethod[m]=(byMethod[m]||0)+Number(p.amount||0)});
 const top={};monthSales.forEach(s=>(s.items||[]).forEach(i=>{top[i.name]=(top[i.name]||0)+Number(i.qty||0)}));
 const topRows=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([name,q])=>`<div class="item"><div class="avatar">🍫</div><div class="item-main"><b>${esc(name)}</b><small>${q} unidade(s) vendida(s)</small></div></div>`).join("")||'<div class="empty">Ainda não há vendas neste mês.</div>';
 const methods=Object.entries(byMethod).sort((a,b)=>b[1]-a[1]).map(([m,v])=>`<div class="section-title"><span>${esc(m)}</span><b>${money(v)}</b></div>`).join("")||'<div class="empty">Nenhum recebimento neste mês.</div>';
 return `<div class="page"><div class="head"><div><h1>Financeiro</h1><p>Visão completa do seu negócio • ${nowD.toLocaleDateString("pt-BR",{month:"long",year:"numeric"})}</p></div></div>
 <div class="finance-grid">
  <div class="finance-card"><small>Faturamento do mês</small><strong>${money(revenue)}</strong><p>${monthSales.length} venda(s)</p></div>
  <div class="finance-card"><small>Lucro estimado</small><strong class="finance-positive">${money(profit)}</strong><p>vendas menos custo dos produtos</p></div>
  <div class="finance-card"><small>Margem de lucro</small><strong>${margin.toFixed(1)}%</strong><p>sobre o faturamento</p></div>
  <div class="finance-card"><small>Ticket médio</small><strong>${money(ticket)}</strong><p>por venda</p></div>
  <div class="finance-card"><small>Recebido no mês</small><strong class="finance-positive">${money(received)}</strong><p>pagamentos registrados</p></div>
  <div class="finance-card"><small>Caixa atual</small><strong class="finance-positive">${money(cash)}</strong><p>recebimentos menos compras registradas</p></div>
  <div class="finance-card"><small>A receber</small><strong class="finance-negative">${money(pending)}</strong><p>das vendas deste mês</p></div>
  <div class="finance-card"><small>Custo dos produtos</small><strong>${money(cost)}</strong><p>custo informado no estoque</p></div>
  <div class="finance-card"><small>Itens vendidos</small><strong>${totalItems}</strong><p>unidades neste mês</p></div>
 </div>
 <div class="analysis-card"><div class="analysis-head"><div><small style="color:var(--muted)">RESUMO</small><div style="margin-top:3px">Resultado financeiro do mês</div></div><strong>${money(profit)}</strong></div><div class="section" style="margin-top:15px"><div class="section-title"><span>Faturamento</span><b>${money(revenue)}</b></div><div class="section-title"><span>Custos</span><b>${money(cost)}</b></div><div class="section-title"><span>Recebido</span><b class="finance-positive">${money(received)}</b></div><div class="section-title"><span>Pendente</span><b class="finance-negative">${money(pending)}</b></div></div></div>
 <div class="row finance-duo"><div class="analysis-card"><div class="section-title"><b>Recebimentos por forma</b></div>${methods}</div><div class="analysis-card"><div class="section-title"><b>Mais vendidos</b></div><div class="list top-sellers-list">${topRows}</div></div></div>

}

function pixPayload(amount){
 const value=Number(amount||0).toFixed(2);
 const payload=`00020126480014br.gov.bcb.pix0126vitorbernardo015@gmail.com5204000053039865404${value}5802BR5901N6001C62070503***6304`;
 let crc=0xFFFF;
 for(let i=0;i<payload.length;i++){
   crc^=payload.charCodeAt(i)<<8;
   for(let j=0;j<8;j++) crc=(crc&0x8000)?((crc<<1)^0x1021)&0xFFFF:(crc<<1)&0xFFFF;
 }
 return payload+crc.toString(16).toUpperCase().padStart(4,'0');
}

function openPaymentForClient(c){

 if(!pendingSales.length){toast("Esse cliente não possui valor pendente.");return}
 openModal("Registrar pagamento",`<div class="form"><div class="field"><label>Cliente</label><input value="${esc(c.name)}" disabled></div><div class="field"><label>Valor recebido</label><input id="payValue" type="number" min="0.01" step="0.01" value="${pendingSales.reduce((a,s)=>a+Math.max(0,s.total-s.paid),0).toFixed(2)}"></div><div class="field"><label>Forma</label><select id="payMethod"><option>Dinheiro</option><option>Cartão</option><option>Pagamento no salário</option></select></div><button class="primary" id="savePay">Registrar pagamento</button></div>`);
 $("savePay").onclick=async()=>{
  let amount=Number($("payValue").value)||0;if(amount<=0)return toast("Digite um valor.");

   let remaining=amount;
   for(const s of pendingSales){
    if(remaining<=0)break;

 const sales=data.sales||[], nowD=now(), points=[];
 const sumBetween=(s,e)=>sales.filter(v=>{const x=dt(v.createdAt);return x&&x>=s&&x<=e}).reduce((a,v)=>a+Number(v.total||0),0);
 if(kind==="hour")for(let h=0;h<24;h++){let s=new Date(nowD);s.setHours(h,0,0,0);let e=new Date(s);e.setHours(h,59,59,999);points.push({label:String(h).padStart(2,"0")+"h",value:sumBetween(s,e)})}
 if(kind==="day")for(let i=6;i>=0;i--){let s=new Date(nowD);s.setHours(0,0,0,0);s.setDate(s.getDate()-i);let e=new Date(s);e.setHours(23,59,59,999);points.push({label:s.toLocaleDateString("pt-BR",{weekday:"short"}).replace(".",""),value:sumBetween(s,e)})}
 if(kind==="week"){let base=new Date(nowD);base.setHours(0,0,0,0);base.setDate(base.getDate()-((base.getDay()+6)%7));for(let i=7;i>=0;i--){let s=new Date(base);s.setDate(s.getDate()-i*7);let e=new Date(s);e.setDate(e.getDate()+6);e.setHours(23,59,59,999);points.push({label:s.getDate()+"/"+(s.getMonth()+1),value:sumBetween(s,e)})}}
 if(kind==="month"){let days=new Date(nowD.getFullYear(),nowD.getMonth()+1,0).getDate();for(let d=1;d<=days;d++){let s=new Date(nowD.getFullYear(),nowD.getMonth(),d);s.setHours(0,0,0,0);let e=new Date(s);e.setHours(23,59,59,999);points.push({label:String(d),value:sumBetween(s,e)})}}
 const total=points.reduce((a,p)=>a+p.value,0),max=Math.max(...points.map(p=>p.value),1),w=600,h=190,pad=18,den=Math.max(points.length-1,1);
 const coords=points.map((p,i)=>({x:pad+i*(w-2*pad)/den,y:h-pad-(p.value/max)*(h-2*pad)}));
 const pts=coords.map(p=>`${p.x},${p.y}`).join(" "),step=Math.max(1,Math.ceil(points.length/8));
 const labels=points.map((p,i)=>i%step===0?`<text x="${coords[i].x}" y="${h-2}" text-anchor="middle">${esc(p.label)}</text>`:"").join("");
 const dots=coords.map((p,i)=>`<circle class="dot" cx="${p.x}" cy="${p.y}" r="3"><title>${esc(points[i].label)}: ${money(points[i].value)}</title></circle>`).join("");
 return `<div class="analysis-card"><div class="analysis-head"><div><small style="color:var(--muted)">${periods[kind]}</small><div style="margin-top:3px">Total vendido</div></div><strong>${money(total)}</strong></div><div class="chart"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline class="line" points="${pts}"/>${dots}${labels}</svg></div></div>`;
}

function openModal(title,content){
 $("modalRoot").innerHTML=`<div class="modal-bg"><div class="modal"><div class="modal-head"><h2>${title}</h2><button type="button" class="close" id="modalClose">×</button></div>${content}</div></div>`;
 const bg=$("modalRoot").querySelector(".modal-bg");
 $("modalClose").onclick=closeModal;
 bg.addEventListener("click",e=>{if(e.target===e.currentTarget)closeModal()});
 requestAnimationFrame(()=>bg.querySelector(".modal")?.focus?.());
}
function closeModal(){$("modalRoot").innerHTML=""}


// Universal click/tap feedback, including dynamically-created modal controls.
document.addEventListener("pointerdown",e=>{
 const el=e.target.closest("button,.link,.client-result,.fast-product,[role=button]");
 if(!el)return;
 el.classList.remove("press-feedback");
 void el.offsetWidth;
 el.classList.add("press-feedback");
 setTimeout(()=>el.classList.remove("press-feedback"),180);
},{passive:true});
document.addEventListener("keydown",e=>{
 if(e.key!=="Enter" && e.key!==" ")return;
 const el=document.activeElement;
 if(!el || !el.matches("button,.link,.client-result,.fast-product,[role=button]"))return;
 el.classList.remove("press-feedback");
 void el.offsetWidth;
 el.classList.add("press-feedback");
 setTimeout(()=>el.classList.remove("press-feedback"),180);
});

document.addEventListener("keydown",e=>{
  if(e.key==="Escape" && $("modalRoot").innerHTML) closeModal();
  if((e.key==="n"||e.key==="N") && uid && !["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName)) openSale();
});

function bindPage(){
 $("newSale")?.addEventListener("click",openSale);$("qSale")?.addEventListener("click",openSale);$("qQuickSale")?.addEventListener("click",openQuickSale);
 $("qClient")?.addEventListener("click",openClientForm);$("newClient")?.addEventListener("click",openClientForm);
 $("qProduct")?.addEventListener("click",()=>openProduct());$("newProduct")?.addEventListener("click",()=>openProduct());
 $("qAnalysis")?.addEventListener("click",openAnalysis);$("analysis")?.addEventListener("click",openAnalysis);
 $("seeSales")?.addEventListener("click",()=>go("sales"));
 $("logout")?.addEventListener("click",()=>signOut(auth));
 $("clientSearch")?.addEventListener("input",e=>{$("clientList").innerHTML=clientRows(data.clients.filter(c=>c.name.toLowerCase().includes(e.target.value.toLowerCase())))});
 $("stockSearch")?.addEventListener("input",e=>{$("stockList").innerHTML=productRows(data.products.filter(p=>p.name.toLowerCase().includes(e.target.value.toLowerCase())))});
 document.querySelectorAll("[data-client]").forEach(x=>x.onclick=e=>{if(e.target.closest(".charge-btn"))return;openClient(data.clients.find(c=>c.id===x.dataset.client))});
 document.querySelectorAll("[data-charge]").forEach(x=>x.onclick=e=>{e.stopPropagation();const c=data.clients.find(c=>c.id===x.dataset.charge);if(c)openCharge(c)});
 document.querySelectorAll("[data-charge-client]").forEach(x=>x.onclick=e=>{e.stopPropagation();const c=data.clients.find(c=>c.id===x.dataset.chargeClient);if(c)chargeClient(c)});
 document.querySelectorAll("[data-product]").forEach(x=>x.onclick=e=>{if(e.target.closest("[data-remove-stock]")||e.target.closest("[data-delete-product]"))return;openProduct(data.products.find(p=>p.id===x.dataset.product))});
 document.querySelectorAll("[data-remove-stock]").forEach(x=>x.onclick=e=>{e.stopPropagation();openRemoveStock(data.products.find(p=>p.id===x.dataset.removeStock))});
 document.querySelectorAll("[data-delete-product]").forEach(x=>x.onclick=e=>{e.stopPropagation();deleteProductConfirm(data.products.find(p=>p.id===x.dataset.deleteProduct))});
 document.querySelectorAll("[data-sale]").forEach(x=>x.onclick=()=>openSaleDetail(data.sales.find(s=>s.id===x.dataset.sale)));
 document.querySelectorAll("[data-sales-filter]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-sales-filter]").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll("#salesBody tr").forEach(r=>{let f=b.dataset.salesFilter; r.style.display=f==="all"||r.dataset.status===f?"":"none"})});
 $("payments")?.addEventListener("click",()=>openReceivables());
 $("receivables")?.addEventListener("click",()=>openReceivables());
 $("account")?.addEventListener("click",openAccount);
 $("financeAnalysis")?.addEventListener("click",openAnalysis);$("financeReceivables")?.addEventListener("click",openReceivables);$("financePayments")?.addEventListener("click",()=>{const rows=data.clients.map(c=>{let pending=data.sales.filter(s=>s.clientId===c.id).reduce((a,s)=>a+Math.max(0,s.total-s.paid),0);return {...c,pending}}).filter(c=>c.pending>0).sort((a,b)=>b.pending-a.pending);if(!rows.length)return toast("Ninguém com valor pendente.");openPaymentForClient(rows[0]);});$("financeAccount")?.addEventListener("click",openAccount);
}
function openSaleDetail(s){
 if(!s)return;let st=status(s.total,s.paid),pending=Math.max(0,s.total-s.paid);
 openModal("Venda",`<div class="form"><div class="section-title"><b>${esc(s.clientName||"Venda balcão")}</b><span>${dateTime(s.createdAt)}</span></div>${(s.items||[]).map(i=>`<div class="item"><div class="avatar">🍫</div><div class="item-main"><b>${esc(i.name)}</b><small>${i.qty} × ${money(i.price)}</small></div><div class="item-right"><b>${money(i.qty*i.price)}</b></div></div>`).join("")}<div class="section-title" style="margin-top:13px"><b>Total</b><b>${money(s.total)}</b></div><div class="section-title"><span>Pago</span><b class="paid">${money(s.paid)}</b></div><div class="section-title"><span>Pendente</span><b class="${statusClass(st)}">${money(pending)}</b></div>${pending>0&&s.clientId?'<button class="primary" id="detailPay" style="margin-top:10px">💵 Registrar pagamento</button>':""}</div>`);
 if($("detailPay"))$("detailPay").onclick=()=>{let c=data.clients.find(c=>c.id===s.clientId);closeModal();openPaymentForClient(c)}
}
async function resetBusinessData(){
 const names=["products","clients","sales","payments","purchases"];
 try{
  const refs=[];
  names.forEach(name=>data[name].forEach(item=>refs.push(doc(col(name),item.id))));
  await Promise.all(refs.map(ref=>deleteDoc(ref)));
  closeModal();toast("Dados do negócio resetados!");
 }catch(e){toast("Não foi possível resetar os dados. Tente novamente.")}
}
async function resetActivityLog(){
 try{
  const snap=await getDocs(col("logs"));
  if(!snap.empty) await Promise.all(snap.docs.map(d=>deleteDoc(doc(col("logs"),d.id))));
  data.logs=[];
  closeModal();
  toast("Log de atividades resetado!");
 }catch(e){
  console.error(e);
  toast("Não foi possível resetar o log. Verifique as permissões do Firebase.");
 }
}

function openAccount(){
 openModal("Conta",`<div class="form">
  <div class="item"><div class="avatar">⚙️</div><div class="item-main"><b>Conta atual</b><small>${esc(auth.currentUser?.email||"")}</small></div></div>
  <button class="secondary" id="activityLog" style="width:100%;margin-top:10px">📋 Log de atividades</button>
  <details style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">
   <summary style="cursor:pointer;color:var(--muted);font-weight:800;font-size:13px">Configurações avançadas</summary>
   <div style="margin-top:12px;padding:12px;border-radius:14px;background:#fff4f2;border:1px solid #efd2cc">
    <b style="color:#a9463b">Zona de dados</b>
    <p style="margin:5px 0 12px;color:var(--muted);font-size:12px;line-height:1.45">Apaga produtos, estoque, clientes, vendas e pagamentos desta conta. O login e a configuração do PIX permanecem.</p>
    <button class="secondary" id="resetBusiness" style="width:100%;color:#a9463b;border-color:#e6bdb7">🗑️ Resetar dados do negócio</button>
    <button class="secondary" id="resetLog" style="width:100%;margin-top:8px;color:#a9463b;border-color:#e6bdb7">📋 Resetar log de atividades</button>
   </div>
  </details>
 </div>`);
 $("activityLog").onclick=openActivityLog;
 $("resetBusiness").onclick=()=>{
  openModal("Resetar dados?",`<div class="form">
   <div style="padding:13px;border-radius:15px;background:#fff4f2;border:1px solid #efd2cc;color:#71352f;line-height:1.5"><b>⚠️ Esta ação apaga os dados do negócio.</b><br><small>Produtos, estoque, clientes, vendas e pagamentos serão excluídos. O login e o PIX não serão apagados. Essa ação não pode ser desfeita.</small></div>
   <div class="field"><label>Digite RESETAR para confirmar</label><input id="resetConfirm" autocomplete="off" placeholder="RESETAR"></div>
   <div class="actions"><button class="secondary" id="cancelReset">Cancelar</button><button class="primary" id="confirmReset" disabled>Apagar dados</button></div>
  </div>`);
  $("cancelReset").onclick=closeModal;
  $("resetConfirm").oninput=e=>$("confirmReset").disabled=e.target.value.trim().toUpperCase()!=="RESETAR";
  $("confirmReset").onclick=resetBusinessData;
 };
 $("resetLog").onclick=()=>{
  openModal("Resetar log?",`<div class="form">
   <div style="padding:13px;border-radius:15px;background:#fff4f2;border:1px solid #efd2cc;color:#71352f;line-height:1.5"><b>⚠️ Esta ação apaga todo o histórico.</b><br><small>Vendas, estoque e clientes não serão apagados. Somente o Log de atividades será excluído.</small></div>
   <div class="field"><label>Digite RESETAR LOG para confirmar</label><input id="resetLogConfirm" autocomplete="off" placeholder="RESETAR LOG"></div>
   <div class="actions"><button class="secondary" id="cancelLogReset">Cancelar</button><button class="primary" id="confirmLogReset" disabled>Apagar log</button></div>
  </div>`);
  $("cancelLogReset").onclick=closeModal;
  $("resetLogConfirm").oninput=e=>$("confirmLogReset").disabled=e.target.value.trim().toUpperCase()!=="RESETAR LOG";
  $("confirmLogReset").onclick=resetActivityLog;
 };
}
async function openActivityLog(){
 let rows=[];
 try{
  const snap=await getDocs(col("logs"));
  rows=snap.docs.map(d=>({id:d.id,...d.data()}));
  data.logs=rows;
 }catch(e){
  console.error(e);
  toast("Não foi possível carregar o log. Verifique as permissões do Firebase.");
 }
 rows=rows.slice().sort((a,b)=>(dt(b.createdAt)||0)-(dt(a.createdAt)||0));
 const types=[...new Set(rows.map(x=>x.action).filter(Boolean))];
 openModal("Log de atividades",`<div class="form">
  <div class="row"><div class="field"><label>Usuário</label><select id="logUser"><option value="all">Todos</option>${[...new Set(rows.map(x=>x.createdByName||"Desconhecido"))].map(n=>`<option>${esc(n)}</option>`).join("")}</select></div><div class="field"><label>Ação</label><select id="logAction"><option value="all">Todas</option>${types.map(n=>`<option>${esc(n)}</option>`).join("")}</select></div></div>
  <div id="logList" class="list" style="max-height:55vh;overflow:auto"></div>
 </div>`);
 const draw=()=>{const u=$("logUser").value,a=$("logAction").value;const filtered=rows.filter(x=>(u==="all"||x.createdByName===u)&&(a==="all"||x.action===a));$("logList").innerHTML=filtered.map(x=>`<div class="item"><div class="avatar">${x.action==="Nova venda"?"🛒":x.action.includes("Estoque")?"📦":x.action==="Pagamento"?"💰":x.action.includes("Cliente")?"👤":"📋"}</div><div class="item-main"><b>${esc(x.action||"Atividade")}</b><small>${dateTime(x.createdAt)} • ${esc(x.createdByName||"Usuário")}</small><small>${esc(x.details||"")}</small></div></div>`).join("")||'<div class="empty">Nenhuma atividade encontrada.</div>'};
 $("logUser").onchange=draw;$("logAction").onchange=draw;draw();
}
function openReceivables(){
 const rows=data.clients.map(c=>{let pending=data.sales.filter(s=>s.clientId===c.id).reduce((a,s)=>a+Math.max(0,s.total-s.paid),0);return {...c,pending}}).filter(c=>c.pending>0).sort((a,b)=>b.pending-a.pending);
 openModal("A receber",`<div class="list">${rows.map(c=>`<div class="item" data-pay-client="${c.id}"><div class="avatar">💰</div><div class="item-main"><b>${esc(c.name)}</b><small>Valores pendentes</small></div><div class="item-right"><b class="pending">${money(c.pending)}</b></div></div>`).join("")||'<div class="empty">Ninguém com valor pendente. 🎉</div>'}</div>`);
 document.querySelectorAll("[data-pay-client]").forEach(x=>x.onclick=()=>{let c=data.clients.find(c=>c.id===x.dataset.payClient);closeModal();openPaymentForClient(c)})
}
</script>
