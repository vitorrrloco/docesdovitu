/* ===== V1.1.0 RESPONSIVE UI ===== */
@media (min-width: 900px){
  body{background:#f3e3d1}
  .app{display:grid;grid-template-columns:250px minmax(0,1fr);grid-template-rows:78px minmax(0,1fr);height:100dvh}
  .top{grid-column:2;grid-row:1;height:auto;padding:10px 28px}
  .view{grid-column:2;grid-row:2;padding:26px 32px 34px;overflow:auto}
  .page{max-width:1240px}
  .nav{grid-column:1;grid-row:1 / span 2;width:auto;height:auto;margin:0;border:0;border-right:1px solid var(--line);border-radius:0;padding:22px 12px;display:flex;flex-direction:column;gap:8px;background:var(--white)}
  .nav:before{content:"🍫  DOCES DO VITU";font-size:16px;font-weight:900;color:var(--dark);padding:8px 12px 22px}
  .nav button{width:100%;min-height:56px;flex:none;display:flex;flex-direction:row;justify-content:flex-start;gap:12px;padding:0 15px;border-radius:15px}
  .nav .ni{font-size:23px;width:27px;text-align:center}.nav small{font-size:13px}
  .nav .active{background:var(--cream2);color:var(--dark)}
  .hero{padding:25px 28px}.hero h2{font-size:34px}
  .stats{grid-template-columns:repeat(4,1fr);gap:14px}.stat{min-height:120px;padding:18px}.stat strong{font-size:25px}
  .quick{grid-template-columns:repeat(4,1fr);gap:12px}.quick button{min-height:86px}
  .more{grid-template-columns:repeat(4,1fr)}
  .table-wrap{max-height:calc(100dvh - 225px)}
  .modal-bg{align-items:center;padding:20px}.modal{width:min(680px,100%);margin:auto;border-radius:25px;max-height:88dvh}
  .head h1{font-size:31px}
}
@media (min-width:1200px){
  .view{padding-left:42px;padding-right:42px}
  .page{max-width:1320px}
}
@media (max-width:899px){
  .nav{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
  .nav:before{display:none}
}

/* V1.5.3 FINAL - Financeiro compacto e centralizado no celular */
.finance-duo{width:100%;max-width:100%;margin-left:auto;margin-right:auto;align-items:stretch}
.finance-duo .analysis-card{min-width:0;padding:13px}
.finance-duo .section-title b{font-size:15px}
.finance-duo .item{padding:10px;border-radius:15px;gap:8px}
.finance-duo .avatar{width:38px;height:38px;flex-basis:38px;border-radius:12px;font-size:17px}
.finance-duo .item-main b{font-size:13px}
.finance-duo .item-main small{font-size:9px}
@media(max-width:899px){
  .finance-duo{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;width:calc(100% - 8px);margin-left:auto;margin-right:auto}
  .finance-duo .analysis-card{padding:12px;border-radius:18px}
}

.finance-duo{justify-content:center}
.finance-duo .top-sellers-list{max-height:126px;overflow-y:auto;overflow-x:hidden;padding-right:2px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.finance-duo .top-sellers-list .item{width:100%}
@media(max-width:699px){
  .finance-duo{width:100%;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;justify-items:center}
  .finance-duo .analysis-card{width:min(100%,430px);min-width:0;box-sizing:border-box}
  .finance-duo .top-sellers-list{width:100%;max-height:116px;overflow-y:auto;overflow-x:hidden;padding:0 2px;box-sizing:border-box;-webkit-overflow-scrolling:touch;scroll-snap-type:y proximity}
  .finance-duo .top-sellers-list .item{width:100%;max-width:100%;box-sizing:border-box;scroll-snap-align:start}
}

.boot-loader{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--cream);padding:24px;opacity:1;transition:opacity .18s ease,visibility .18s ease}.boot-loader.done{opacity:0;visibility:hidden;pointer-events:none}.boot-card{width:min(330px,88vw);text-align:center;padding:26px 22px;border-radius:22px;background:var(--white);box-shadow:0 14px 45px rgba(74,40,25,.14);display:flex;flex-direction:column;align-items:center;gap:8px}.boot-logo{font-size:42px;line-height:1}.boot-card b{font-size:19px;color:var(--dark)}.boot-card small{color:var(--muted);margin-bottom:8px}.boot-track{width:100%;height:7px;border-radius:99px;background:var(--cream2);overflow:hidden}.boot-bar{height:100%;width:0%;border-radius:99px;background:var(--brown);transition:width .12s ease}.boot-card strong{font-size:13px;color:var(--brown);min-height:18px}

/* V1.5.10 - planejamento de compra para 30 dias */

.purchase-30-head h3{margin:0;font-size:19px}
.purchase-30-head small{display:block;color:var(--muted);font-size:10px;margin-top:4px;line-height:1.35}
.purchase-30-badge{display:inline-flex;align-items:center;padding:7px 10px;border-radius:999px;background:var(--white);border:1px solid var(--line);font-size:10px;font-weight:800;white-space:nowrap}
.purchase-30-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.purchase-30-metric{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.purchase-30-metric small{display:block;color:var(--muted);font-size:10px;margin-bottom:4px}
.purchase-30-metric b{display:block;font-size:17px;overflow-wrap:anywhere}

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import {getFirestore,collection,doc,addDoc,setDoc,updateDoc,deleteDoc,onSnapshot,serverTimestamp,query,orderBy,getDocs,getDoc,runTransaction} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyAfH-93y7s1YK_3je_sZlofd8XJ1z436Yk",
 authDomain:"doces-do-vitu.firebaseapp.com",
 projectId:"doces-do-vitu",
 storageBucket:"doces-do-vitu.firebasestorage.app",
 messagingSenderId:"681586131940",
 appId:"1:681586131940:web:e8c213d9865621467e7df1",
 measurementId:"G-9QDNX23V8Z"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
let uid=null,currentUserName="Vitor",currentUserEmail="",unsubs=[],data={products:[],clients:[],sales:[],payments:[],purchases:[],logs:[]},page="home";

const numBR=v=>{if(typeof v==="number")return Number.isFinite(v)?v:0;if(v==null||v==="")return 0;let s=String(v).trim().replace(/R\$|\s/g,"");if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");const n=Number(s);return Number.isFinite(n)?n:0;};const money=n=>numBR(n).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const dt=v=>{let d=v?.toDate?v.toDate():new Date(v);return isNaN(d)?null:d};
const dateTime=v=>{let d=dt(v);return d?d.toLocaleDateString("pt-BR")+" • "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):"-"};
const dateOnly=v=>{let d=dt(v);return d?d.toLocaleDateString("pt-BR"):"-"};
const now=()=>new Date();
const status=(total,paid)=>paid>=total?"Pago":paid>0?"Parcial":"Pendente";
const statusClass=s=>s==="Pago"?"paid":s==="Parcial"?"partial":"pending";
const toast=m=>{$("toastRoot").innerHTML='<div class="toast">'+esc(m)+'</div>';setTimeout(()=>$("toastRoot").innerHTML="",2400)};
const msg=(m,ok=false)=>{$("loginMsg").textContent=m;$("loginMsg").style.color=ok?"#2d805b":"#b5483f"};

$("loginBtn").onclick=async()=>{try{msg("Entrando...",true);await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value)}catch(e){msg(firebaseError(e))}};
$("createBtn").onclick=async()=>{try{msg("Criando conta...",true);await createUserWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);msg("Conta criada!",true)}catch(e){msg(firebaseError(e))}};
$("password").addEventListener("keydown",e=>{if(e.key==="Enter")$("loginBtn").click()});
function firebaseError(e){return ({ "auth/invalid-credential":"E-mail ou senha incorretos.","auth/invalid-email":"Digite um e-mail válido.","auth/email-already-in-use":"Esse e-mail já possui uma conta.","auth/weak-password":"A senha precisa ter pelo menos 6 caracteres."}[e.code]||"Não foi possível entrar. Verifique sua conexão e os dados.")}

let bootProgress=0;
function bootSet(p){bootProgress=Math.max(0,Math.min(100,p));if($("bootBar")){$("bootBar").style.width=bootProgress+"%";$("bootPct").textContent=Math.round(bootProgress)+"%"}}
function bootFinish(){bootSet(100);requestAnimationFrame(()=>setTimeout(()=>{$("bootLoader")?.classList.add("done")},80))}

onAuthStateChanged(auth,async user=>{
 unsubs.forEach(u=>u());unsubs=[];bootSet(0);
 if(!user){uid=null;$('app').classList.add('hidden');$('login').classList.remove('hidden');$('bootLoader').classList.add('done');return}
 uid=user.uid;currentUserEmail=(user.email||'').toLowerCase();currentUserName=currentUserEmail==='xlocox000@gmail.com'?'Eduardo':currentUserEmail==='viitorcontas@gmail.com'?'Vitor':'Vitor';$('currentUser').textContent='👤 '+currentUserName;$('login').classList.add('hidden');
 try{bootSet(15);await migrateOwnDataToShared();bootSet(25);await seedImportedDebts();bootSet(30);await subscribeReady();bootSet(95);go('home');logAction('Login','Entrou no sistema');bootFinish();$('app').classList.remove('hidden')}catch(e){console.error(e);toast('Não foi possível carregar os dados.');bootFinish();$('app').classList.remove('hidden')}});

function col(name){return collection(db,"businesses","docesDoVitu",name)}
function oldCol(name){return collection(db,"users",uid,name)}
async function migrateOwnDataToShared(){
 const marker=`docesDoVituSharedMigration_${uid}`;
 if(localStorage.getItem(marker)==="done") return;
 const names=["products","clients","sales","payments","purchases","logs"];
 for(const name of names){
  const shared=await getDocs(col(name));
  if(!shared.empty) continue;
  const old=await getDocs(oldCol(name));
  if(old.empty) continue;
  await Promise.all(old.docs.map(d=>setDoc(doc(col(name),d.id),d.data())));
 }
 localStorage.setItem(marker,"done");
}
async function logAction(action,details=""){
 try{await addDoc(col("logs"),{action,details,createdByUid:uid,createdByName:currentUserName,createdAt:serverTimestamp()});}
 catch(e){console.warn("Log não salvo",e)}
}
async function seedImportedDebts(){
 const markerRef=doc(col("meta"),"initialDebtsV1");
 try{const marker=await getDoc(markerRef);if(marker.exists())return;
  const debts={"Gilberto":47,"Gabriel":15,"Rafael":32,"Jacare":16,"Guedes":13,"Duarte":24,"Eduardo":57,"Steuck":1,"Richard":67,"Roger":22,"Daniel Ponick":22,"Gabriel Ponick":2,"Crystian":34,"Vitor":15,"Maria Eduarda":8,"Murilo":5,"Diovana":2,"Julio":6,"Marinho":20,"Kricinski":38,"Mohammed":5,"Samuel":20,"Emanuel":14,"Jonathan":4,"Eduardo Silveira":17};
  const existing=await getDocs(col("clients"));
  const byName=new Map(existing.docs.map(d=>[String(d.data().name||"").trim().toLowerCase(),d]));
  for(const [name,value] of Object.entries(debts)){const found=byName.get(name.toLowerCase());if(found){const old=found.data();if(Number(old.initialDebt||0)===0)await updateDoc(found.ref,{initialDebt:value,initialDebtPaid:0});}else{await addDoc(col("clients"),{name,phone:"",initialDebt:value,initialDebtPaid:0,createdAt:serverTimestamp()});}}
  await setDoc(markerRef,{done:true,total:502,createdAt:serverTimestamp()});
 }catch(e){console.warn("Importação inicial de clientes pendentes não concluída",e)}
}
function subscribeReady(){
 return new Promise(resolve=>{
  const names=['products','clients','sales','payments','purchases']; let ready=0;
  const seen=new Set();
  names.forEach(name=>{
   const u=onSnapshot(col(name),snap=>{data[name]=snap.docs.map(d=>({id:d.id,...d.data()}));render();
    if(!seen.has(name)){seen.add(name);ready++;bootSet(30+ready*13);if(ready===names.length)resolve();}
   },()=>{if(!seen.has(name)){seen.add(name);ready++;if(ready===names.length)resolve();}toast('Não foi possível sincronizar '+name+'.')});
   unsubs.push(u);
  });
 });
}
function subscribe(){return subscribeReady()}

function go(p){
 page=p;
 document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));
 const view=$("view");
 view.classList.remove("page-swap");
 render();
 requestAnimationFrame(()=>{view.classList.add("page-swap");view.scrollTo({top:0,behavior:"auto"});});
}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>go(b.dataset.page));
$("quickSale").onclick=()=>openSale();

function render(){if(!uid)return;const v=$("view");if(page==="home")v.innerHTML=home();if(page==="sales")v.innerHTML=sales();if(page==="clients")v.innerHTML=clients();if(page==="stock")v.innerHTML=stock();if(page==="purchases")v.innerHTML=purchases();if(page==="finance")v.innerHTML=finance();bindPage();bindPrivacy()}
function monthBounds(ref=now()){
 const start=new Date(ref.getFullYear(),ref.getMonth(),1);start.setHours(0,0,0,0);
 const end=new Date(ref.getFullYear(),ref.getMonth()+1,1);end.setHours(0,0,0,0);
 return {start,end};
}
function monthSalesFor(ref=now()){
 const {start,end}=monthBounds(ref);
 return (data.sales||[]).filter(s=>{const d=dt(s.createdAt);return d&&d>=start&&d<end});
}
function monthPaymentsFor(ref=now()){
 const {start,end}=monthBounds(ref);
 return (data.payments||[]).filter(p=>{const d=dt(p.createdAt);return d&&d>=start&&d<end});
}
function salePendingAmount(s){return Math.max(0,numBR(s.total||0)-numBR(s.paid||0));}
function saleCostAmount(s){
 const products=data.products||[];
 return (Array.isArray(s.items)?s.items:[]).reduce((acc,i)=>{
  const qty=numBR(i.qty??i.quantity??0),stored=numBR(i.cost??i.unitCost??i.productCost??0);
  const prod=products.find(p=>p.id===(i.productId??i.id));
  const unit=stored>0?stored:numBR(prod?.cost??0);
  return acc+qty*unit;
 },0);
}
function totals(){
 const today=now(),sales=monthSalesFor(today),payments=monthPaymentsFor(today);
 const sold=sales.reduce((a,s)=>a+numBR(s.total||0),0);
 const received=payments.reduce((a,p)=>a+numBR(p.amount||0),0);
 const pending=sales.reduce((a,s)=>a+salePendingAmount(s),0);
 const todaySales=sales.filter(s=>{const d=dt(s.createdAt);return d&&d.toDateString()===today.toDateString()}).reduce((a,s)=>a+numBR(s.total||0),0);
 return {sold,received,pending,todaySales};
}
function privacyButton(){return `<button type="button" class="privacy-toggle" id="privacyToggle" aria-label="Ocultar valores" title="Ocultar valores">👁️</button>`}
function bindPrivacy(){
 const b=$("privacyToggle");if(!b)return;
 const sync=()=>{document.body.classList.toggle("privacy-hidden",localStorage.getItem("docesDoVituHideValues")==="1");const hidden=document.body.classList.contains("privacy-hidden");b.classList.toggle("active",hidden);b.textContent=hidden?"🙈":"👁️";b.title=hidden?"Mostrar valores":"Ocultar valores";b.setAttribute("aria-label",hidden?"Mostrar valores":"Ocultar valores")};
 b.onclick=()=>{localStorage.setItem("docesDoVituHideValues",document.body.classList.contains("privacy-hidden")?"0":"1");sync()};sync();
}

function home(){
 const t=totals(),low=data.products.filter(p=>numBR(p.stock||0)<=Number(p.minStock||2));
 return `<div class="page">
 <div class="head"><div><h1>Olá! 🍫</h1><p>Seu resumo de hoje • ${now().toLocaleDateString("pt-BR",{month:"long",year:"numeric"})}</p></div>${privacyButton()}</div>
 <div class="hero"><div><small>VENDAS HOJE</small><h2 class="private-number money-hero">${money(t.todaySales)}</h2><p>${data.sales.filter(s=>{let d=dt(s.createdAt);return d&&d.toDateString()===now().toDateString()}).length} vendas registradas hoje</p></div><div class="emoji">🍬</div></div>
 <div class="stats">
  <div class="stat"><small>TOTAL VENDIDO</small><strong class="private-number money-large">${money(t.sold)}</strong></div>
  <div class="stat"><small>A RECEBER</small><strong class="red private-number money-large">${money(t.pending)}</strong></div>
  <div class="stat"><small>RECEBIDO</small><strong class="green private-number money-large">${money(t.received)}</strong></div>
  <div class="stat"><small>PRODUTOS</small><strong>${data.products.length}</strong></div>
 </div>
 <div class="quick">
  <button class="quick-launch" id="qQuickSale"><span>⚡️</span><b>Lançamentos rápidos</b></button>
  <button id="qSale"><span>🛒</span><b>Nova venda</b></button>
  <button id="qClient"><span>👤</span><b>Novo cliente</b></button>
  <button id="qProduct"><span>📦</span><b>Novo produto</b></button>
  <button id="qAnalysis"><span>📈</span><b>Analisar vendas</b></button>
 </div>
 <div class="section"><div class="section-title"><b>Últimas vendas</b><button class="link" id="seeSales">Ver todas</button></div>
 <div class="list">${data.sales.slice().sort((a,b)=>(dt(b.createdAt)||0)-(dt(a.createdAt)||0)).slice(0,5).map(s=>saleItem(s)).join("")||'<div class="empty">Nenhuma venda registrada ainda.</div>'}</div></div>
 ${low.length?`<div class="section"><div class="section-title"><b>⚠️ Estoque baixo</b></div><div class="list">${low.slice(0,4).map(p=>`<div class="item"><div class="avatar">🍫</div><div class="item-main"><b>${esc(p.name)}</b><small>Estoque mínimo: ${p.minStock||2}</small></div><div class="item-right"><b>${p.stock||0} un.</b></div></div>`).join("")}</div></div>`:""}

  const reader=new FileReader();
  reader.onerror=()=>reject(new Error("Não foi possível ler a foto."));
  reader.onload=()=>{
   const img=new Image();
   img.onerror=()=>reject(new Error("Não foi possível abrir a foto."));
   img.onload=()=>{
    const max=420, scale=Math.min(1,max/Math.max(img.width,img.height));
    const w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
    const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;
    const ctx=canvas.getContext("2d");ctx.drawImage(img,0,0,w,h);
    let quality=.78, out=canvas.toDataURL("image/jpeg",quality);
    while(out.length>260000&&quality>.48){quality-=.07;out=canvas.toDataURL("image/jpeg",quality)}
    resolve(out);
   };
   img.src=reader.result;
  };
  reader.readAsDataURL(file);
 });
}

function productSalesFor(productId){

 const p=products.find(x=>x.id===productId); if(!p)return {p:null,items:[]};

 sales.forEach(s=>(Array.isArray(s.items)?s.items:[]).forEach(i=>{

function productStartDate(productId){

   const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
   const raw=d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});

function purchaseChartData(productId,monthKey){

 const rows=[];
 for(let day=1;day<=daysInMonth;day++){
   const start=new Date(year,month-1,day); start.setHours(0,0,0,0);
   const end=new Date(year,month-1,day+1); end.setHours(0,0,0,0);

}

 const ticket=monthSales.length?revenue/monthSales.length:0;

  try{

function availableAnalysisMonths(){
 const months=new Map(), today=now();
 (data.sales||[]).forEach(s=>{const d=dt(s.createdAt);if(!d)return;const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;months.set(key,new Date(d.getFullYear(),d.getMonth(),1));});
 const cur=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}`;months.set(cur,new Date(today.getFullYear(),today.getMonth(),1));
 return [...months.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([key,d])=>({key,label:d.toLocaleDateString("pt-BR",{month:"long",year:"numeric"})}));
}
function monthKeyDate(key){const [y,m]=String(key||"").split("-").map(Number);return Number.isFinite(y)&&Number.isFinite(m)?new Date(y,m-1,1):new Date(now().getFullYear(),now().getMonth(),1)}
function openAnalysis(){

 const opts=availableAnalysisMonths(),cur=`${now().getFullYear()}-${String(now().getMonth()+1).padStart(2,"0")}`,selected=opts.some(o=>o.key===cur)?cur:(opts[opts.length-1]?.key||cur);

function bindChartTooltip(){
 const chart=document.querySelector("#analysisContent .chart");
 if(!chart)return;
 let tip=document.querySelector("#chartTooltip");
 if(!tip){
  tip=document.createElement("div");
  tip.id="chartTooltip";
  tip.className="chart-tooltip";
  document.body.appendChild(tip);
 }
 const hide=()=>tip.classList.remove("show");
 const show=(dot,x,y)=>{
  const label=dot.getAttribute("data-chart-label")||"";
  const value=dot.getAttribute("data-chart-value")||"R$ 0,00";
  tip.textContent=`${label}: ${value}`;
  tip.style.left=`${Math.max(60,Math.min(window.innerWidth-60,x))}px`;
  tip.style.top=`${Math.max(55,y)}px`;
  tip.classList.add("show");
 };
 chart.querySelectorAll(".chart-hit").forEach(dot=>{
  dot.addEventListener("pointerenter",e=>show(dot,e.clientX,e.clientY));
  dot.addEventListener("pointermove",e=>show(dot,e.clientX,e.clientY));
  dot.addEventListener("pointerdown",e=>{e.preventDefault();dot.classList.add("chart-active");show(dot,e.clientX,e.clientY);});
  dot.addEventListener("pointerup",()=>{setTimeout(()=>dot.classList.remove("chart-active"),700);setTimeout(hide,1200)});
  dot.addEventListener("pointerleave",hide);
 });
}
function analysisHtml(kind,periods,selectedMonthKey){
 const sales=data.sales||[], nowD=now(), points=[];
 const sumBetween=(start,end)=>sales.filter(v=>{const x=dt(v.createdAt);return x&&x>=start&&x<end}).reduce((a,v)=>a+numBR(v.total||0),0);
 if(kind==="hour")for(let h=0;h<24;h++){let start=new Date(nowD);start.setHours(h,0,0,0);let end=new Date(start);end.setHours(h+1,0,0,0);points.push({label:String(h).padStart(2,"0")+"h",value:sumBetween(start,end)})}
 if(kind==="day")for(let i=6;i>=0;i--){let start=new Date(nowD);start.setHours(0,0,0,0);start.setDate(start.getDate()-i);let end=new Date(start);end.setDate(end.getDate()+1);points.push({label:start.toLocaleDateString("pt-BR",{weekday:"short"}).replace(".",""),value:sumBetween(start,end)})}
 if(kind==="week"){let base=new Date(nowD);base.setHours(0,0,0,0);base.setDate(base.getDate()-((base.getDay()+6)%7));for(let i=7;i>=0;i--){let start=new Date(base);start.setDate(start.getDate()-i*7);let end=new Date(start);end.setDate(end.getDate()+7);points.push({label:start.getDate()+"/"+(start.getMonth()+1),value:sumBetween(start,end)})}}
 let monthLabel="";
 if(kind==="month"){
  const md=monthKeyDate(selectedMonthKey),days=new Date(md.getFullYear(),md.getMonth()+1,0).getDate();monthLabel=md.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
  for(let d=1;d<=days;d++){let start=new Date(md.getFullYear(),md.getMonth(),d);start.setHours(0,0,0,0);let end=new Date(start);end.setDate(end.getDate()+1);points.push({label:String(d),value:sumBetween(start,end)})}
 }
 const total=points.reduce((a,p)=>a+p.value,0),max=Math.max(...points.map(p=>p.value),1),w=Math.max(620,points.length*20),h=220,pad=24,den=Math.max(points.length-1,1);
 const coords=points.map((p,i)=>({x:pad+i*(w-2*pad)/den,y:h-pad-(p.value/max)*(h-2*pad)}));
 const pts=coords.map(p=>`${p.x},${p.y}`).join(" "),step=Math.max(1,Math.ceil(points.length/10));
 const labels=points.map((p,i)=>i%step===0?`<text x="${coords[i].x}" y="${h-3}" text-anchor="middle">${esc(p.label)}</text>`:"").join("");
 const dots=coords.map((p,i)=>`<circle class="dot chart-hit" cx="${p.x}" cy="${p.y}" r="5" data-chart-label="${esc(points[i].label)}" data-chart-value="${money(points[i].value)}"></circle>`).join("");
 const monthSelect=kind==="month"?`<div class="analysis-month-row"><label>Escolha o mês para analisar</label><select id="analysisMonthSelect" class="month-select">${availableAnalysisMonths().map(o=>`<option value="${o.key}" ${o.key===selectedMonthKey?"selected":""}>${esc(o.label)}</option>`).join("")}</select></div>`:"";
 const sub=kind==="month"?monthLabel:periods[kind];
 return `${monthSelect}<div class="analysis-card"><div class="analysis-head"><div><small style="color:var(--muted)">${esc(sub)}</small><div style="margin-top:3px">Total vendido</div></div><strong class="private-number money-large">${money(total)}</strong></div><div class="chart"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline class="line" points="${pts}"/>${dots}${labels}</svg></div></div>${kind==="month"?`<div class="analysis-card"><div class="section-title"><span>Vendas no mês</span><b class="private-number money-small">${money(total)}</b></div><small style="color:var(--muted)">${points.length} dias exibidos, incluindo dias sem venda.</small></div>`:""}`;
}

function openEditSale(s){

 openModal("Editar venda",`<div class="form"><div class="field"><label>Cliente</label><select id="esClient"><option value="">Venda balcão</option>${clients.map(c=>`<option value="${c.id}" ${c.id===s.clientId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Produto</label><select id="esProduct">${products.map(p=>`<option value="${p.id}" ${p.id===old.productId?'selected':''}>${esc(p.name)} • ${money(p.price)} • ${p.stock} un.</option>`).join('')}</select></div><div class="row"><div class="field"><label>Quantidade</label><input id="esQty" type="number" min="1" value="${Number(old.qty||1)}"></div><div class="field"><label>Valor</label><input id="esTotal" type="number" min="0" step="0.01" value="${numBR(s.total||0).toFixed(2)}"></div></div><div class="field"><label>Valor pago</label><input id="esPaid" type="number" min="0" step="0.01" value="${Number(s.paid||0).toFixed(2)}"></div><div class="actions"><button class="secondary" id="esCancel">Cancelar</button><button class="primary" id="esSave">Salvar alterações</button></div></div>`);$("esCancel").onclick=closeModal;
 $("esSave").onclick=async()=>{const btn=$("esSave");if(btn.dataset.busy==="1")return;btn.dataset.busy="1";btn.disabled=true;try{const np=products.find(p=>p.id===$("esProduct").value),nq=Math.max(1,Math.floor(Number($("esQty").value)||1)),nt=Math.max(0,Number($("esTotal").value)||0),paid=Math.min(nt,Math.max(0,Number($("esPaid").value)||0)),nc=clients.find(c=>c.id===$("esClient").value);if(!np||!nt)throw Error("Produto e valor são obrigatórios.");const saleRef=doc(col("sales"),s.id),newRef=doc(col("products"),np.id),originalTotal=Number(np.price||0)*nq,discountAmount=Math.max(0,originalTotal-nt),discountPct=originalTotal?discountAmount/originalTotal*100:0;let oldProductId="",oldQty=0;await runTransaction(db,async tx=>{const saleSnap=await tx.get(saleRef);if(!saleSnap.exists())throw Error("Venda não encontrada.");const sale=saleSnap.data(),oi=sale.items?.[0]||{};oldProductId=oi.productId;oldQty=Number(oi.qty||0);const oldRef=doc(col("products"),oldProductId),refs=oldProductId===np.id?[oldRef]:[oldRef,newRef],snaps=[];for(const ref of refs)snaps.push(await tx.get(ref));const oldSnap=snaps[0];if(oldSnap.exists()){const stock=numBR(oldSnap.data().stock||0);if(oldProductId===np.id){const available=stock+oldQty;if(nq>available)throw Error(`Estoque insuficiente. Disponível para esta alteração: ${available}.`);tx.update(oldRef,{stock:available-nq});}else{tx.update(oldRef,{stock:stock+oldQty});const newSnap=snaps[1];if(!newSnap.exists())throw Error("Novo produto não encontrado.");const newStock=numBR(newSnap.data().stock||0);if(nq>newStock)throw Error(`Estoque insuficiente. Disponível: ${newStock}.`);tx.update(newRef,{stock:newStock-nq});}}else if(oldProductId!==np.id){const newSnap=snaps[1];if(!newSnap.exists())throw Error("Novo produto não encontrado.");const newStock=numBR(newSnap.data().stock||0);if(nq>newStock)throw Error(`Estoque insuficiente. Disponível: ${newStock}.`);tx.update(newRef,{stock:newStock-nq});}else throw Error("Produto da venda não encontrado.");tx.update(saleRef,{clientId:nc?.id||"",clientName:nc?.name||"Venda balcão",items:[{productId:np.id,name:np.name,qty:nq,price:nt/nq,originalPrice:np.price,cost:Number(np.cost||0)}],originalTotal,total:nt,discountAmount,discountPct,paid,updatedAt:serverTimestamp()});});
 const ps=await getDocs(col("payments"));await Promise.all(ps.docs.filter(d=>d.data()?.saleId===s.id).map(d=>deleteDoc(doc(col("payments"),d.id))));if(paid>0)await addDoc(col("payments"),{saleId:s.id,clientId:nc?.id||"",clientName:nc?.name||"Venda balcão",amount:paid,createdAt:serverTimestamp(),method:s.paymentMethod||"Pagamento"});closeModal();render();toast("Venda alterada com sucesso!")}catch(e){console.error(e);toast(e.message||"Não foi possível alterar a venda.")}finally{btn.dataset.busy="0";btn.disabled=false}};
}
function confirmDeleteSale(s){
 openModal("Excluir venda?",`<div class="form"><p>Tem certeza que deseja excluir <b>${esc(s.clientName||"Venda balcão")}</b> no valor de <b>${money(s.total)}</b>?</p><p><small>O estoque será devolvido e os pagamentos vinculados serão removidos.</small></p><div class="field"><label>Digite EXCLUIR para confirmar</label><input id="delSaleText" autocomplete="off"></div><div class="actions"><button class="secondary" id="delCancel">Cancelar</button><button class="primary" id="delDo" disabled>Excluir venda</button></div></div>`);$("delCancel").onclick=closeModal;$("delSaleText").oninput=e=>$("delDo").disabled=e.target.value.trim().toUpperCase()!=="EXCLUIR";
 $("delDo").onclick=async()=>{const btn=$("delDo");if(btn.dataset.busy)return;btn.dataset.busy="1";btn.disabled=true;try{const saleRef=doc(col("sales"),s.id);let saleData=null;await runTransaction(db,async tx=>{const saleSnap=await tx.get(saleRef);if(!saleSnap.exists())throw Error("Venda não encontrada.");saleData=saleSnap.data();const grouped=new Map();for(const i of(saleData.items||[])){if(!i.productId)continue;grouped.set(i.productId,(grouped.get(i.productId)||0)+Number(i.qty||0));}const refs=[...grouped.keys()].map(id=>doc(col("products"),id)),snaps=[];for(const ref of refs)snaps.push(await tx.get(ref));refs.forEach((ref,idx)=>{const snap=snaps[idx];if(snap.exists()){const stock=numBR(snap.data().stock||0);tx.update(ref,{stock:stock+(grouped.get(ref.id)||0)});}});tx.delete(saleRef);});const ps=await getDocs(col("payments"));await Promise.all(ps.docs.filter(d=>d.data()?.saleId===s.id).map(d=>deleteDoc(doc(col("payments"),d.id))));await logAction("Venda excluída",`${saleData?.clientName||s.clientName||"Venda balcão"} • ${money(saleData?.total||s.total)}`);closeModal();render();toast("Venda excluída com sucesso!")}catch(e){console.error(e);toast(e.message||"Não foi possível excluir a venda.")}finally{btn.dataset.busy="";btn.disabled=false}};
}

function applyTheme(theme){
  const dark = theme === "dark";
  document.body.classList.toggle("theme-dark", dark);
  document.documentElement.classList.toggle("theme-dark", dark);
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", dark ? "#141210" : "#5b321f");
  const btn=document.getElementById("themeToggle");
  if(btn) btn.textContent = dark ? "☀️  Modo claro" : "🌙  Modo escuro";
}
function toggleTheme(){
  const next=document.body.classList.contains("theme-dark") ? "light" : "dark";
  localStorage.setItem("dv-theme",next);
  applyTheme(next);
}
applyTheme(localStorage.getItem("dv-theme")==="dark" ? "dark" : "light");
