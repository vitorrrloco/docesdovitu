<title>Grupo Bernardo Alimentos</title>
<style>

.hidden{display:none!important}
#login{height:100dvh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#efebe2,#fffaf3)}

.logo .candy{font-size:65px}.logo b{display:block;font-size:25px;letter-spacing:2px;text-align:center;color:var(--dark)}
.logo small{display:block;text-align:center;color:var(--brown);font-weight:700;margin-top:5px}
.login-card h1{font-size:27px;margin:0 0 6px}.login-card p{color:var(--muted);margin:0 0 20px}
.field{margin-bottom:13px}.field label{display:block;font-size:13px;font-weight:800;margin:0 0 6px;color:var(--dark2)}
.field input,.field select,.field textarea{width:100%;height:54px;border:1px solid var(--line);border-radius:15px;background:#fff;padding:0 14px;outline:none;color:var(--text)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brown);box-shadow:0 0 0 4px #a77f1b1a}
.primary{width:100%;min-height:54px;border-radius:15px;background:var(--dark);color:#0a0a0a;font-weight:800}

.user-badge{display:inline-flex;appearance:none;align-items:center;background:var(--cream2);color:var(--dark);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:11px;font-weight:800;white-space:nowrap}.app{height:100dvh;display:flex;flex-direction:column;overflow:hidden;min-width:0}

.brand b{font-size:17px;display:block;letter-spacing:.4px}.brand small{font-size:10px;color:var(--muted);display:block;margin-top:2px}

.hero{background:linear-gradient(135deg,var(--dark),var(--dark2));color:#0a0a0a;border-radius:25px;padding:19px;margin-bottom:13px;box-shadow:var(--shadow);display:flex;justify-content:space-between;gap:10px}.hero small{opacity:.72}.hero h2{font-size:28px;margin:5px 0;display:block}.hero h2.private-number{display:block}.hero p{margin:0;opacity:.78;font-size:12px}.hero .emoji{font-size:42px;align-self:center}

.privacy-toggle{width:42px;height:38px;border-radius:13px;background:var(--cream2);color:var(--dark);border:1px solid var(--line);font-size:18px;font-weight:800;cursor:pointer}.privacy-toggle.active{background:var(--dark);color:#0a0a0a;border-color:var(--dark)}.private-number{display:inline-block;min-width:3.8ch}.privacy-hidden .private-number{font-size:0!important;letter-spacing:0}.privacy-hidden .private-number::after{content:"••••";font-size:12px!important;letter-spacing:2px}.privacy-hidden .private-number.money-large::after{font-size:21px!important}.privacy-hidden .private-number.money-hero::after{font-size:28px!important}.privacy-hidden .private-number.money-small::after{font-size:13px!important}.month-select{height:44px;border:1px solid var(--line);border-radius:13px;background:var(--white);color:var(--text);padding:0 12px;font-weight:800;outline:none}.analysis-month-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.analysis-month-row label{font-size:12px;font-weight:800;color:var(--muted)}.stat{background:var(--white);border:1px solid var(--line);border-radius:19px;padding:15px;min-height:105px;box-shadow:var(--shadow)}.stat small{display:block;color:var(--muted);font-size:11px}.stat strong{display:block;font-size:22px;margin-top:7px}.stat .green{color:var(--green)}.stat .red{color:var(--red)}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:19px}.quick-launch{background:var(--dark)!important;color:#0a0a0a !important;border-color:var(--dark)!important;grid-column:1/-1;min-height:58px!important;text-align:center!important;padding:10px 14px!important;display:flex;align-items:center;justify-content:center;gap:8px}.quick-launch span{float:none!important;margin:0!important;font-size:22px}.quick-launch b{display:inline!important;font-size:14px}.fast-products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}.fast-product{background:var(--cream2);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left;min-height:58px;color:var(--dark)}.fast-product b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fast-product small{display:block;margin-top:3px;color:var(--muted);font-size:10px}.quick-client-results{max-height:170px;overflow:auto;margin-top:6px}.quick-client-results .client-result{background:var(--white);border:0;border-radius:0;margin:0;position:relative}.quick-client-results .client-result + .client-result{border-top:1px solid var(--line);border-radius:0}.quick-client-results .client-result:first-child{border-radius:11px 11px 0 0}.quick-client-results .client-result:last-child{border-radius:0 0 11px 11px}.quick button{background:var(--white);border:1px solid var(--line);border-radius:17px;min-height:68px;text-align:left;padding:12px;box-shadow:0 4px 14px #23232308}.quick b{display:block;font-size:13px}.quick span{font-size:22px;float:left;margin-right:9px}
.section{margin-top:15px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:0 2px 9px}.section-title b{font-size:17px}.link{background:none;color:var(--brown);font-size:12px;font-weight:800}
.list{display:grid;gap:9px}.item{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;align-items:center;gap:10px}.avatar{width:43px;height:43px;flex:0 0 43px;border-radius:14px;background:var(--cream2);display:grid;place-items:center;font-size:19px}.item-main{min-width:0;flex:1}.item-main b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-main small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.item-right{text-align:right}.item-right b{display:block;font-size:13px}.status{font-size:9px;font-weight:800;margin-top:4px}.stock-actions{display:flex;gap:5px;margin-top:7px;justify-content:flex-end;flex-wrap:wrap}.stock-card{align-items:flex-start}.stock-card .item-main{min-width:0}.stock-card .item-right{min-width:0;max-width:100%}.client-result + .client-result{border-top:2px solid var(--line);border-radius:0}.client-result:first-child{border-radius:11px 11px 0 0}.client-result:last-child{border-radius:0 0 11px 11px}.stock-head-actions{display:flex;align-items:center;gap:7px}.stock-head-actions .top-action{flex:0 0 46px}.stock-avulsa-head{height:46px;border-radius:15px;background:var(--cream2);color:var(--dark);font-size:13px;font-weight:900;padding:0 13px;border:1px solid var(--line);white-space:nowrap}@media(max-width:560px){.stock-card{display:grid;grid-template-columns:43px minmax(0,1fr);align-items:start}.stock-card .item-right{grid-column:1/-1;text-align:left;display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding-left:53px;margin-top:2px}.stock-card .item-right>b,.stock-card .item-right>small{display:inline-block}.stock-card .stock-actions{width:100%;justify-content:flex-start}.stock-card .stock-actions button{font-size:10px!important;padding:8px 9px!important}.stock-head-actions{gap:5px}.stock-avulsa-head{padding:0 10px;font-size:11px}.head{gap:8px}.head>div{min-width:0}.head h1{white-space:nowrap}.brand b{white-space:nowrap}.brand{min-width:0}.brand>div:last-child{min-width:0;overflow:hidden}.brand small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}.paid{color:var(--green)}.pending{color:var(--red)}.partial{color:var(--orange)}
.client-results{position:relative;left:auto;right:auto;top:auto;z-index:10000;background:var(--white);border:1px solid var(--line);border-radius:15px;box-shadow:0 12px 30px #0002;max-height:240px;overflow:auto;padding:6px}.client-result{display:flex;flex-direction:column;align-items:flex-start;width:100%;background:transparent;color:var(--text);padding:11px 12px;border-radius:11px;text-align:left}.client-result:hover,.client-result:focus,.client-result.active{background:var(--cream2);outline:none}.client-result small{color:var(--muted);font-size:11px;margin-top:2px}.client-no-results{padding:12px;color:var(--muted);font-size:13px}.search{height:50px;width:100%;border:1px solid var(--line);border-radius:15px;background:#fff;padding:0 14px;outline:none;margin-bottom:10px}
.toolbar{display:flex;gap:8px;margin-bottom:10px}.toolbar .search{margin:0;flex:1}.toolbar button{width:50px;border-radius:15px;background:var(--dark);color:#0a0a0a;font-size:24px}
.form{background:var(--white);border:1px solid var(--line);border-radius:21px;padding:16px;margin-bottom:11px;box-shadow:var(--shadow)}.form h3{margin:0 0 13px;font-size:17px}.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px;min-width:0}.actions{display:flex;gap:8px;margin-top:11px;min-width:0}.actions>*{min-width:0}.actions button{flex:1;min-height:50px;border-radius:14px;font-weight:800}
.table-wrap{overflow:auto;background:var(--white);border:1px solid var(--line);border-radius:19px;box-shadow:var(--shadow)}table{width:100%;border-collapse:collapse;min-width:590px}th,td{padding:11px 10px;border-bottom:1px solid var(--line);font-size:11px;text-align:left;white-space:nowrap}th{background:var(--cream2);color:var(--dark);font-size:10px;text-transform:uppercase}tr:last-child td{border-bottom:0}
.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.tabs button{flex:0 0 auto;background:var(--white);border:1px solid var(--line);color:var(--muted);padding:9px 13px;border-radius:13px;font-size:11px;font-weight:800}.tabs button.active{background:var(--dark);color:#0a0a0a;border-color:var(--dark)}
.analysis-card{min-width:0;overflow:hidden;background:var(--white);border:1px solid var(--line);border-radius:21px;padding:15px;margin-bottom:12px;box-shadow:var(--shadow)}.analysis-head{display:flex;justify-content:space-between;align-items:end;min-width:0;gap:10px}.analysis-head>div{min-width:0}.analysis-head strong{white-space:nowrap;flex:0 0 auto}.analysis-head b{font-size:17px}.analysis-head strong{font-size:22px;color:var(--dark)}.chart{height:220px;width:100%;min-width:0;margin-top:12px;position:relative;overflow:hidden}.chart svg{width:100%;height:100%;overflow:visible;display:block}.chart text{font-size:10px;fill:var(--muted)}.line{fill:none;stroke:var(--dark);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.dot{fill:var(--caramel);stroke:var(--white);stroke-width:2}.chart-hit{cursor:pointer;transition:r .12s ease,stroke-width .12s ease}.chart-hit:hover,.chart-hit.chart-active{r:7;stroke-width:3}
.finance-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));min-width:0;gap:10px;margin-bottom:12px}.finance-card{min-width:0;overflow:hidden;background:var(--white);border:1px solid var(--line);border-radius:19px;padding:15px;box-shadow:var(--shadow)}.finance-card small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;font-weight:800}.finance-card strong{display:block;font-size:22px;margin-top:6px}.finance-card p{margin:5px 0 0;overflow-wrap:anywhere;color:var(--muted);font-size:10px}.finance-positive{color:var(--green)}.finance-negative{color:var(--red)}.finance-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}.finance-actions button{min-height:58px}.more{display:grid;grid-template-columns:1fr 1fr;gap:10px}.more button{min-height:118px;background:var(--white);border:1px solid var(--line);border-radius:19px;padding:14px;text-align:left}.more .mi{font-size:28px;display:block;margin-bottom:9px}.more b{display:block;font-size:14px}.more small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.modal-bg{position:fixed;inset:0;background:#14141473;z-index:5000;display:flex;align-items:flex-end;pointer-events:auto}.modal{position:relative;z-index:1;pointer-events:auto;width:100%;max-width:620px;margin:auto auto 0;max-height:92dvh;overflow:auto;background:var(--white);border-radius:25px 25px 0 0;padding:17px 15px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px #0003}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.modal-head h2{margin:0;font-size:20px}.close{width:40px;height:40px;border-radius:13px;background:var(--cream2);font-size:22px;color:var(--dark)}
.nav{height:82px;flex:0 0 calc(82px + env(safe-area-inset-bottom));padding:6px 4px env(safe-area-inset-bottom);background:var(--white);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));z-index:1000}.nav button{background:none;color:var(--muted);border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.nav .ni{font-size:24px;line-height:27px}.nav small{font-size:10px;font-weight:800}.nav .active{background:var(--cream2);color:var(--dark)}
.toast{position:fixed;left:14px;right:14px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:9000;background:var(--dark);color:#0a0a0a;padding:13px;border-radius:15px;text-align:center;font-size:13px;box-shadow:0 10px 30px #0003}
.empty{text-align:center;color:var(--muted);padding:30px 15px;background:var(--white);border:1px dashed var(--line);border-radius:18px;font-size:13px}
@media(min-width:700px){.view{padding-left:24px;padding-right:24px}.nav{max-width:720px;width:100%;margin:0 auto;border-radius:22px 22px 0 0}.finance-grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:370px){.view{padding-left:10px;padding-right:10px}.head h1{font-size:25px}.stats{gap:7px}.stat{padding:12px}.more{gap:8px}.more button{padding:12px}}

/* ===== V1.1.0 RESPONSIVE UI ===== */
@media (min-width: 900px){
  body{background:#ebe6d9}
  .app{display:grid;grid-template-columns:250px minmax(0,1fr);grid-template-rows:78px minmax(0,1fr);height:100dvh}
  .top{grid-column:2;grid-row:1;height:auto;padding:10px 28px}
  .view{grid-column:2;grid-row:2;padding:26px 32px 34px;overflow:auto}
  .page{max-width:1240px}
  .nav{grid-column:1;grid-row:1 / span 2;width:auto;height:auto;margin:0;border:0;border-right:1px solid var(--line);border-radius:0;padding:22px 12px;display:flex;flex-direction:column;gap:8px;background:var(--white)}
  .nav:before{content:"GRUPO BERNARDO";font-size:16px;font-weight:900;color:var(--dark);padding:8px 12px 22px}
  .nav button{width:100%;min-height:56px;flex:none;display:flex;flex-direction:row;justify-content:flex-start;gap:12px;padding:0 15px;border-radius:15px}
  .nav .ni{font-size:23px;width:27px;text-align:center}.nav small{font-size:13px}
  .nav .active{background:var(--cream2);color:var(--dark)}
  .hero{padding:25px 28px}.hero h2{font-size:34px}
  .stats{grid-template-columns:repeat(4,1fr);gap:14px}.stat{min-height:120px;padding:18px}.stat strong{font-size:25px}
  .quick{grid-template-columns:repeat(4,1fr);gap:12px}.quick button{min-height:86px}
  .more{grid-template-columns:repeat(4,1fr)}
  .table-wrap{max-height:calc(100dvh - 225px)}
  .modal-bg{align-items:center;padding:20px}.modal{width:min(680px,100%);margin:auto;border-radius:25px;max-height:88dvh}
  .head h1{font-size:31px}
}
@media (min-width:1200px){
  .view{padding-left:42px;padding-right:42px}
  .page{max-width:1320px}
}
@media (max-width:899px){
  .nav{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
  .nav:before{display:none}
}

/* V1.5.3 FINAL - Financeiro compacto e centralizado no celular */
.finance-duo{width:100%;max-width:100%;margin-left:auto;margin-right:auto;align-items:stretch}
.finance-duo .analysis-card{min-width:0;padding:13px}
.finance-duo .section-title b{font-size:15px}
.finance-duo .item{padding:10px;border-radius:15px;gap:8px}
.finance-duo .avatar{width:38px;height:38px;flex-basis:38px;border-radius:12px;font-size:17px}
.finance-duo .item-main b{font-size:13px}
.finance-duo .item-main small{font-size:9px}
@media(max-width:899px){
  .finance-duo{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;width:calc(100% - 8px);margin-left:auto;margin-right:auto}
  .finance-duo .analysis-card{padding:12px;border-radius:18px}
}

.finance-duo{justify-content:center}
.finance-duo .top-sellers-list{max-height:126px;overflow-y:auto;overflow-x:hidden;padding-right:2px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.finance-duo .top-sellers-list .item{width:100%}
@media(max-width:699px){
  .finance-duo{width:100%;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;justify-items:center}
  .finance-duo .analysis-card{width:min(100%,430px);min-width:0;box-sizing:border-box}
  .finance-duo .top-sellers-list{width:100%;max-height:116px;overflow-y:auto;overflow-x:hidden;padding:0 2px;box-sizing:border-box;-webkit-overflow-scrolling:touch;scroll-snap-type:y proximity}
  .finance-duo .top-sellers-list .item{width:100%;max-width:100%;box-sizing:border-box;scroll-snap-align:start}
}

/* Tela de abertura premium GRUPO BERNARDO */
.boot-loader{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(ellipse at 50% 32%,#2d2d2d 0%,#1a1a1a 48%,#111111 100%);padding:26px;opacity:1;transition:opacity .35s ease,visibility .35s ease;color:#f6f2e8}
.boot-loader:before{content:"";position:absolute;width:78vw;height:78vw;max-width:460px;max-height:460px;border:1px solid #f7c64a22;border-radius:50%;top:50%;left:50%;transform:translate(-50%,-58%);box-shadow:0 0 0 24px #f7c64a08,0 0 0 54px #f7c64a05;pointer-events:none}
.boot-loader.done{opacity:0;visibility:hidden;pointer-events:none}
.boot-card{position:relative;width:min(360px,90vw);text-align:center;padding:26px 22px 25px;border:1px solid #f8c74b35;border-radius:28px;background:linear-gradient(160deg,#232323eF,#171717f2);box-shadow:0 24px 70px #07070766;display:flex;flex-direction:column;align-items:center;gap:12px}
.boot-logo{width:min(66vw,238px);aspect-ratio:1;overflow:hidden;border-radius:22px;line-height:1;box-shadow:0 12px 32px #08080840}
.boot-logo img{display:block;width:100%;height:100%;object-fit:cover}
.boot-card b{font-family:Avenir Next,Helvetica Neue,Helvetica,Arial,sans-serif;font-size:22px;letter-spacing:.08em;color:#f5f1e6;margin-top:2px}
.boot-card .boot-tagline{font-size:10px;letter-spacing:.19em;text-transform:uppercase;color:#f9d06a;margin-top:-5px}
.boot-status{display:flex;align-items:center;gap:9px;color:#e1dac7;font-size:12px;margin-top:7px}
.boot-spinner{width:15px;height:15px;border:2px solid #f7c64a45;border-top-color:#f9cf66;border-radius:50%;animation:bootSpin .8s linear infinite;flex:0 0 auto}
@keyframes bootSpin{to{transform:rotate(360deg)}}
.boot-track{width:100%;height:3px;border-radius:99px;background:#ffffff18;overflow:hidden;margin-top:2px}

function isSellerEmail(email){return Object.values(SELLERS).some(x=>x.email===String(email||'').toLowerCase())}
function isProductActive(p){return p?.isActive!==false}
async function publishSellerCatalog(){
 const products=data.products||[];
 const fingerprint=JSON.stringify(products.map(p=>({id:p.id,name:p.name,price:Number(p.price||0),stock:Number(p.stock||0),isActive:isProductActive(p)})));
 const marker='docesDoVituSellerCatalogFingerprintV1';
 try{if(localStorage.getItem(marker)===fingerprint)return;}catch(e){}
 for(const p of products){
  const ref=doc(db,'sellerCatalog',p.id);let sellerPrices={};
  try{const old=await getDoc(ref);if(old.exists())sellerPrices=old.data().sellerPrices||{};}catch(e){console.warn('Não foi possível preservar preços personalizados',e)}
  await setDoc(ref,{name:p.name,price:Number(p.price||0),stock:Number(p.stock||0),isActive:isProductActive(p),sellerPrices,updatedAt:serverTimestamp()},{merge:true});
 }
 try{localStorage.setItem(marker,fingerprint);}catch(e){}
}

 try{
  const used=new Set((data.clients||[]).map(c=>String(c.publicCode||c.clientCode||'')).filter(x=>/^\d{6}$/.test(x)));
  for(const existing of (data.clients||[]).filter(c=>/^\d{6}$/.test(String(c.publicCode||c.clientCode||'')))){try{const code=String(existing.publicCode||existing.clientCode);await runTransaction(db,async tx=>{const ref=doc(col('clientCodeReservations'),code),snap=await tx.get(ref);if(!snap.exists())tx.set(ref,{code,clientId:existing.id,createdAt:serverTimestamp()})})}catch(e){console.warn('Reserva de código existente não concluída:',e)}}
  for(const c of missing){
   const code=await reserveClientPublicCode();used.add(code);await updateDoc(doc(col('clients'),c.id),{publicCode:code});
  }

function monthBounds(ref=now()){
 const start=new Date(ref.getFullYear(),ref.getMonth(),1);start.setHours(0,0,0,0);
 const end=new Date(ref.getFullYear(),ref.getMonth()+1,1);end.setHours(0,0,0,0);
 return {start,end};
}
function monthSalesFor(ref=now()){
 const {start,end}=monthBounds(ref);
 return (data.sales||[]).filter(s=>{const d=dt(s.createdAt);return d&&d>=start&&d<end});
}
function monthPaymentsFor(ref=now()){
 const {start,end}=monthBounds(ref);
 return (data.payments||[]).filter(p=>{const d=dt(p.createdAt);return d&&d>=start&&d<end});
}
function salePendingAmount(s){return Math.max(0,numBR(s.total||0)-numBR(s.paid||0));}
function saleCostAmount(s){
 const products=data.products||[];
 return (Array.isArray(s.items)?s.items:[]).reduce((acc,i)=>{
  const qty=numBR(i.qty??i.quantity??0),stored=numBR(i.cost??i.unitCost??i.productCost??0);
  const prod=products.find(p=>p.id===(i.productId??i.id));
  const unit=stored>0?stored:numBR(prod?.cost??0);
  return acc+qty*unit;
 },0);
}
function totals(){
 const today=now(),sales=monthSalesFor(today),payments=monthPaymentsFor(today);
 const sold=sales.reduce((a,s)=>a+numBR(s.total||0),0);
 const received=payments.reduce((a,p)=>a+numBR(p.amount||0),0);
 const pending=sales.reduce((a,s)=>a+salePendingAmount(s),0);
 const todaySales=sales.filter(s=>{const d=dt(s.createdAt);return d&&d.toDateString()===today.toDateString()}).reduce((a,s)=>a+numBR(s.total||0),0);
 return {sold,received,pending,todaySales};
}

function monthSalesData(){
 const n=now(), y=n.getFullYear(), m=n.getMonth();
 const sales=(data.sales||[]).filter(s=>{const d=dt(s.createdAt);return d&&d.getFullYear()===y&&d.getMonth()===m});
 const revenue=sales.reduce((a,s)=>a+numBR(s.total||0),0),cost=sales.reduce((a,s)=>a+saleCostAmount(s),0);
 return {sales,revenue,cost,profit:revenue-cost,days:n.getDate()};
}

function vituInsights(){
 const m=monthSalesData(),products=data.products||[],sales=data.sales||[],qtyBy={};
 sales.forEach(s=>(s.items||[]).forEach(i=>{const n=i.name||'Produto';qtyBy[n]=(qtyBy[n]||0)+numBR(i.qty||0)}));
 const top=Object.entries(qtyBy).sort((a,b)=>b[1]-a[1])[0],low=products.filter(p=>numBR(p.stock||0)<=Number(p.minStock||2));

function subscribeSellerRequests(){

 // Vendas aprovadas permanecem no histórico de sales e não precisam ser
 // baixadas novamente a cada alteração na fila de aprovação.
 const pendingQuery=query(collection(db,'sellerRequests'),where('status','==','pending'));
 const u=onSnapshot(pendingQuery,snap=>{
  data.sellerRequests=snap.docs.map(d=>({id:d.id,...d.data()}));
  if(page==='home')render();
 },e=>{console.error(e);toast('Não foi possível carregar as vendas pendentes dos vendedores.')});
 unsubs.push(u);
}
async function approveSellerRequest(id){
 const reqRef=doc(db,'sellerRequests',id),saleRef=doc(col('sales')),paymentRef=doc(col('payments'));
 try{
  const rq=(data.sellerRequests||[]).find(x=>x.id===id);
  if(rq?.requestType==='payment'){
   const targets=(rq.allocations||[]).map(a=>({a,requestRef:doc(db,'sellerRequests',a.requestId),saleRef:doc(col('sales'),a.saleId)}));
   await runTransaction(db,async tx=>{
    const pending=await tx.get(reqRef);if(!pending.exists()||pending.data().status!=='pending')throw new Error('Solicitação já processada.');
    const reads=[];for(const t of targets){reads.push({t,ss:await tx.get(t.saleRef),rs:await tx.get(t.requestRef)});}
    let left=Number(pending.data().amount)||0;const updates=[];
    // A solicitação original do vendedor preserva o preço efetivamente praticado por ele.
    // Usar apenas sale.total do administrador pode rejeitar baixas quando os preços divergem.
    for(const r of reads){if(left<=0.009)break;if(!r.ss.exists()||!r.rs.exists())continue;const s=r.ss.data(),sr=r.rs.data();const authoritativeTotal=Number(sr.total??s.total)||0;const authoritativePaid=Number(sr.paid??s.paid)||0;const open=Math.max(0,authoritativeTotal-authoritativePaid),use=Math.min(open,left);if(use>0){updates.push({r,s,sr,use,authoritativeTotal,authoritativePaid});left-=use;}}
    if(left>0.009)throw new Error('O valor solicitado excede o saldo das vendas vinculadas. Atualize a lista de vendas do vendedor e confira o histórico antes de tentar novamente.');

function compressClientPhoto(file){
 return new Promise((resolve,reject)=>{
  if(!file)return resolve("");
  if(!file.type||!file.type.startsWith("image/"))return reject(new Error("Selecione uma imagem válida."));
  const reader=new FileReader();
  reader.onerror=()=>reject(new Error("Não foi possível ler a foto."));
  reader.onload=()=>{
   const img=new Image();
   img.onerror=()=>reject(new Error("Não foi possível abrir a foto."));
   img.onload=()=>{
    const max=420, scale=Math.min(1,max/Math.max(img.width,img.height));
    const w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
    const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;
    const ctx=canvas.getContext("2d");ctx.drawImage(img,0,0,w,h);
    let quality=.78, out=canvas.toDataURL("image/jpeg",quality);
    while(out.length>260000&&quality>.48){quality-=.07;out=canvas.toDataURL("image/jpeg",quality)}
    resolve(out);
   };
   img.src=reader.result;
  };
  reader.readAsDataURL(file);
 });
}

function productSalesFor(productId){
 const products=data.products||[],sales=data.sales||[];
 const p=products.find(x=>x.id===productId); if(!p)return {p:null,items:[]};
 const items=[];
 sales.forEach(s=>(Array.isArray(s.items)?s.items:[]).forEach(i=>{
   const same=(i.productId&&i.productId===p.id)||(String(i.name||'').trim().toLowerCase()===String(p.name||'').trim().toLowerCase());
   const date=dt(s.createdAt);
   if(same&&date)items.push({sale:s,item:i,date});
 }));
 return {p,items};
}
function productStartDate(productId){
 const {p,items}=productSalesFor(productId); if(!p)return null;
 const productCreated=dt(p.createdAt);
 const firstSale=items.map(x=>x.date).sort((a,b)=>a-b)[0]||null;
 if(productCreated&&firstSale)return productCreated<firstSale?productCreated:firstSale;
 return productCreated||firstSale||null;
}

 const out=[];

function purchaseChartData(productId,monthKey){

async function deletePurchaseEntry(purchaseId){
 const entry=(data.purchases||[]).find(x=>String(x.id)===String(purchaseId));
 if(!entry)return toast('Entrada não encontrada. Atualize a tela e tente novamente.');
 const qty=Math.max(0,numBR(entry.quantity||0));
 const product=(data.products||[]).find(p=>String(p.id)===String(entry.productId));
 const message=`Excluir a entrada de ${entry.productName||'produto'}?\n\nQuantidade: ${qty} unidade(s)\nValor registrado: ${money(entry.total||0)}\n\nO sistema vai retirar essa quantidade do estoque. Essa ação não pode ser desfeita.`;
 if(!confirm(message))return;
 try{
  if(product&&qty>0){
   const productRef=doc(col('products'),product.id),purchaseRef=doc(col('purchases'),entry.id);
   await runTransaction(db,async tx=>{
    const [ps,es]=await Promise.all([tx.get(productRef),tx.get(purchaseRef)]);
    if(!es.exists())throw Error('Esta entrada já foi excluída. Atualize a tela.');
    if(!ps.exists())throw Error('O produto desta entrada não existe mais.');
    const current=Math.max(0,numBR(ps.data().stock||0));
    if(current<qty)throw Error(`Estoque atual (${current}) menor que a quantidade da entrada (${qty}). Não é possível excluir sem deixar o estoque negativo.`);
    tx.update(productRef,{stock:current-qty});
    tx.delete(purchaseRef);
   });
  }else{
   await deleteDoc(doc(col('purchases'),entry.id));
  }
  await logAction('Entrada de mercadoria excluída',`${entry.productName||'Produto'} • -${qty} un. do estoque • valor registrado ${money(entry.total||0)}`);
  toast('Entrada excluída e estoque ajustado.');
  render();
 }catch(e){console.error(e);toast(e.message||'Não foi possível excluir a entrada.');}
}

</head><body><h1>GRUPO BERNARDO ALIMENTOS</h1><div class="muted">RECIBO DE PAGAMENTO DE REMUNERAÇÃO · Documento gerencial</div><div class="box"><p>Declaro que <b>${esc(r.name)}</b> recebeu a remuneração referente ao período <b>${esc(r.period)}</b>.</p><div class="row"><span>Remuneração antes do desconto</span><b>${money(r.gross??r.amount)}</b></div>${Number(r.discount||0)>0?`<div class="row"><span>Desconto</span><b>${money(r.discount)}</b></div><div class="row"><span>Motivo do desconto</span><b>${esc(r.discountReason||'Não informado')}</b></div>`:''}<div class="row"><span>Valor líquido pago</span><span class="amount">${money(r.amount)}</span></div><div class="row"><span>Data do pagamento</span><b>${brDate(r.date)}</b></div><div class="row"><span>Forma de pagamento</span><b>${esc(r.method)}</b></div>${r.note?`<div class="row"><span>Observação</span><b>${esc(r.note)}</b></div>`:''}<p class="muted">Identificador interno: ${esc(r.receiptId)}</p></div><div class="sign"><div>${esc(r.name)}<br>Recebedor</div><div>${esc(r.paidBy||'Responsável')}<br>Responsável pelo pagamento</div></div><p class="muted">Documento gerencial emitido pelo sistema GRUPO BERNARDO.</p><button onclick="window.print()">Imprimir / Salvar em PDF</button><script>window.onload=()=>setTimeout(()=>window.print(),250)<\/script>


</body></html>`);win.document.close();
}

function openPayables(selectedMonth=null){
 const monthKey=(typeof selectedMonth==='string'&&/^\d{4}-\d{2}$/.test(selectedMonth))?selectedMonth:`${now().getFullYear()}-${String(now().getMonth()+1).padStart(2,'0')}`;
 const monthOf=x=>{const d=String(x.dueDate||'').slice(0,7);if(/^\d{4}-\d{2}$/.test(d))return d;const created=dt(x.createdAt||x.date);return created?`${created.getFullYear()}-${String(created.getMonth()+1).padStart(2,'0')}`:''};
 const rows=(data.payables||[]).filter(x=>monthOf(x)===monthKey).slice().sort((a,b)=>{const ap=a.status==='paid'?1:0,bp=b.status==='paid'?1:0;if(ap!==bp)return ap-bp;return String(a.dueDate||'9999-99-99').localeCompare(String(b.dueDate||'9999-99-99'));});
 const pending=rows.filter(x=>x.status!=='paid'),paid=rows.filter(x=>x.status==='paid');
 const totalPending=pending.reduce((a,x)=>a+numBR(x.amount||0),0),totalPaid=paid.reduce((a,x)=>a+numBR(x.amount||0),0);
 const fmtDate=v=>{if(!v)return 'Sem vencimento';const p=String(v).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:esc(v)};
 const [yy,mm]=monthKey.split('-').map(Number),monthLabel=new Date(yy,mm-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
 const list=rows.map(x=>{const overdue=x.status!=='paid'&&x.dueDate&&x.dueDate<new Date().toISOString().slice(0,10);return `<div class="payables-row"><div class="payables-main"><b>${esc(x.title||'Conta')}</b><small>${esc(x.category||'Outra despesa')} · Vencimento: ${fmtDate(x.dueDate)} · ${x.status==='paid'?'Pago':'Pendente'}</small>${x.note?`<small>${esc(x.note)}</small>`:''}${overdue?'<span class="badge" style="color:var(--red)">Vencida</span>':''}<div class="payables-actions">${x.status==='paid'?`<span class="badge" style="color:var(--green)">Pago em ${fmtDate(x.paidDate)}</span>`:`<button class="primary" type="button" data-payable-paid="${x.id}">Registrar pagamento</button>`}<button class="secondary" type="button" data-payable-delete="${x.id}">Excluir</button></div></div><div class="payables-amount ${x.status==='paid'?'finance-positive':'finance-negative'}">${money(x.amount||0)}</div></div>`}).join('')||`<div class="empty">Nenhuma conta em ${esc(monthLabel)}.</div>`;
 openModal('Contas a pagar',`<div class="payables-month-control"><div><small>CONSULTAR PERÍODO</small><b>${esc(monthLabel)}</b></div><input id="payablesMonth" type="month" aria-label="Selecionar mês e ano" value="${monthKey}"></div><div class="finance-grid"><div class="finance-card"><small>Pendente</small><strong class="finance-negative">${money(totalPending)}</strong><span>${pending.length} conta(s)</span></div><div class="finance-card"><small>Pago</small><strong class="finance-positive">${money(totalPaid)}</strong><span>${paid.length} conta(s)</span></div></div><button class="primary" id="payableNew" style="width:100%;margin:12px 0">＋ Registrar conta</button><div class="payables-panel">${list}</div>`);
 $('payablesMonth').onchange=()=>openPayables($('payablesMonth').value);
 $('payableNew').onclick=()=>{openModal('Registrar conta',`<div class="form"><div class="field"><label>Descrição</label><input id="payTitle" maxlength="100" placeholder="Ex.: Fornecedor, assinatura"></div><div class="field"><label>Favorecido / categoria</label><select id="payCategory"><option>Funcionário</option><option>Fornecedor</option><option>Frete</option><option>Embalagem</option><option>Impostos</option><option>Outra despesa</option></select></div><div class="field"><label>Valor (R$)</label><input id="payAmount" type="number" min="0.01" step="0.01" placeholder="0,00"></div><div class="field"><label>Vencimento</label><input id="payDue" type="date" value="${monthKey}-${String(Math.min(now().getDate(),new Date(yy,mm,0).getDate())).padStart(2,'0')}"></div><div class="field"><label>Observação (opcional)</label><input id="payNote" maxlength="200" placeholder="Detalhes"></div><div class="actions"><button class="secondary" id="payCancel">Cancelar</button><button class="primary" id="paySave">Salvar conta</button></div></div>`);$('payCancel').onclick=()=>openPayables(monthKey);
 $('paySave').onclick=async()=>{const title=$('payTitle').value.trim(),amount=Number($('payAmount').value),category=$('payCategory').value,dueDate=$('payDue').value,note=$('payNote').value.trim();if(!title)return toast('Informe a descrição.');if(!Number.isFinite(amount)||amount<=0)return toast('Informe um valor válido.');if(!dueDate)return toast('Informe o vencimento.');try{await addDoc(col('payables'),{title,category,amount:Math.round(amount*100)/100,dueDate,note,status:'pending',createdByUid:uid,createdByName:currentUserName,createdAt:serverTimestamp()});toast('Conta registrada.');openPayables(dueDate.slice(0,7))}catch(e){console.error(e);toast('Não foi possível salvar. Verifique as regras do Firebase.')}}};
 document.querySelectorAll('[data-payable-paid]').forEach(b=>b.onclick=async()=>{const x=(data.payables||[]).find(p=>p.id===b.dataset.payablePaid);if(!x||x.status==='paid')return;try{await updateDoc(doc(col('payables'),x.id),{status:'paid',paidDate:new Date().toISOString().slice(0,10),paidAt:serverTimestamp(),paidByUid:uid,paidByName:currentUserName});toast('Pagamento registrado.');openPayables(monthKey)}catch(e){console.error(e);toast('Não foi possível registrar o pagamento.')}});
 document.querySelectorAll('[data-payable-delete]').forEach(b=>b.onclick=async()=>{const x=(data.payables||[]).find(p=>p.id===b.dataset.payableDelete);if(!x)return;if(!confirm(`Excluir a conta "${x.title||'Conta'}"?`))return;try{await deleteDoc(doc(col('payables'),x.id));toast('Conta excluída.');openPayables(monthKey)}catch(e){console.error(e);toast('Não foi possível excluir a conta.')}});
}

 const [financeYear,financeMonth]=financeMonthKey.split("-").map(Number);
 const nowD=new Date(financeYear,financeMonth-1,1);

 const monthSales=monthSalesFor(nowD), monthPayments=monthPaymentsFor(nowD);

 const cash=allReceived-allPurchases-paidPayables;

function debounceTask(fn,delay=140){let timer;return (...args)=>{clearTimeout(timer);timer=setTimeout(()=>fn(...args),delay)}}
function normalizeSearchText(value){
 return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('pt-BR').trim();
}
function clientPublicCode(c){const v=String(c.publicCode||c.clientCode||'').replace(/\D/g,'');return v? v.padStart(6,'0').slice(-6):'------'}
function isClientActive(c){return c?.active!==false && String(c?.clientState||'active')!=='inactive'}
async function reserveClientPublicCode(){
 const used=new Set((data.clients||[]).map(c=>clientPublicCode(c)).filter(x=>/^\d{6}$/.test(x)));
 for(let i=0;i<100;i++){const code=String(Math.floor(Math.random()*1000000)).padStart(6,'0');if(used.has(code))continue;const ref=doc(col('clientCodeReservations'),code);let reserved=false;await runTransaction(db,async tx=>{reserved=false;const snap=await tx.get(ref);if(snap.exists())return;tx.set(ref,{code,createdAt:serverTimestamp()});reserved=true;});if(reserved)return code;}
 throw new Error('Não foi possível reservar um código único. Tente novamente.');
}
function findClientMatches(term,list){
 const q=normalizeSearchText(term).trim(); if(q.length<2)return [];
 const tokens=q.split(/\s+/).filter(Boolean),digits=q.replace(/\D/g,'');
 return (list||[]).filter(isClientActive).map(c=>({c,n:normalizeSearchText(c.name),code:clientPublicCode(c),phone:String(c.phone||'').replace(/\D/g,'')}))
 .map(x=>({...x,score:x.code===digits&&digits?100:x.n===q?95:x.n.startsWith(q)?85:tokens.every(t=>x.n.includes(t))?70:x.n.includes(q)?60:x.phone.includes(digits)&&digits.length>=3?50:0}))
 .filter(x=>x.score>0)
 .sort((a,b)=>b.score-a.score||a.n.localeCompare(b.n,'pt-BR'))
 .slice(0,8).map(x=>x.c);
}

function clientClosedSaleIds(c){return new Set((data.debtClosures||[]).filter(x=>x.clientId===c.id).flatMap(x=>[...(x.saleIds||[]),...(x.saleSnapshot||[]).map(s=>s.saleId).filter(Boolean)]));}
function closureRemaining(x){return Math.max(0,Math.round((Number(x.remainingAtClose??x.snapshotTotal??0))*100)/100)}
function clientClosedDebt(c){return (data.debtClosures||[]).filter(x=>x.clientId===c.id).reduce((a,x)=>a+closureRemaining(x),0)}

  if(sale.clientId){if(!clientSalesIndex.has(sale.clientId))clientSalesIndex.set(sale.clientId,[]);clientSalesIndex.get(sale.clientId).push(sale);}

 }

function monthKeyFromDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`}

function clientDebtStatus(c){

 if(pending<=0.009)return {label:"Em dia",className:"is-on-time",note:"Sem saldo pendente."};
 const today=now();today.setHours(0,0,0,0);
 const closures=(data.debtClosures||[]).filter(x=>x.clientId===c.id&&closureRemaining(x)>0);
 const closedIds=clientClosedSaleIds(c);
 const openSales=clientSalesFor(c).filter(s=>salePendingAmount(s)>0.009&&!closedIds.has(s.id));
 const dates=[];
 // Saldos fechados: vencem no 5º dia útil do mês seguinte ao fechamento.
 closures.forEach(x=>dates.push({date:closureDueDate(x),partial:closureRemaining(x)<Number(x.snapshotTotal||0)-0.009}));
 // Compras ainda em aberto: vencem no 5º dia útil do mês depois do próximo.
 openSales.forEach(s=>{const d=dt(s.createdAt);if(d)dates.push({date:fifthBusinessDayTwoMonthsAfter(monthKeyFromDate(d)),partial:numBR(s.paid||s.paidAmount||0)>0.009});});
 // Dívida inicial/manual também precisa de vencimento e não pode ficar sempre "Em dia".
 const initialPending=Math.max(0,Number(c.initialDebt||0)-Number(c.initialDebtPaid||0));
 if(initialPending>0.009){
   const created=dt(c.createdAt);
   const key=created?monthKeyFromDate(created):monthKeyFromDate(today);
   dates.push({date:fifthBusinessDayTwoMonthsAfter(key),partial:Number(c.initialDebtPaid||0)>0.009});
 }
 const overdue=dates.some(x=>x.date&&today>new Date(x.date+'T00:00:00'));
 const partial=dates.some(x=>x.partial);
 if(overdue)return {label:"Atraso",className:"is-overdue",note:"Pagamento vencido. Verifique a data de vencimento."};
 if(partial)return {label:"Parcialmente",className:"is-partial",note:"Há pagamento parcial; confira o saldo restante."};
 const next=dates.map(x=>x.date).filter(Boolean).sort()[0];
 return {label:"Em dia",className:"is-on-time",note:next?`Vencimento: ${formatDueDate(next)} (5º dia útil).`:"Vencimento: 5º dia útil do mês aplicável."};
}

let nfcOcrWorker=null;

async function getNfcOcrWorker(setProgress){
 if(nfcOcrWorker)return nfcOcrWorker;
 if(!window.Tesseract?.createWorker)throw Error('Leitor OCR não carregou. Verifique sua conexão e tente novamente.');
 nfcOcrWorker=await Tesseract.createWorker('por',1,{logger:m=>{
   if(m.status&&setProgress){
     const pct=Number.isFinite(m.progress)?Math.round(m.progress*100):0;
     setProgress(Math.min(99,pct));
   }
 }});
 await nfcOcrWorker.setParameters({preserve_interword_spaces:'1',user_defined_dpi:'300'});
 return nfcOcrWorker;
}
function nfcQualityScore(parsed,confidence){

function nfcQualityGood(parsed,confidence){
 const items=(parsed.items||[]).length;

}
async function nfcRecognize(worker,image,psm,setProgress,baseProgress,span){
 await worker.setParameters({tessedit_pageseg_mode:String(psm),preserve_interword_spaces:'1',user_defined_dpi:'300'});

 const text=r.data.text||'';

 if(setProgress)setProgress(Math.min(99,Math.round(baseProgress+span)));

}
async function nfcRunOcr(file,setProgress){
 if(nfcOcrBusy)throw Error('O leitor OCR já está processando uma foto. Aguarde a leitura terminar.');
 nfcOcrBusy=true;
 const results=[];
 try{
   const worker=await getNfcOcrWorker(p=>setProgress?.(Math.min(18,p*.18)));
   // Fast path: the original image is usually enough. We only pay for extra image
   // processing/OCR when the first pass is not convincing.
   const first=await nfcRecognize(worker,file,6,setProgress,18,30);
   results.push(first);
   if(nfcQualityGood(first.parsed,first.confidence)){
     setProgress?.(100);
     return {text:first.text,parsed:first.parsed,passes:1,fastPath:true};
   }

   // Second pass: crop the paper margins and upscale. This is the most useful
   // correction for phone photos and costs much less than four extra OCR passes.
   setProgress?.(50);
   const crop=await nfcCanvasVariant(file,'crop');
   const second=await nfcRecognize(worker,crop,6,setProgress,50,25);
   results.push(second);

   // Third pass only when necessary. Contrast is cheaper and tends to recover
   // faint thermal-printer text without the expensive threshold/sharp passes.
   const bestSoFar=results.slice().sort((a,b)=>b.score-a.score)[0];
   if(!nfcQualityGood(bestSoFar.parsed,bestSoFar.confidence)){
     setProgress?.(76);
     const contrast=await nfcCanvasVariant(file,'contrast');
     const third=await nfcRecognize(worker,contrast,11,setProgress,76,22);
     results.push(third);
   }

   const consensus=(field)=>{
     const vals=results.map(r=>Number(r.parsed[field]||0)).filter(v=>v>0);
     if(!vals.length)return 0;
     const counts=new Map();
     for(const v of vals){const k=v.toFixed(2);counts.set(k,(counts.get(k)||0)+1)}
     const top=[...counts.entries()].sort((a,b)=>b[1]-a[1])[0];
     return top?Number(top[0]):0;
   };
   const merged={...best.parsed,
     discount:consensus('discount')||best.parsed.discount,
     subtotal:consensus('subtotal')||best.parsed.subtotal,
     total:consensus('total')||best.parsed.total,
     totalPaid:consensus('totalPaid')||best.parsed.totalPaid
   };
   merged.items=mergeNfcItems(results,data.products||[]);
   merged.itemSubtotal=Math.round(merged.items.reduce((a,x)=>a+numBR(x.grossTotal||x.total),0)*100)/100;
   merged.itemNetTotal=Math.round(merged.items.reduce((a,x)=>a+numBR(x.total),0)*100)/100;
   merged.itemDiscount=Math.round(merged.items.reduce((a,x)=>a+numBR(x.lineDiscount||0),0)*100)/100;
   if(!merged.subtotal&&merged.itemSubtotal>0)merged.subtotal=merged.itemSubtotal;
   if(!merged.total&&merged.totalPaid>0)merged.total=merged.totalPaid;
   if(merged.subtotal>0&&merged.total>0&&merged.subtotal-merged.total>=.01&&merged.discount<=0)merged.discount=Math.round((merged.subtotal-merged.total)*100)/100;
   merged.unallocatedDiscount=Math.max(0,Math.round((numBR(merged.discount)-merged.itemDiscount)*100)/100);
   setProgress?.(100);
   return {text:best.text,parsed:merged,passes:results.length,fastPath:false};
 }finally{
   nfcOcrBusy=false;
 }
}

function availableAnalysisMonths(){

 return [...months.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([key,d])=>({key,label:d.toLocaleDateString("pt-BR",{month:"long",year:"numeric"})}));

function bindChartTooltip(){

  tip=document.createElement("div");
  tip.id="chartTooltip";
  tip.className="chart-tooltip";
  document.body.appendChild(tip);
 }
 const hide=()=>tip.classList.remove("show");
 const show=(dot,x,y)=>{
  const label=dot.getAttribute("data-chart-label")||"";
  const value=dot.getAttribute("data-chart-value")||"R$ 0,00";
  tip.textContent=`${label}: ${value}`;
  tip.style.left=`${Math.max(60,Math.min(window.innerWidth-60,x))}px`;

 };

function analysisHtml(kind,periods,selectedMonthKey){
 const sales=data.sales||[], nowD=now(), points=[];
 const sumBetween=(start,end)=>sales.filter(v=>{const x=dt(v.createdAt);return x&&x>=start&&x<end}).reduce((a,v)=>a+numBR(v.total||0),0);
 if(kind==="hour")for(let h=0;h<24;h++){let start=new Date(nowD);start.setHours(h,0,0,0);let end=new Date(start);end.setHours(h+1,0,0,0);points.push({label:String(h).padStart(2,"0")+"h",value:sumBetween(start,end)})}
 if(kind==="day")for(let i=6;i>=0;i--){let start=new Date(nowD);start.setHours(0,0,0,0);start.setDate(start.getDate()-i);let end=new Date(start);end.setDate(end.getDate()+1);points.push({label:start.toLocaleDateString("pt-BR",{weekday:"short"}).replace(".",""),value:sumBetween(start,end)})}
 if(kind==="week"){let base=new Date(nowD);base.setHours(0,0,0,0);base.setDate(base.getDate()-((base.getDay()+6)%7));for(let i=7;i>=0;i--){let start=new Date(base);start.setDate(start.getDate()-i*7);let end=new Date(start);end.setDate(end.getDate()+7);points.push({label:start.getDate()+"/"+(start.getMonth()+1),value:sumBetween(start,end)})}}
 let monthLabel="";
 if(kind==="month"){
  const md=monthKeyDate(selectedMonthKey),days=new Date(md.getFullYear(),md.getMonth()+1,0).getDate();monthLabel=md.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
  for(let d=1;d<=days;d++){let start=new Date(md.getFullYear(),md.getMonth(),d);start.setHours(0,0,0,0);let end=new Date(start);end.setDate(end.getDate()+1);points.push({label:String(d),value:sumBetween(start,end)})}
 }
 const total=points.reduce((a,p)=>a+p.value,0),max=Math.max(...points.map(p=>p.value),1),w=Math.max(620,points.length*20),h=220,pad=24,den=Math.max(points.length-1,1);
 const coords=points.map((p,i)=>({x:pad+i*(w-2*pad)/den,y:h-pad-(p.value/max)*(h-2*pad)}));
 const pts=coords.map(p=>`${p.x},${p.y}`).join(" "),step=Math.max(1,Math.ceil(points.length/10));
 const labels=points.map((p,i)=>i%step===0?`<text x="${coords[i].x}" y="${h-3}" text-anchor="middle">${esc(p.label)}</text>`:"").join("");
 const dots=coords.map((p,i)=>`<circle class="dot chart-hit" cx="${p.x}" cy="${p.y}" r="5" data-chart-label="${esc(points[i].label)}" data-chart-value="${money(points[i].value)}"></circle>`).join("");
 const monthSelect=kind==="month"?`<div class="analysis-month-row"><label>Escolha o mês para analisar</label><select id="analysisMonthSelect" class="month-select">${availableAnalysisMonths().map(o=>`<option value="${o.key}" ${o.key===selectedMonthKey?"selected":""}>${esc(o.label)}</option>`).join("")}</select></div>`:"";
 const sub=kind==="month"?monthLabel:periods[kind];
 return `${monthSelect}<div class="analysis-card"><div class="analysis-head"><div><small style="color:var(--muted)">${esc(sub)}</small><div style="margin-top:3px">Total vendido</div></div><strong class="private-number money-large">${money(total)}</strong></div><div class="chart"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline class="line" points="${pts}"/>${dots}${labels}</svg></div></div>${kind==="month"?`<div class="analysis-card"><div class="section-title"><span>Vendas no mês</span><b class="private-number money-small">${money(total)}</b></div><small style="color:var(--muted)">${points.length} dias exibidos, incluindo dias sem venda.</small></div>`:""}`;
}

function openEditSale(s){

 openModal("Editar venda",`<div class="form">
  <div class="field"><label>Cliente</label><select id="esClient"><option value="">Venda balcão</option>${clients.map(c=>`<option value="${c.id}" ${c.id===s.clientId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>

  <div class="row"><div class="field"><label>Quantidade</label><input id="esQty" type="number" min="1" value="${Number(old.qty||1)}"></div><div class="field"><label>Valor</label><input id="esTotal" type="number" min="0" step="0.01" value="${numBR(s.total||0).toFixed(2)}"></div></div>
  <div class="field"><label>Valor pago</label><input id="esPaid" type="number" min="0" step="0.01" value="${Number(s.paid||0).toFixed(2)}"></div>
  <div class="actions"><button class="secondary" id="esCancel">Cancelar</button><button class="primary" id="esSave">Salvar alterações</button></div>
 </div>`);
 $("esCancel").onclick=closeModal;
 $("esSave").onclick=async()=>{
  const btn=$("esSave");if(btn.dataset.busy)return;btn.dataset.busy="1";
  try{
   const np=products.find(p=>p.id===$("esProduct").value),nq=Math.max(1,Number($("esQty").value)||1),nt=Math.max(0,Number($("esTotal").value)||0),paid=Math.min(nt,Math.max(0,Number($("esPaid").value)||0)),nc=clients.find(c=>c.id===$("esClient").value),oi=s.items?.[0]||{},op=products.find(p=>p.id===oi.productId),oq=Number(oi.qty||0);
   if(!np||!nt)throw Error("Produto e valor são obrigatórios.");
   const ops=[];
   const originalTotal=Number(np.price||0)*nq,discountAmount=Math.max(0,originalTotal-nt),discountPct=originalTotal?discountAmount/originalTotal*100:0;
   await runTransaction(db,async tx=>{const oldRef=op?doc(col("products"),op.id):null,newRef=doc(col("products"),np.id),saleRef=doc(col("sales"),s.id);const refs=oldRef&&op.id===np.id?[oldRef]:oldRef?[oldRef,newRef]:[newRef];const snaps=[];for(const ref of refs)snaps.push(await tx.get(ref));const oldSnap=oldRef?snaps[0]:null,newSnap=oldRef?(op.id===np.id?snaps[0]:snaps[1]):snaps[0];if(!newSnap.exists())throw Error("Produto não encontrado.");if(oldRef&&op.id===np.id){const available=numBR(newSnap.data().stock||0)+oq;if(nq>available)throw Error("Estoque insuficiente.");tx.update(newRef,{stock:available-nq});}else{if(nq>numBR(newSnap.data().stock||0))throw Error("Estoque insuficiente.");if(oldRef&&oldSnap?.exists())tx.update(oldRef,{stock:numBR(oldSnap.data().stock||0)+oq});tx.update(newRef,{stock:numBR(newSnap.data().stock||0)-nq});}tx.update(saleRef,{clientId:nc?.id||"",clientName:nc?.name||"Venda balcão",items:[{productId:np.id,name:np.name,qty:nq,price:nt/nq,originalPrice:np.price,cost:numBR(newSnap.data().cost||0)}],originalTotal,total:nt,discountAmount,discountPct,paid,updatedAt:serverTimestamp()});});
   const ps=await getDocs(col("payments"));ps.docs.filter(d=>d.data()?.saleId===s.id).forEach(d=>ops.push(deleteDoc(doc(col("payments"),d.id))));
   if(paid>0)ops.push(addDoc(col("payments"),{saleId:s.id,clientId:nc?.id||"",clientName:nc?.name||"Venda balcão",amount:paid,createdAt:serverTimestamp(),method:s.paymentMethod||"Pagamento"}));
   await Promise.all(ops);closeModal();render();toast("Venda alterada com sucesso!");
  }catch(e){console.error(e);toast(e.message||"Não foi possível alterar a venda.")}finally{btn.dataset.busy=""}
 };

function confirmDeleteSale(s){

 $("delDo").onclick=async()=>{
  const btn=$("delDo");if(btn.dataset.busy)return;btn.dataset.busy="1";
  try{await runTransaction(db,async tx=>{const saleRef=doc(col("sales"),s.id),saleSnap=await tx.get(saleRef);if(!saleSnap.exists())throw Error("Venda não encontrada.");const sale=saleSnap.data(),byProduct=new Map();for(const i of(sale.items||[])){const qty=numBR(i.qty||0),pid=i.productId;if(qty>0&&pid)byProduct.set(pid,(byProduct.get(pid)||0)+qty);}const productReads=[];for(const [pid,qty] of byProduct){const ref=doc(col("products"),pid);productReads.push({pid,qty,ref});}const productSnaps=[];for(const item of productReads)productSnaps.push({item,snap:await tx.get(item.ref)});for(const {item,snap} of productSnaps){if(snap.exists())tx.update(item.ref,{stock:numBR(snap.data().stock||0)+item.qty});}tx.delete(saleRef);});const ps=await getDocs(col("payments"));await Promise.all(ps.docs.filter(d=>d.data()?.saleId===s.id).map(d=>deleteDoc(d.ref)));await logAction("Venda excluída",`${s.clientName||"Venda balcão"} • ${money(s.total)}`);closeModal();render();toast("Venda excluída com sucesso!");}catch(e){console.error(e);toast(e.message||"Não foi possível excluir a venda.")}finally{btn.dataset.busy=""}
 };
}

function applyTheme(theme){
  const dark = true; /* Grupo Bernardo: tema único preto e amarelo */
  document.body.classList.toggle("theme-dark", dark);
  document.documentElement.classList.toggle("theme-dark", dark);
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", "#000000");
  const btn=document.getElementById("themeToggle");
  if(btn) btn.textContent = dark ? "☀️  Modo claro" : "🌙  Modo escuro";
}

  const next=document.body.classList.contains("theme-dark") ? "light" : "dark";

}

  data.logs=rows;
 }catch(e){
  console.error(e);
  toast("Não foi possível carregar o log. Verifique as permissões do Firebase.");
 }
 rows=rows.slice().sort((a,b)=>(dt(b.createdAt)||0)-(dt(a.createdAt)||0));
 const types=[...new Set(rows.map(x=>x.action).filter(Boolean))];
 openModal("Log de atividades",`<div class="form">
  <div class="row"><div class="field"><label>Usuário</label><select id="logUser"><option value="all">Todos</option>${[...new Set(rows.map(x=>x.createdByName||"Desconhecido"))].map(n=>`<option>${esc(n)}</option>`).join("")}</select></div><div class="field"><label>Ação</label><select id="logAction"><option value="all">Todas</option>${types.map(n=>`<option>${esc(n)}</option>`).join("")}</select></div></div>
  <div id="logList" class="list" style="max-height:55vh;overflow:auto"></div>
 </div>`);
 const draw=()=>{const u=$("logUser").value,a=$("logAction").value;const filtered=rows.filter(x=>(u==="all"||x.createdByName===u)&&(a==="all"||x.action===a));$("logList").innerHTML=filtered.map(x=>`<div class="item"><div class="avatar">${x.action==="Nova venda"?"🛒":x.action.includes("Estoque")?"📦":x.action==="Pagamento"?"💰":x.action.includes("Cliente")?"👤":"📋"}</div><div class="item-main"><b>${esc(x.action||"Atividade")}</b><small>${dateTime(x.createdAt)} • ${esc(x.createdByName||"Usuário")}</small><small>${esc(x.details||"")}</small></div></div>`).join("")||'<div class="empty">Nenhuma atividade encontrada.</div>'};
 $("logUser").onchange=draw;$("logAction").onchange=draw;draw();
}
function openReceivables(){
 const rows=data.clients.map(c=>{let pending=clientPending(c);return {...c,pending}}).filter(c=>c.pending>0).sort((a,b)=>b.pending-a.pending);
 openModal("A receber",`<div class="list">${rows.map(c=>`<div class="item" data-pay-client="${c.id}"><div class="avatar"><svg class="professional-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M7 6V4h10v2M12 9v7m3-5c0-1-1-2-3-2s-3 1-3 2 1 2 3 2 3 1 3 2-1 2-3 2-3-1-3-2"/></svg></div><div class="item-main"><b>${esc(c.name)}</b><small>Valores pendentes</small></div><div class="item-right"><b class="pending">${money(c.pending)}</b></div></div>`).join("")||'<div class="empty">Ninguém com valor pendente. 🎉</div>'}</div>`);
 document.querySelectorAll("[data-pay-client]").forEach(x=>x.onclick=()=>{let c=data.clients.find(c=>c.id===x.dataset.payClient);closeModal();openPaymentForClient(c)})
}
