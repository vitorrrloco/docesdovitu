.section{margin-top:15px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:0 2px 9px}.section-title b{font-size:17px}.link{background:none;color:var(--brown);font-size:12px;font-weight:800}
.list{display:grid;gap:9px}.item{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;align-items:center;gap:10px}.avatar{width:43px;height:43px;flex:0 0 43px;border-radius:14px;background:var(--cream2);display:grid;place-items:center;font-size:19px}.item-main{min-width:0;flex:1}.item-main b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-main small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.item-right{text-align:right}.item-right b{display:block;font-size:13px}.status{font-size:9px;font-weight:800;margin-top:4px}.stock-actions{display:flex;gap:5px;margin-top:7px;justify-content:flex-end;flex-wrap:wrap}.stock-card{align-items:flex-start}.stock-card .item-main{min-width:0}.stock-card .item-right{min-width:0;max-width:100%}.client-result + .client-result{border-top:2px solid var(--line);border-radius:0}.client-result:first-child{border-radius:11px 11px 0 0}.client-result:last-child{border-radius:0 0 11px 11px}.stock-head-actions{display:flex;align-items:center;gap:7px}.stock-head-actions .top-action{flex:0 0 46px}.stock-avulsa-head{height:46px;border-radius:15px;background:var(--cream2);color:var(--dark);font-size:13px;font-weight:900;padding:0 13px;border:1px solid var(--line);white-space:nowrap}@media(max-width:560px){.stock-card{display:grid;grid-template-columns:43px minmax(0,1fr);align-items:start}.stock-card .item-right{grid-column:1/-1;text-align:left;display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding-left:53px;margin-top:2px}.stock-card .item-right>b,.stock-card .item-right>small{display:inline-block}.stock-card .stock-actions{width:100%;justify-content:flex-start}.stock-card .stock-actions button{font-size:10px!important;padding:8px 9px!important}.stock-head-actions{gap:5px}.stock-avulsa-head{padding:0 10px;font-size:11px}.head{gap:8px}.head>div{min-width:0}.head h1{white-space:nowrap}.brand b{white-space:nowrap}.brand{min-width:0}.brand> /* ===== V1.1.0 RESPONSIVE UI ===== */
@media (min-width: 900px){
  body{background:#f3e3d1}
  .app{display:grid;grid-template-columns:250px minmax(0,1fr);grid-template-rows:78px minmax(0,1fr);height:100dvh}
  .top{grid-column:2;grid-row:1;height:auto;padding:10px 28px}
  .view{grid-column:2;grid-row:2;padding:26px 32px 34px;overflow:auto}
  .page{max-width:1240px}
  .nav{grid-column:1;grid-row:1 / span 2;width:auto;height:auto;margin:0;border:0;border-right:1px solid var(--line);border-radius:0;padding:22px 12px;display:flex;flex-direction:column;gap:8px;background:var(--white)}
  .nav:before{content:"🍫  DOCES DO VITU";font-size:16px;font-weight:900;color:var(--dark);padding:8px 12px 22px}
  .nav button{width:100%;min-height:56px;flex:none;display:flex;flex-direction:row;justify-content:flex-start;gap:12px;padding:0 15px;border-radius:15px}
  .nav .ni{font-size:23px;width:27px;text-align:center}.nav small{font-size:13px}
  .nav .active{background:var(--cream2);color:var(--dark)}
  .hero{padding:25px 28px}.hero h2{font-size:34px}
  .stats{grid-template-columns:repeat(4,1fr);gap:14px}.stat{min-height:120px;padding:18px}.stat strong{font-size:25px}
  .quick{grid-template-columns:repeat(4,1fr);gap:12px}.quick button{min-height:86px}
  .more{grid-template-columns:repeat(4,1fr)}
  .table-wrap{max-height:calc(100dvh - 225px)}
  .modal-bg{align-items:center;padding:20px}.modal{width:min(680px,100%);margin:auto;border-radius:25px;max-height:88dvh}
  .head h1{font-size:31px}
}
@media (min-width:1200px){
  .view{padding-left:42px;padding-right:42px}
  .page{max-width:1320px}
}
@media (max-width:899px){
  .nav{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
  .nav:before{display:none}
}

/* V1.5.3 FINAL - Financeiro compacto e centralizado no celular */
.finance-duo{width:100%;max-width:100%;margin-left:auto;margin-right:auto;align-items:stretch}
.finance-duo .analysis-card{min-width:0;padding:13px}
.finance-duo .section-title b{font-size:15px}
.finance-duo .item{padding:10px;border-radius:15px;gap:8px}
.finance-duo .avatar{width:38px;height:38px;flex-basis:38px;border-radius:12px;font-size:17px}
.finance-duo .item-main b{font-size:13px}
.finance-duo .item-main small{font-size:9px}
@media(max-width:899px){
  .finance-duo{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;width:calc(100% - 8px);margin-left:auto;margin-right:auto}
  .finance-duo .analysis-card{padding:12px;border-radius:18px}
}

.finance-duo{justify-content:center}
.finance-duo .top-sellers-list{max-height:126px;overflow-y:auto;overflow-x:hidden;padding-right:2px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.finance-duo .top-sellers-list .item{width:100%}
@media(max-width:699px){
  .finance-duo{width:100%;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;justify-items:center}
  .finance-duo .analysis-card{width:min(100%,430px);min-width:0;box-sizing:border-box}
  .finance-duo .top-sellers-list{width:100%;max-height:116px;overflow-y:auto;overflow-x:hidden;padding:0 2px;box-sizing:border-box;-webkit-overflow-scrolling:touch;scroll-snap-type:y proximity}

.boot-loader{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--cream);padding:24px;opacity:1;transition:opacity .18s ease,visibility .18s ease}.boot-loader.done{opacity:0;visibility:hidden;pointer-events:none}.boot-card{width:min(330px,88vw);text-align:center;padding:26px 22px;border-radius:22px;background:var(--white);box-shadow:0 14px 45px rgba(74,40,25,.14);display:flex;flex-direction:column;align-items:center;gap:8px}.boot-logo{font-size:42px;line-height:1}.boot-card b{font-size:19px;color:var(--dark)}.boot-card small{color:var(--muted);margin-bottom:8px}.boot-track{width:100%;height:7px;border-radius:99px;background:var(--cream2);overflow:hidden}.boot-bar{height:100%;width:0%;border-radius:99px;background:var(--brown);transition:width .12s ease}.boot-card strong{font-size:13px;color:var(--brown);min-height:18px}

/* V1.5.3 - somente ajustes visuais de Sugestão de Compras e Financeiro */

.purchase-product-select{width:100%;min-height:50px;border:1px solid var(--line);border-radius:14px;background:var(--cream);color:var(--text);padding:0 13px;font:inherit;font-weight:800;outline:none}
.purchase-detail{background:var(--white);border:1px solid var(--line);border-radius:21px;padding:17px;box-shadow:var(--shadow);margin-bottom:14px}
.purchase-detail-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}

.purchase-detail-head small{color:var(--muted);font-size:10px}

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import {getFirestore,collection,doc,addDoc,setDoc,updateDoc,deleteDoc,onSnapshot,serverTimestamp,query,orderBy,getDocs,getDoc,runTransaction} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyAfH-93y7s1YK_3je_sZlofd8XJ1z436Yk",
 authDomain:"doces-do-vitu.firebaseapp.com",
 projectId:"doces-do-vitu",
 storageBucket:"doces-do-vitu.firebasestorage.app",
 messagingSenderId:"681586131940",
 appId:"1:681586131940:web:e8c213d9865621467e7df1",
 measurementId:"G-9QDNX23V8Z"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
let uid=null,currentUserName="Vitor",currentUserEmail="",unsubs=[],data={products:[],clients:[],sales:[],payments:[],purchases:[],logs:[]},page="home";

const numBR=v=>{if(typeof v==="number")return Number.isFinite(v)?v:0;if(v==null||v==="")return 0;let s=String(v).trim().replace(/R\$|\s/g,"");if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");const n=Number(s);return Number.isFinite(n)?n:0;};const money=n=>numBR(n).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const dt=v=>{let d=v?.toDate?v.toDate():new Date(v);return isNaN(d)?null:d};
const dateTime=v=>{let d=dt(v);return d?d.toLocaleDateString("pt-BR")+" • "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}):"-"};
const dateOnly=v=>{let d=dt(v);return d?d.toLocaleDateString("pt-BR"):"-"};
const now=()=>new Date();
const status=(total,paid)=>paid>=total?"Pago":paid>0?"Parcial":"Pendente";
const statusClass=s=>s==="Pago"?"paid":s==="Parcial"?"partial":"pending";
const toast=m=>{$("toastRoot").innerHTML='<div class="toast">'+esc(m)+'</div>';setTimeout(()=>$("toastRoot").innerHTML="",2400)};
const msg=(m,ok=false)=>{$("loginMsg").textContent=m;$("loginMsg").style.color=ok?"#2d805b":"#b5483f"};

$("loginBtn").onclick=async()=>{try{msg("Entrando...",true);await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value)}catch(e){msg(firebaseError(e))}};
$("createBtn").onclick=async()=>{try{msg("Criando conta...",true);await createUserWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);msg("Conta criada!",true)}catch(e){msg(firebaseError(e))}};
$("password").addEventListener("keydown",e=>{if(e.key==="Enter")$("loginBtn").click()});
function firebaseError(e){return ({ "auth/invalid-credential":"E-mail ou senha incorretos.","auth/invalid-email":"Digite um e-mail válido.","auth/email-already-in-use":"Esse e-mail já possui uma conta.","auth/weak-password":"A senha precisa ter pelo menos 6 caracteres."}[e.code]||"Não foi possível entrar. Verifique sua conexão e os dados.")}

let bootProgress=0;
function bootSet(p){bootProgress=Math.max(0,Math.min(100,p));if($("bootBar")){$("bootBar").style.width=bootProgress+"%";$("bootPct").textContent=Math.round(bootProgress)+"%"}}
function bootFinish(){bootSet(100);requestAnimationFrame(()=>setTimeout(()=>{$("bootLoader")?.classList.add("done")},80))}

onAuthStateChanged(auth,async user=>{
 unsubs.forEach(u=>u());unsubs=[];bootSet(0);
 if(!user){uid=null;$('app').classList.add('hidden');$('login').classList.remove('hidden');$('bootLoader').classList.add('done');return}
 uid=user.uid;currentUserEmail=(user.email||'').toLowerCase();currentUserName=currentUserEmail==='xlocox000@gmail.com'?'Eduardo':currentUserEmail==='viitorcontas@gmail.com'?'Vitor':'Vitor';$('currentUser').textContent='👤 '+currentUserName;$('login').classList.add('hidden');
 try{bootSet(15);await migrateOwnDataToShared();bootSet(25);await seedImportedDebts();bootSet(30);await subscribeReady();bootSet(95);go('home');logAction('Login','Entrou no sistema');bootFinish();$('app').classList.remove('hidden')}catch(e){console.error(e);toast('Não foi possível carregar os dados.');bootFinish();$('app').classList.remove('hidden')}});

function col(name){return collection(db,"businesses","docesDoVitu",name)}
function oldCol(name){return collection(db,"users",uid,name)}
async function migrateOwnDataToShared(){
 const marker=`docesDoVituSharedMigration_${uid}`;
 if(localStorage.getItem(marker)==="done") return;
 const names=["products","clients","sales","payments","purchases","logs"];
 for(const name of names){
  const shared=await getDocs(col(name));
  if(!shared.empty) continue;
  const old=await getDocs(oldCol(name));
  if(old.empty) continue;
  await Promise.all(old.docs.map(d=>setDoc(doc(col(name),d.id),d.data())));
 }
 localStorage.setItem(marker,"done");
}
async function logAction(action,details=""){
 try{await addDoc(col("logs"),{action,details,createdByUid:uid,createdByName:currentUserName,createdAt:serverTimestamp()});}
 catch(e){console.warn("Log não salvo",e)}
}
async function seedImportedDebts(){
 const markerRef=doc(col("meta"),"initialDebtsV1");
 try{const marker=await getDoc(markerRef);if(marker.exists())return;
  const debts={"Gilberto":47,"Gabriel":15,"Rafael":32,"Jacare":16,"Guedes":13,"Duarte":24,"Eduardo":57,"Steuck":1,"Richard":67,"Roger":22,"Daniel Ponick":22,"Gabriel Ponick":2,"Crystian":34,"Vitor":15,"Maria Eduarda":8,"Murilo":5,"Diovana":2,"Julio":6,"Marinho":20,"Kricinski":38,"Mohammed":5,"Samuel":20,"Emanuel":14,"Jonathan":4,"Eduardo Silveira":17};
  const existing=await getDocs(col("clients"));
  const byName=new Map(existing.docs.map(d=>[String(d.data().name||"").trim().toLowerCase(),d]));
  for(const [name,value] of Object.entries(debts)){const found=byName.get(name.toLowerCase());if(found){const old=found.data();if(Number(old.initialDebt||0)===0)await updateDoc(found.ref,{initialDebt:value,initialDebtPaid:0});}else{await addDoc(col("clients"),{name,phone:"",initialDebt:value,initialDebtPaid:0,createdAt:serverTimestamp()});}}
  await setDoc(markerRef,{done:true,total:502,createdAt:serverTimestamp()});
 }catch(e){console.warn("Importação inicial de clientes pendentes não concluída",e)}
}
function subscribeReady(){
 return new Promise(resolve=>{
  const names=['products','clients','sales','payments','purchases']; let ready=0;
  const seen=new Set();
  names.forEach(name=>{
   const u=onSnapshot(col(name),snap=>{data[name]=snap.docs.map(d=>({id:d.id,...d.data()}));render();
    if(!seen.has(name)){seen.add(name);ready++;bootSet(30+ready*13);if(ready===names.length)resolve();}
   },()=>{if(!seen.has(name)){seen.add(name);ready++;if(ready===names.length)resolve();}toast('Não foi possível sincronizar '+name+'.')});
   unsubs.push(u);
  });
 });
}
function subscribe(){return subscribeReady()}

function go(p){
 page=p;
 document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));
 const view=$("view");
 view.classList.remove("page-swap");
 render();
 requestAnimationFrame(()=>{view.classList.add("page-swap");view.scrollTo({top:0,behavior:"auto"});});
}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>go(b.dataset.page));
$("quickSale").onclick=()=>openSale();

function render(){if(!uid)return;const v=$("view");if(page==="home")v.innerHTML=home();if(page==="sales")v.innerHTML=sales();if(page==="clients")v.innerHTML=clients();if(page==="stock")v.innerHTML=stock();if(page==="purchases")v.innerHTML=purchases();if(page==="finance")v.innerHTML=finance();bindPage();bindPrivacy()}
function monthBounds(ref=now()){
 const start=new Date(ref.getFullYear(),ref.getMonth(),1);start.setHours(0,0,0,0);
 const end=new Date(ref.getFullYear(),ref.getMonth()+1,1);end.setHours(0,0,0,0);
 return {start,end};
}
function monthSalesFor(ref=now()){
 const {start,end}=monthBounds(ref);
 return (data.sales||[]).filter(s=>{const d=dt(s.createdAt);return d&&d>=start&&d<end});
}
function monthPaymentsFor(ref=now()){
 const {start,end}=monthBounds(ref);
 return (data.payments||[]).filter(p=>{const d=dt(p.createdAt);return d&&d>=start&&d<end});
}
function salePendingAmount(s){return Math.max(0,numBR(s.total||0)-numBR(s.paid||0));}
function saleCostAmount(s){
 const products=data.products||[];
 return (Array.isArray(s.items)?s.items:[]).reduce((acc,i)=>{
  const qty=numBR(i.qty??i.quantity??0),stored=numBR(i.cost??i.unitCost??i.productCost??0);
  const prod=products.find(p=>p.id===(i.productId??i.id));
  const unit=stored>0?stored:numBR(prod?.cost??0);
  return acc+qty*unit;
 },0);
}
function totals(){
 const today=now(),sales=monthSalesFor(today),payments=monthPaymentsFor(today);
 const sold=sales.reduce((a,s)=>a+numBR(s.total||0),0);
 const received=payments.reduce((a,p)=>a+numBR(p.amount||0),0);
 const pending=sales.reduce((a,s)=>a+salePendingAmount(s),0);
 const todaySales=sales.filter(s=>{const d=dt(s.createdAt);return d&&d.toDateString()===today.toDateString()}).reduce((a,s)=>a+numBR(s.total||0),0);
 return {sold,received,pending,todaySales};
}
function privacyButton(){return `<button type="button" class="privacy-toggle" id="privacyToggle" aria-label="Ocultar valores" title="Ocultar valores">👁️</button>`}
function bindPrivacy(){
 const b=$("privacyToggle");if(!b)return;
 const sync=()=>{document.body.classList.toggle("privacy-hidden",localStorage.getItem("docesDoVituHideValues")==="1");const hidden=document.body.classList.contains("privacy-hidden");b.classList.toggle("active",hidden);b.textContent=hidden?"🙈":"👁️";b.title=hidden?"Mostrar valores":"Ocultar valores";b.setAttribute("aria-label",hidden?"Mostrar valores":"Ocultar valores")};
 b.onclick=()=>{localStorage.setItem("docesDoVituHideValues",document.body.classList.contains("privacy-hidden")?"0":"1");sync()};sync();
}


function monthSalesData(){
 const n=now(), y=n.getFullYear(), m=n.getMonth();
 const sales=(data.sales||[]).filter(s=>{const d=dt(s.createdAt);return d&&d.getFullYear()===y&&d.getMonth()===m});
 const revenue=sales.reduce((a,s)=>a+numBR(s.total||0),0),cost=sales.reduce((a,s)=>a+saleCostAmount(s),0);
 return {sales,revenue,cost,profit:revenue-cost,days:n.getDate()};
}
function getMonthlyGoal(){const raw=Number(localStorage.getItem('docesDoVituMonthlyGoal')||3000);return Number.isFinite(raw)&&raw>0?raw:3000}
function getDailyGoal(){const raw=Number(localStorage.getItem('docesDoVituDailyGoal')||100);return Number.isFinite(raw)&&raw>0?raw:100}
function goalCardHtml(){
 const g=getMonthlyGoal(),dg=getDailyGoal(),m=monthSalesData(),t=totals(),pct=Math.min(100,m.revenue/g*100),dailyPct=Math.min(100,t.todaySales/dg*100),remaining=Math.max(0,g-m.revenue),lastDay=new Date(now().getFullYear(),now().getMonth()+1,0).getDate(),daysLeft=Math.max(1,lastDay-m.days),daily=remaining/daysLeft;
 return `<div class="finance-goals-grid"><div class="finance-goal-card"><div class="finance-goal-top"><div><h3>🎯 Meta do mês</h3><p>${esc(now().toLocaleDateString('pt-BR',{month:'long',year:'numeric'}))}</p></div><strong class="finance-goal-value private-number money-large">${money(m.revenue)}</strong></div><div class="finance-goal-bar"><div class="finance-goal-fill" style="width:${pct.toFixed(2)}%"></div></div><div class="finance-goal-foot"><span>${pct.toFixed(1).replace('.',',')}% da meta</span><span>Meta: ${money(g)}</span></div><p style="margin:7px 0 0;color:var(--muted);font-size:11px">${remaining>0?`Faltam <b style="color:var(--text)">${money(remaining)}</b> • média necessária: <b style="color:var(--text)">${money(daily)}/dia</b>`:`🎉 Meta atingida! Excedente: <b style="color:var(--text)">${money(m.revenue-g)}</b>`}</p></div><div class="finance-goal-card finance-daily-goal-card"><div class="finance-goal-top"><div><h3>📅 Meta de hoje</h3><p>${now().toLocaleDateString('pt-BR')}</p></div><strong class="finance-goal-value private-number money-large">${money(t.todaySales)}</strong></div><div class="finance-goal-bar"><div class="finance-goal-fill" style="width:${dailyPct.toFixed(2)}%"></div></div><div class="finance-goal-foot"><span>${dailyPct.toFixed(1).replace('.',',')}% da meta</span><span>Meta: ${money(dg)}</span></div><p style="margin:7px 0 0;color:var(--muted);font-size:11px">${t.todaySales<dg?`Faltam <b style="color:var(--text)">${money(dg-t.todaySales)}</b> para a meta de hoje.`:`🎉 Meta diária atingida!`}</p></div></div>`;
}
function setGoals(){
 const monthly=getMonthlyGoal(),daily=getDailyGoal();
 openModal('🎯 Configurar metas',`<div class="form"><div class="goals-settings"><div class="goal-setting-row"><div><b>🎯 Meta mensal</b><small>Faturamento que você quer alcançar no mês.</small></div><input id="monthlyGoalInput" type="number" min="1" step="0.01" value="${monthly.toFixed(2)}"></div><div class="goal-setting-row"><div><b>📅 Meta diária</b><small>Faturamento desejado por dia.</small></div><input id="dailyGoalInput" type="number" min="1" step="0.01" value="${daily.toFixed(2)}"></div></div><p style="color:var(--muted);font-size:11px;line-height:1.4">As metas ficam salvas neste aparelho e o Financeiro acompanha automaticamente o seu progresso.</p><div class="actions"><button class="secondary" id="goalCancel">Cancelar</button><button class="primary" id="goalSave">Salvar metas</button></div></div>`);
 $('goalCancel').onclick=closeModal;
 $('goalSave').onclick=()=>{const m=Number($('monthlyGoalInput').value),d=Number($('dailyGoalInput').value);if(!m||m<=0||!d||d<=0)return toast('Digite metas válidas.');localStorage.setItem('docesDoVituMonthlyGoal',String(m));localStorage.setItem('docesDoVituDailyGoal',String(d));closeModal();render();toast('Metas atualizadas!')};
}
function setMonthlyGoal(){setGoals()}
function vituInsights(){
 const m=monthSalesData(),products=data.products||[],sales=data.sales||[],qtyBy={};
 sales.forEach(s=>(s.items||[]).forEach(i=>{const n=i.name||'Produto';qtyBy[n]=(qtyBy[n]||0)+numBR(i.qty||0)}));
 const top=Object.entries(qtyBy).sort((a,b)=>b[1]-a[1])[0],low=products.filter(p=>numBR(p.stock||0)<=Number(p.minStock||2));
 const urgent=products.map(p=>{const q=qtyBy[p.name]||0,avg=q/Math.max(1,m.days);return {...p,avg,coverage:avg>0?numBR(p.stock||0)/avg:null}}).filter(p=>p.coverage!==null).sort((a,b)=>a.coverage-b.coverage)[0];
 const g=getMonthlyGoal(),remaining=Math.max(0,g-m.revenue),daysLeft=Math.max(1,new Date(now().getFullYear(),now().getMonth()+1,0).getDate()-m.days),daily=remaining/daysLeft;
 const lines=[`📊 Neste mês você faturou ${money(m.revenue)} em ${m.sales.length} venda(s).`,`💰 Lucro bruto estimado: ${money(m.profit)}.`,`📦 ${products.length} produto(s) cadastrados e ${low.length} no limite mínimo.`];

function compressClientPhoto(file){

  if(!file)return resolve("");
  if(!file.type||!file.type.startsWith("image/"))return reject(new Error("Selecione uma imagem válida."));
  const reader=new FileReader();
  reader.onerror=()=>reject(new Error("Não foi possível ler a foto."));
  reader.onload=()=>{
   const img=new Image();
   img.onerror=()=>reject(new Error("Não foi possível abrir a foto."));
   img.onload=()=>{
    const max=420, scale=Math.min(1,max/Math.max(img.width,img.height));
    const w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
    const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;
    const ctx=canvas.getContext("2d");ctx.drawImage(img,0,0,w,h);
    let quality=.78, out=canvas.toDataURL("image/jpeg",quality);
    while(out.length>260000&&quality>.48){quality-=.07;out=canvas.toDataURL("image/jpeg",quality)}
    resolve(out);
   };
   img.src=reader.result;
  };
  reader.readAsDataURL(file);
 });
}

function productSalesFor(productId){

   const date=dt(s.createdAt);

 }));

function productStartDate(productId){

 const productCreated=dt(p.createdAt);
 const firstSale=items.map(x=>x.date).sort((a,b)=>a-b)[0]||null;
 if(productCreated&&firstSale)return productCreated<firstSale?productCreated:firstSale;
 return productCreated||firstSale||null;
}
function productMonthOptions(productId){
 const start=productStartDate(productId),today=new Date();
 if(!start)return [];
 const first=new Date(start.getFullYear(),start.getMonth(),1);
 const last=new Date(today.getFullYear(),today.getMonth(),1);
 const out=[];
 for(let d=new Date(first);d<=last;d.setMonth(d.getMonth()+1)){
   const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
   const raw=d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
   out.push({key,label:raw.charAt(0).toUpperCase()+raw.slice(1)});
 }
 return out;
}
function purchaseChartData(productId,monthKey){
 const {p,items}=productSalesFor(productId); if(!p)return [];
 const options=productMonthOptions(productId);
 const chosen=monthKey||options[options.length-1]?.key;
 if(!chosen)return [];
 const [year,month]=chosen.split('-').map(Number);
 const daysInMonth=new Date(year,month,0).getDate();
 const rows=[];
 for(let day=1;day<=daysInMonth;day++){
   const start=new Date(year,month-1,day); start.setHours(0,0,0,0);
   const end=new Date(year,month-1,day+1); end.setHours(0,0,0,0);
   let revenue=0,cost=0;
   items.forEach(({item,date})=>{
     if(date<start||date>=end)return;
     const q=numBR(item.qty??item.quantity??0),price=numBR(item.price||0);
     const stored=numBR(item.cost??item.unitCost??item.productCost??0);
     const unitCost=stored>0?stored:numBR(p.cost||0);
     revenue+=price*q;cost+=unitCost*q;
   });
   rows.push({day,label:String(day),revenue,cost});
 }
 return rows;
}

 const y=v=>T+ih-(v/max)*ih;
 const x=i=>L+(rows.length===1?iw/2:i*(iw/(rows.length-1)));
 const path=key=>rows.map((r,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(r[key]).toFixed(1)).join(' ');
 const ticks=[0,.25,.5,.75,1].map(f=>max*f);
 const grid=ticks.map(v=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-9}" y="${y(v)+4}" text-anchor="end">${money(v)}</text>`).join('');
 const labels=rows.map((r,i)=>`<text x="${x(i)}" y="${H-24}" text-anchor="middle">${r.label}</text>`).join('');
 const pointsRev=rows.map((r,i)=>`<circle class="rev-point chart-hit" cx="${x(i)}" cy="${y(r.revenue)}" r="3.5" data-chart-label="Dia ${r.day} • Faturamento" data-chart-value="${money(r.revenue)}"/>`).join('');
 const pointsCost=rows.map((r,i)=>`<circle class="cost-point chart-hit" cx="${x(i)}" cy="${y(r.cost)}" r="3.2" data-chart-label="Dia ${r.day} • Custo" data-chart-value="${money(r.cost)}"/>`).join('');
 return `<div class="v140-chart-wrap"><svg class="v140-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico diário de faturamento e custo do produto"><g>${grid}${labels}</g><path class="rev-line" d="${path('revenue')}"/><path class="cost-line" d="${path('cost')}"/>${pointsRev}${pointsCost}</svg></div>`;
}

function normNfcName(value){

 if(!qty||qty>9999)return null;

async function confirmNfcReceipt(items){

 for(let i=0;i<items.length;i++){const productId=$("nfcProduct"+i)?.value||'';const packs=Math.floor(numBR($("nfcPacks"+i)?.value)||0),size=Math.max(1,Math.floor(numBR($("nfcSize"+i)?.value)||1)),total=numBR($("nfcTotal"+i)?.value)||0;if(!productId){toast(`Vincule o produto do item ${i+1} ou remova-o.`);return}if(packs<1||size<1||total<=0){toast(`Confira quantidade, conversão e valor do item ${i+1}.`);return}prepared.push({productId,packs,size,total})}

 try{const refs=prepared.map(()=>doc(col('purchases')));await runTransaction(db,async tx=>{for(let i=0;i<prepared.length;i++){const x=prepared[i],ref=doc(col('products'),x.productId),snap=await tx.get(ref);if(!snap.exists())throw Error('Produto não encontrado.');const p=snap.data(),before=numBR(p.stock||0),oldCost=numBR(p.cost||0),units=x.packs*x.size,unit=x.total/units,after=before+units,avg=((oldCost*before)+x.total)/after;tx.update(ref,{stock:after,cost:Math.round(avg*10000)/10000,purchaseUnit:String(p.purchaseUnit||'kit'),unitsPerPackage:x.size});tx.set(refs[i],{productId:x.productId,productName:p.name||'',quantity:units,total:x.total,unitCost:Math.round(unit*10000)/10000,purchaseQuantity:x.packs,purchaseUnit:String(p.purchaseUnit||'kit'),unitsPerPackage:x.size,source:'nfce_photo',createdByUid:uid,createdByName:currentUserName,createdAt:serverTimestamp()})}});await logAction('Recebimento por NFC-e',`${prepared.length} item(ns) conferido(s) • ${prepared.reduce((a,x)=>a+x.packs*x.size,0)} unidades adicionadas`);closeModal();render();toast('NFC-e conferida e estoque atualizado!')}catch(e){console.error(e);toast('Não foi possível lançar a NFC-e: '+(e.message||'verifique a conexão.'))}finally{btn.disabled=false;btn.dataset.busy='0'}
}

function analysisHtml(kind,periods,selectedMonthKey){
 const sales=data.sales||[], nowD=now(), points=[];
 const sumBetween=(start,end)=>sales.filter(v=>{const x=dt(v.createdAt);return x&&x>=start&&x<end}).reduce((a,v)=>a+numBR(v.total||0),0);
 if(kind==="hour")for(let h=0;h<24;h++){let start=new Date(nowD);start.setHours(h,0,0,0);let end=new Date(start);end.setHours(h+1,0,0,0);points.push({label:String(h).padStart(2,"0")+"h",value:sumBetween(start,end)})}
 if(kind==="day")for(let i=6;i>=0;i--){let start=new Date(nowD);start.setHours(0,0,0,0);start.setDate(start.getDate()-i);let end=new Date(start);end.setDate(end.getDate()+1);points.push({label:start.toLocaleDateString("pt-BR",{weekday:"short"}).replace(".",""),value:sumBetween(start,end)})}
 if(kind==="week"){let base=new Date(nowD);base.setHours(0,0,0,0);base.setDate(base.getDate()-((base.getDay()+6)%7));for(let i=7;i>=0;i--){let start=new Date(base);start.setDate(start.getDate()-i*7);let end=new Date(start);end.setDate(end.getDate()+7);points.push({label:start.getDate()+"/"+(start.getMonth()+1),value:sumBetween(start,end)})}}
 let monthLabel="";
 if(kind==="month"){
  const md=monthKeyDate(selectedMonthKey),days=new Date(md.getFullYear(),md.getMonth()+1,0).getDate();monthLabel=md.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
  for(let d=1;d<=days;d++){let start=new Date(md.getFullYear(),md.getMonth(),d);start.setHours(0,0,0,0);let end=new Date(start);end.setDate(end.getDate()+1);points.push({label:String(d),value:sumBetween(start,end)})}
 }
 const total=points.reduce((a,p)=>a+p.value,0),max=Math.max(...points.map(p=>p.value),1),w=Math.max(620,points.length*20),h=220,pad=24,den=Math.max(points.length-1,1);
 const coords=points.map((p,i)=>({x:pad+i*(w-2*pad)/den,y:h-pad-(p.value/max)*(h-2*pad)}));
 const pts=coords.map(p=>`${p.x},${p.y}`).join(" "),step=Math.max(1,Math.ceil(points.length/10));
 const labels=points.map((p,i)=>i%step===0?`<text x="${coords[i].x}" y="${h-3}" text-anchor="middle">${esc(p.label)}</text>`:"").join("");
 const dots=coords.map((p,i)=>`<circle class="dot chart-hit" cx="${p.x}" cy="${p.y}" r="5" data-chart-label="${esc(points[i].label)}" data-chart-value="${money(points[i].value)}"></circle>`).join("");
 const monthSelect=kind==="month"?`<div class="analysis-month-row"><label>Escolha o mês para analisar</label><select id="analysisMonthSelect" class="month-select">${availableAnalysisMonths().map(o=>`<option value="${o.key}" ${o.key===selectedMonthKey?"selected":""}>${esc(o.label)}</option>`).join("")}</select></div>`:"";
 const sub=kind==="month"?monthLabel:periods[kind];
 return `${monthSelect}<div class="analysis-card"><div class="analysis-head"><div><small style="color:var(--muted)">${esc(sub)}</small><div style="margin-top:3px">Total vendido</div></div><strong class="private-number money-large">${money(total)}</strong></div><div class="chart"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline class="line" points="${pts}"/>${dots}${labels}</svg></div></div>${kind==="month"?`<div class="analysis-card"><div class="section-title"><span>Vendas no mês</span><b class="private-number money-small">${money(total)}</b></div><small style="color:var(--muted)">${points.length} dias exibidos, incluindo dias sem venda.</small></div>`:""}`;
}

   const ops=[];
   const originalTotal=Number(np.price||0)*nq,discountAmount=Math.max(0,originalTotal-nt),discountPct=originalTotal?discountAmount/originalTotal*100:0;
   await runTransaction(db,async tx=>{const oldRef=op?doc(col("products"),op.id):null,newRef=doc(col("products"),np.id),saleRef=doc(col("sales"),s.id);const refs=oldRef&&op.id===np.id?[oldRef]:oldRef?[oldRef,newRef]:[newRef];const snaps=[];for(const ref of refs)snaps.push(await tx.get(ref));const oldSnap=oldRef?snaps[0]:null,newSnap=oldRef?(op.id===np.id?snaps[0]:snaps[1]):snaps[0];if(!newSnap.exists())throw Error("Produto não encontrado.");if(oldRef&&op.id===np.id){const available=numBR(newSnap.data().stock||0)+oq;if(nq>available)throw Error("Estoque insuficiente.");tx.update(newRef,{stock:available-nq});}else{if(nq>numBR(newSnap.data().stock||0))throw Error("Estoque insuficiente.");if(oldRef&&oldSnap?.exists())tx.update(oldRef,{stock:numBR(oldSnap.data().stock||0)+oq});tx.update(newRef,{stock:numBR(newSnap.data().stock||0)-nq});}tx.update(saleRef,{clientId:nc?.id||"",clientName:nc?.name||"Venda balcão",items:[{productId:np.id,name:np.name,qty:nq,price:nt/nq,originalPrice:np.price,cost:numBR(newSnap.data().cost||0)}],originalTotal,total:nt,discountAmount,discountPct,paid,updatedAt:serverTimestamp()});});
   const ps=await getDocs(col("payments"));ps.docs.filter(d=>d.data()?.saleId===s.id).forEach(d=>ops.push(deleteDoc(doc(col("payments"),d.id))));
   if(paid>0)ops.push(addDoc(col("payments"),{saleId:s.id,clientId:nc?.id||"",clientName:nc?.name||"Venda balcão",amount:paid,createdAt:serverTimestamp(),method:s.paymentMethod||"Pagamento"}));
   await Promise.all(ops);closeModal();render();toast("Venda alterada com sucesso!");
  }catch(e){console.error(e);toast(e.message||"Não foi possível alterar a venda.")}finally{btn.dataset.busy=""}
 };
}
function confirmDeleteSale(s){
 openModal("Excluir venda?",`<div class="form"><p>Tem certeza que deseja excluir <b>${esc(s.clientName||"Venda balcão")}</b> no valor de <b>${money(s.total)}</b>?</p><p><small>O estoque será devolvido e os pagamentos vinculados serão removidos.</small></p><div class="field"><label>Digite EXCLUIR para confirmar</label><input id="delSaleText" autocomplete="off"></div><div class="actions"><button class="secondary" id="delCancel">Cancelar</button><button class="primary" id="delDo" disabled>Excluir venda</button></div></div>`);
 $("delCancel").onclick=closeModal;
 $("delSaleText").oninput=e=>$("delDo").disabled=e.target.value.trim().toUpperCase()!=="EXCLUIR";
 $("delDo").onclick=async()=>{
  const btn=$("delDo");if(btn.dataset.busy)return;btn.dataset.busy="1";
  try{await runTransaction(db,async tx=>{const saleRef=doc(col("sales"),s.id),saleSnap=await tx.get(saleRef);if(!saleSnap.exists())throw Error("Venda não encontrada.");const sale=saleSnap.data(),byProduct=new Map();for(const i of(sale.items||[])){const qty=numBR(i.qty||0);if(qty>0)byProduct.set(i.productId,(byProduct.get(i.productId)||0)+qty);}for(const [pid,qty] of byProduct){const ref=doc(col("products"),pid),snap=await tx.get(ref);if(snap.exists())tx.update(ref,{stock:numBR(snap.data().stock||0)+qty});}tx.delete(saleRef);});const ps=await getDocs(col("payments"));await Promise.all(ps.docs.filter(d=>d.data()?.saleId===s.id).map(d=>deleteDoc(d.ref)));await logAction("Venda excluída",`${s.clientName||"Venda balcão"} • ${money(s.total)}`);closeModal();render();toast("Venda excluída com sucesso!");}catch(e){console.error(e);toast(e.message||"Não foi possível excluir a venda.")}finally{btn.dataset.busy=""}
 };
}

    </div>`).join("")||'<div class="empty">Nenhum cliente cadastrado.</div>'}

 document.querySelectorAll("[data-client-status]").forEach(sel=>{

     const clientId=sel.dataset.clientStatus;

     sel.disabled=true;
     try{

         statusUpdatedAt:serverTimestamp(),

     }finally{
       sel.disabled=false;
     }
   };
 });
}


function applyTheme(theme){
  const dark = theme === "dark";
  document.body.classList.toggle("theme-dark", dark);
  document.documentElement.classList.toggle("theme-dark", dark);
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", dark ? "#141210" : "#5b321f");
  const btn=document.getElementById("themeToggle");
  if(btn) btn.textContent = dark ? "☀️  Modo claro" : "🌙  Modo escuro";
}
function toggleTheme(){
  const next=document.body.classList.contains("theme-dark") ? "light" : "dark";
  localStorage.setItem("dv-theme",next);
  applyTheme(next);
}
applyTheme(localStorage.getItem("dv-theme")==="dark" ? "dark" : "light");

async function openActivityLog(){
 let rows=[];
 try{
  const snap=await getDocs(col("logs"));
  rows=snap.docs.map(d=>({id:d.id,...d.data()}));
  data.logs=rows;
 }catch(e){
  console.error(e);
  toast("Não foi possível carregar o log. Verifique as permissões do Firebase.");
 }
 rows=rows.slice().sort((a,b)=>(dt(b.createdAt)||0)-(dt(a.createdAt)||0));
 const types=[...new Set(rows.map(x=>x.action).filter(Boolean))];
 openModal("Log de atividades",`<div class="form">
  <div class="row"><div class="field"><label>Usuário</label><select id="logUser"><option value="all">Todos</option>${[...new Set(rows.map(x=>x.createdByName||"Desconhecido"))].map(n=>`<option>${esc(n)}</option>`).join("")}</select></div><div class="field"><label>Ação</label><select id="logAction"><option value="all">Todas</option>${types.map(n=>`<option>${esc(n)}</option>`).join("")}</select></div></div>
  <div id="logList" class="list" style="max-height:55vh;overflow:auto"></div>
 </div>`);
 const draw=()=>{const u=$("logUser").value,a=$("logAction").value;const filtered=rows.filter(x=>(u==="all"||x.createdByName===u)&&(a==="all"||x.action===a));$("logList").innerHTML=filtered.map(x=>`<div class="item"><div class="avatar">${x.action==="Nova venda"?"🛒":x.action.includes("Estoque")?"📦":x.action==="Pagamento"?"💰":x.action.includes("Cliente")?"👤":"📋"}</div><div class="item-main"><b>${esc(x.action||"Atividade")}</b><small>${dateTime(x.createdAt)} • ${esc(x.createdByName||"Usuário")}</small><small>${esc(x.details||"")}</small></div></div>`).join("")||'<div class="empty">Nenhuma atividade encontrada.</div>'};

}
